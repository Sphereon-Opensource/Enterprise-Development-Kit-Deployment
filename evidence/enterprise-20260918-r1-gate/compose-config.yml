name: edk-customer-r1
networks:
  appnet:
    name: edk-customer-r1_appnet
  edge:
    external: true
    name: edge
  platform-db-net:
    name: edk-customer-r1_platform-db-net
  tenant-db-net:
    name: edk-customer-r1_tenant-db-net
services:
  admin-console:
    depends_on:
      enterprise-blob:
        condition: service_healthy
        required: true
      enterprise-platform:
        condition: service_healthy
        required: true
    environment:
      - ADMIN_CONSOLE_ALLOW_LOCAL_DEVELOPMENT=false
      - ADMIN_CONSOLE_AUDIT_BASE_URL=http://enterprise-platform:18080
      - ADMIN_CONSOLE_BFF_OAUTH_TRUSTED_INTERNAL_HTTP_ORIGINS=http://enterprise-platform:18080,http://enterprise-blob:8080
      - ADMIN_CONSOLE_IDENTITY_BASE_URL=http://enterprise-tenant-as:18083
      - ADMIN_CONSOLE_ISSUER_BASE_URL=http://enterprise-issuer:8080
      - ADMIN_CONSOLE_MODE=PLATFORM
      - ADMIN_CONSOLE_PLATFORM_BASE_URL=http://enterprise-platform:18080
      - ADMIN_CONSOLE_PUBLIC_ORIGIN=https://platform.e2e.nk.sphereon.com
      - ADMIN_CONSOLE_TENANT_AS_BASE_URL=http://enterprise-tenant-as:18083
      - ADMIN_CONSOLE_TENANT_DID_BASE_URL=http://enterprise-did:8080
      - ADMIN_CONSOLE_TENANT_KMS_BASE_URL=http://enterprise-tenant-kms:8080
      - ADMIN_CONSOLE_THEME_BASE_URL=http://enterprise-blob:8080
      - ADMIN_CONSOLE_TRUSTED_INGRESS_MODE=X_FORWARDED
      - ADMIN_CONSOLE_TRUST_DOMAIN_BASE_URL=http://enterprise-platform:18080
      - ADMIN_CONSOLE_VERIFIER_BASE_URL=http://enterprise-verifier:8080
      - ADMIN_CONSOLE_WORKLOAD_CLIENT_ID=admin-console-portal-bff
      - ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET=${EDK_ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET:?Set
        EDK_ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET}
      - NEXT_PUBLIC_BASE_PATH=/admin-console
      - NEXT_PUBLIC_PLATFORM_AUDIENCE=enterprise-platform
      - NEXT_PUBLIC_TENANT_DID_AUDIENCE=enterprise-tenant-did
      - NEXT_PUBLIC_TENANT_ISSUER_AUDIENCE=enterprise-issuer
      - NEXT_PUBLIC_TENANT_VERIFIER_AUDIENCE=enterprise-verifier
      - NEXT_PUBLIC_THEME_AUDIENCE=enterprise-blob
      - PORT=3000
      - ADMIN_CONSOLE_TRUSTED_INGRESS_HOPS=1
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 20s
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/admin-console/health
      timeout: 5s
    image: nexus.sphereon.com/edk-docker/admin-console:${EDK_TAG:-0.25.0-SNAPSHOT}
    networks:
      appnet: {}
  admin-console-tenant:
    depends_on:
      enterprise-blob:
        condition: service_healthy
        required: true
      enterprise-platform:
        condition: service_healthy
        required: true
      enterprise-tenant-as:
        condition: service_healthy
        required: true
    environment:
      - ADMIN_CONSOLE_ALLOW_LOCAL_DEVELOPMENT=false
      - ADMIN_CONSOLE_BFF_OAUTH_TRUSTED_INTERNAL_HTTP_ORIGINS=http://enterprise-platform:18080,http://enterprise-tenant-as:18083,http://enterprise-blob:8080
      - ADMIN_CONSOLE_DEVELOPER_CONSOLE_BASE_URL=http://enterprise-platform:18080
      - ADMIN_CONSOLE_IDENTITY_BASE_URL=http://enterprise-tenant-as:18083
      - ADMIN_CONSOLE_ISSUER_BASE_URL=http://enterprise-issuer:8080
      - ADMIN_CONSOLE_MODE=TENANT
      - ADMIN_CONSOLE_PLATFORM_AUTHORIZATION_BASE_URL=https://platform.e2e.nk.sphereon.com
      - ADMIN_CONSOLE_PLATFORM_BASE_URL=http://enterprise-platform:18080
      - ADMIN_CONSOLE_PLATFORM_BOOTSTRAP_BASE_URL=http://enterprise-platform:18080/api/platform/bootstrap/v1
      - ADMIN_CONSOLE_PLATFORM_ISSUER=https://platform.e2e.nk.sphereon.com
      - ADMIN_CONSOLE_PLATFORM_TOKEN_URL=http://enterprise-platform:18080/token
      - ADMIN_CONSOLE_PUBLIC_ORIGIN=https://platform.e2e.nk.sphereon.com
      - ADMIN_CONSOLE_TENANT_AS_BASE_URL=http://enterprise-tenant-as:18083
      - ADMIN_CONSOLE_TENANT_CONTEXT_URL=http://enterprise-platform:18080/api/platform/bootstrap/v1/admin-console-context
      - ADMIN_CONSOLE_TENANT_DID_BASE_URL=http://enterprise-did:8080
      - ADMIN_CONSOLE_TENANT_KMS_BASE_URL=http://enterprise-tenant-kms:8080
      - ADMIN_CONSOLE_THEME_BASE_URL=http://enterprise-blob:8080
      - ADMIN_CONSOLE_TRUSTED_INGRESS_HOPS=1
      - ADMIN_CONSOLE_TRUSTED_INGRESS_MODE=X_FORWARDED
      - ADMIN_CONSOLE_TRUST_DOMAIN_BASE_URL=http://enterprise-platform:18080
      - ADMIN_CONSOLE_VERIFIER_BASE_URL=http://enterprise-verifier:8080
      - NEXT_PUBLIC_BASE_PATH=/admin-console
      - NEXT_PUBLIC_TENANT_DID_AUDIENCE=enterprise-tenant-did
      - NEXT_PUBLIC_TENANT_ISSUER_AUDIENCE=enterprise-issuer
      - NEXT_PUBLIC_TENANT_VERIFIER_AUDIENCE=enterprise-verifier
      - NEXT_PUBLIC_THEME_AUDIENCE=enterprise-blob
      - PORT=3000
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 20s
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/admin-console/health
      timeout: 5s
    image: nexus.sphereon.com/edk-docker/admin-console:${EDK_TAG:-0.25.0-SNAPSHOT}
    networks:
      appnet: null
  enterprise-blob:
    depends_on:
      enterprise-platform:
        condition: service_healthy
        required: true
      enterprise-tenant-as:
        condition: service_healthy
        required: true
      otel-collector:
        condition: service_started
        required: true
      tenant-postgres:
        condition: service_healthy
        required: true
    environment:
      - APP_PROFILE=container
      - EDK_DEPLOYMENT_MODE=${EDK_DEPLOYMENT_MODE:-prod}
      - EDK_INTERNAL_CLIENT_SECRET=${EDK_INTERNAL_CLIENT_SECRET_BLOB:?Set EDK_INTERNAL_CLIENT_SECRET_BLOB}
      - EDK_KEYSTORE_PASSWORD=${EDK_KEYSTORE_PASSWORD}
      - EDK_OWNER_INITIAL_CREDENTIAL=${EDK_OWNER_INITIAL_CREDENTIAL}
      - EDK_PLATFORM_BASE_DOMAIN=e2e.nk.sphereon.com
      - EDK_PLATFORM_PUBLIC_URL=https://platform.e2e.nk.sphereon.com
      - EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD=${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Set
        EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}
      - EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD=${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Set
        EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
      - EDK_TENANT_DB_HOST=tenant-postgres
      - EDK_TENANT_DB_NAME=${EDK_TENANT_DB_NAME:-tenant}
      - EDK_TENANT_DB_PASSWORD=${EDK_TENANT_DB_PASSWORD}
      - EDK_TENANT_DB_USERNAME=${EDK_TENANT_DB_USERNAME:-edk_tenant}
      - EDK_TRUST_TENANT_REGISTRY_ISSUERS=true
      - EXTERNAL_BASE_URL=
      - GRPC_AUTH_MODE=service-jwt
      - GRPC_ENABLED=false
      - PORT=8080
      - REST_ENABLED=true
      - REST_PORT=8080
      - SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY=${SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY:?Generate
        the secret-authority key window before starting the stack}
      - SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS=${SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS:?Generate
        the secret-authority key window before starting the stack}
      - SPHEREON_CONFIG_LOCATION=/app/config
    expose:
      - "8080"
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 20s
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf ''GET /health HTTP/1.0\r\nHost:
          platform.e2e.nk.sphereon.com\r\n\r\n'' >&3 && head -n1 <&3 | grep -Eq ''
          (200|503) '''
      timeout: 5s
    image: nexus.sphereon.com/edk-docker/service-data:${EDK_TAG:-0.25.0-SNAPSHOT}
    networks:
      appnet: null
      tenant-db-net: null
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: D:\git\VDX-infra\customer\edk\compose\config\blob.application.yml
        target: /app/config/application.yml
        type: bind
      - read_only: true
        source: ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem
        target: /app/secret-authority/public/central-permit.pub.pem
        type: volume
        volume: {}
      - read_only: true
        source: ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-blob
        target: /app/secret-authority/workload
        type: volume
        volume: {}
      - source: blob-store-data
        target: /app/blobs
        type: volume
        volume: {}
  enterprise-did:
    depends_on:
      enterprise-platform:
        condition: service_healthy
        required: true
      enterprise-tenant-kms:
        condition: service_healthy
        required: true
      otel-collector:
        condition: service_started
        required: true
      tenant-postgres:
        condition: service_healthy
        required: true
    environment:
      - APP_PROFILE=container
      - EDK_DEPLOYMENT_MODE=${EDK_DEPLOYMENT_MODE:-prod}
      - EDK_INTERNAL_CLIENT_SECRET=${EDK_INTERNAL_CLIENT_SECRET_DID:?Set EDK_INTERNAL_CLIENT_SECRET_DID}
      - EDK_KEYSTORE_PASSWORD=${EDK_KEYSTORE_PASSWORD}
      - EDK_OWNER_INITIAL_CREDENTIAL=${EDK_OWNER_INITIAL_CREDENTIAL}
      - EDK_PLATFORM_BASE_DOMAIN=e2e.nk.sphereon.com
      - EDK_PLATFORM_PUBLIC_URL=https://platform.e2e.nk.sphereon.com
      - EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD=${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Set
        EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}
      - EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD=${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Set
        EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
      - EDK_TENANT_DB_HOST=tenant-postgres
      - EDK_TENANT_DB_NAME=${EDK_TENANT_DB_NAME:-tenant}
      - EDK_TENANT_DB_PASSWORD=${EDK_TENANT_DB_PASSWORD}
      - EDK_TENANT_DB_USERNAME=${EDK_TENANT_DB_USERNAME:-edk_tenant}
      - EDK_TRUST_TENANT_REGISTRY_ISSUERS=true
      - EXTERNAL_BASE_URL=
      - GRPC_AUTH_MODE=service-jwt
      - PORT=8080
      - REST_PORT=8080
      - SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY=${SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY:?Generate
        the secret-authority key window before starting the stack}
      - SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS=${SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS:?Generate
        the secret-authority key window before starting the stack}
      - SPHEREON_CONFIG_LOCATION=/app/config
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 20s
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf ''GET /health HTTP/1.0\r\n\r\n''
          >&3 && line=$$(head -n1 <&3) && echo "$$line" | grep -Eq '' (200|204) ''
          && exit 0; echo "$$line" | grep -q '' 503 '' || exit 1; exec 4<>/dev/tcp/enterprise-platform/18080
          && printf ''GET /api/platform/setup/v1/status HTTP/1.0\r\nHost: platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN
          must be set explicitly}\r\n\r\n'' >&4 && head -n1 <&4 | grep -q '' 200 '''
      timeout: 5s
    image: nexus.sphereon.com/edk-docker/enterprise-did:${EDK_TAG:-0.25.0-SNAPSHOT}
    networks:
      appnet: null
      tenant-db-net: null
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: D:\git\VDX-infra\customer\edk\compose\config\did.application.yml
        target: /app/config/application.yml
        type: bind
      - read_only: true
        source: ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem
        target: /app/secret-authority/public/central-permit.pub.pem
        type: volume
        volume: {}
      - read_only: true
        source: ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-data
        target: /app/secret-authority/workload
        type: volume
        volume: {}
  enterprise-issuer:
    depends_on:
      enterprise-platform:
        condition: service_healthy
        required: true
      enterprise-tenant-as:
        condition: service_healthy
        required: true
      enterprise-tenant-kms:
        condition: service_healthy
        required: true
      otel-collector:
        condition: service_started
        required: true
      tenant-postgres:
        condition: service_healthy
        required: true
    environment:
      - APP_PROFILE=container
      - EDK_DEPLOYMENT_MODE=${EDK_DEPLOYMENT_MODE:-prod}
      - EDK_INTERNAL_CLIENT_SECRET=${EDK_INTERNAL_CLIENT_SECRET_ISSUER:?Set EDK_INTERNAL_CLIENT_SECRET_ISSUER}
      - EDK_KEYSTORE_PASSWORD=${EDK_KEYSTORE_PASSWORD}
      - EDK_OWNER_INITIAL_CREDENTIAL=${EDK_OWNER_INITIAL_CREDENTIAL}
      - EDK_PIPELINE_BLIND_INDEX_KEY=${EDK_PIPELINE_BLIND_INDEX_KEY}
      - EDK_PIPELINE_MASTER_KEK=${EDK_PIPELINE_MASTER_KEK}
      - EDK_PLATFORM_BASE_DOMAIN=e2e.nk.sphereon.com
      - EDK_PLATFORM_PUBLIC_URL=https://platform.e2e.nk.sphereon.com
      - EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD=${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Set
        EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}
      - EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD=${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Set
        EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
      - EDK_TENANT_DB_HOST=tenant-postgres
      - EDK_TENANT_DB_NAME=${EDK_TENANT_DB_NAME:-tenant}
      - EDK_TENANT_DB_PASSWORD=${EDK_TENANT_DB_PASSWORD}
      - EDK_TENANT_DB_USERNAME=${EDK_TENANT_DB_USERNAME:-edk_tenant}
      - EDK_TRUST_TENANT_REGISTRY_ISSUERS=true
      - EXTERNAL_BASE_URL=
      - GRPC_AUTH_MODE=service-jwt
      - PORT=8080
      - REST_PORT=8080
      - SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY=${SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY:?Generate
        the secret-authority key window before starting the stack}
      - SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS=${SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS:?Generate
        the secret-authority key window before starting the stack}
      - SPHEREON_CONFIG_LOCATION=/app/config
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 20s
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf ''GET /health HTTP/1.0\r\nHost:
          platform.e2e.nk.sphereon.com\r\n\r\n'' >&3 && head -n1 <&3 | grep -Eq ''
          (200|503) '''
      timeout: 5s
    image: nexus.sphereon.com/edk-docker/enterprise-issuer:${EDK_TAG:-0.25.0-SNAPSHOT}
    networks:
      appnet: null
      tenant-db-net: null
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: D:\git\VDX-infra\customer\edk\compose\config\issuer.application.yml
        target: /app/config/application.yml
        type: bind
      - read_only: true
        source: ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem
        target: /app/secret-authority/public/central-permit.pub.pem
        type: volume
        volume: {}
      - read_only: true
        source: ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-oid4vci
        target: /app/secret-authority/workload
        type: volume
        volume: {}
  enterprise-platform:
    depends_on:
      otel-collector:
        condition: service_started
        required: true
      platform-postgres:
        condition: service_healthy
        required: true
      tenant-postgres:
        condition: service_healthy
        required: true
    environment:
      - ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET=${EDK_ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET:?Set
        EDK_ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET}
      - APP_PROFILE=container
      - AUTHORIZATION_SERVER_MIGRATION_RESUME_FAILED=${AUTHORIZATION_SERVER_MIGRATION_RESUME_FAILED:-false}
      - DATABASE_APP_DEFAULT_DATABASE=${EDK_PLATFORM_DB_NAME:-platform}
      - DATABASE_APP_DEFAULT_DIALECT=postgresql
      - DATABASE_APP_DEFAULT_HOST=platform-postgres
      - DATABASE_APP_DEFAULT_ISOLATION=shared
      - DATABASE_APP_DEFAULT_PASSWORD=${EDK_PLATFORM_DB_PASSWORD}
      - DATABASE_APP_DEFAULT_PORT=5432
      - DATABASE_APP_DEFAULT_USERNAME=${EDK_PLATFORM_DB_USERNAME:-edk_platform}
      - DATABASE_APP_TENANT_MIGRATOR_DATABASE=${EDK_TENANT_DB_NAME:-tenant}
      - DATABASE_APP_TENANT_MIGRATOR_DIALECT=postgresql
      - DATABASE_APP_TENANT_MIGRATOR_HOST=tenant-postgres
      - DATABASE_APP_TENANT_MIGRATOR_ISOLATION=shared
      - DATABASE_APP_TENANT_MIGRATOR_PASSWORD=${EDK_TENANT_DB_PASSWORD}
      - DATABASE_APP_TENANT_MIGRATOR_PORT=5432
      - DATABASE_APP_TENANT_MIGRATOR_USERNAME=${EDK_TENANT_DB_USERNAME:-edk_tenant}
      - DATABASE_TENANTS_DEFAULT_DATABASE=${EDK_TENANT_DB_NAME:-tenant}
      - DATABASE_TENANTS_DEFAULT_DIALECT=postgresql
      - DATABASE_TENANTS_DEFAULT_HOST=tenant-postgres
      - DATABASE_TENANTS_DEFAULT_ISOLATION=schema
      - DATABASE_TENANTS_DEFAULT_PASSWORD=${EDK_TENANT_DB_PASSWORD}
      - DATABASE_TENANTS_DEFAULT_PORT=5432
      - DATABASE_TENANTS_DEFAULT_SCHEMA_PATTERN=tenant_{id}
      - DATABASE_TENANTS_DEFAULT_USERNAME=${EDK_TENANT_DB_USERNAME:-edk_tenant}
      - EDK_DEPLOYMENT_MODE=${EDK_DEPLOYMENT_MODE:-prod}
      - EDK_INTERNAL_CLIENT_SECRET_BLOB=${EDK_INTERNAL_CLIENT_SECRET_BLOB:?Set EDK_INTERNAL_CLIENT_SECRET_BLOB}
      - EDK_INTERNAL_CLIENT_SECRET_DID=${EDK_INTERNAL_CLIENT_SECRET_DID:?Set EDK_INTERNAL_CLIENT_SECRET_DID}
      - EDK_INTERNAL_CLIENT_SECRET_EMAIL=${EDK_INTERNAL_CLIENT_SECRET_EMAIL:?Set EDK_INTERNAL_CLIENT_SECRET_EMAIL}
      - EDK_INTERNAL_CLIENT_SECRET_ISSUER=${EDK_INTERNAL_CLIENT_SECRET_ISSUER:?Set
        EDK_INTERNAL_CLIENT_SECRET_ISSUER}
      - EDK_INTERNAL_CLIENT_SECRET_TENANT_AS=${EDK_INTERNAL_CLIENT_SECRET_TENANT_AS:?Set
        EDK_INTERNAL_CLIENT_SECRET_TENANT_AS}
      - EDK_INTERNAL_CLIENT_SECRET_TENANT_KMS=${EDK_INTERNAL_CLIENT_SECRET_TENANT_KMS:?Set
        EDK_INTERNAL_CLIENT_SECRET_TENANT_KMS}
      - EDK_INTERNAL_CLIENT_SECRET_VERIFIER=${EDK_INTERNAL_CLIENT_SECRET_VERIFIER:?Set
        EDK_INTERNAL_CLIENT_SECRET_VERIFIER}
      - EDK_KEYSTORE_PASSWORD=${EDK_KEYSTORE_PASSWORD}
      - EDK_OWNER_INITIAL_CREDENTIAL=${EDK_OWNER_INITIAL_CREDENTIAL}
      - EDK_PLATFORM_BASE_DOMAIN=e2e.nk.sphereon.com
      - EDK_PLATFORM_DB_HOST=platform-postgres
      - EDK_PLATFORM_DB_NAME=${EDK_PLATFORM_DB_NAME:-platform}
      - EDK_PLATFORM_DB_PASSWORD=${EDK_PLATFORM_DB_PASSWORD}
      - EDK_PLATFORM_DB_USERNAME=${EDK_PLATFORM_DB_USERNAME:-edk_platform}
      - EDK_PLATFORM_PUBLIC_URL=https://platform.e2e.nk.sphereon.com
      - EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD=${EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD:?Set
        EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD}
      - EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD=${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Set
        EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}
      - EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD=${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Set
        EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
      - EDK_TENANT_DB_HOST=tenant-postgres
      - EDK_TENANT_DB_NAME=${EDK_TENANT_DB_NAME:-tenant}
      - EDK_TENANT_DB_PASSWORD=${EDK_TENANT_DB_PASSWORD}
      - EDK_TENANT_DB_USERNAME=${EDK_TENANT_DB_USERNAME:-edk_tenant}
      - EDK_TRUST_TENANT_REGISTRY_ISSUERS=true
      - EXTERNAL_BASE_URL=https://platform.e2e.nk.sphereon.com
      - GRPC_AUTH_MODE=service-jwt
      - GRPC_ENABLED=true
      - GRPC_PORT=9090
      - ONBOARDING_UI_BASE_URL=https://platform.e2e.nk.sphereon.com
      - PORT=18080
      - REST_ENABLED=false
      - REST_PORT=18080
      - SECRET_AUTHORITY_CENTRAL_ASSERTION_VERIFICATION_KEYS=${SECRET_AUTHORITY_CENTRAL_ASSERTION_VERIFICATION_KEYS:?Generate
        the secret-authority key window before starting the stack}
      - SECRET_AUTHORITY_CENTRAL_PERMIT_SIGNING_KEY=${SECRET_AUTHORITY_CENTRAL_PERMIT_SIGNING_KEY:?Generate
        the secret-authority key window before starting the stack}
