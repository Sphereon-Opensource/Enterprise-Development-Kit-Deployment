# Customer EDK stack gateway behind the shared edge terminator.
#
# TLS, ACME, and public 80/443 ownership remain at the shared edge. This
# gateway listens only on its container port 80 and trusts forwarded headers
# solely from the configured, pinned edge-network subnet.

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs:
        - "172.16.100.0/24"

providers:
  file:
    filename: /etc/traefik/dynamic/dynamic.yml
    watch: true

log:
  level: INFO

accessLog: {}

api:
  dashboard: false
