application:
  bff:
    oauth-client:
      workload-audience: application-bff-oauth-client
      workload-scope: bff.oauth
      workload-client-id: admin-console-portal-bff
      kms:
        provider-id: platform
        encryption-key-id: application-bff-oauth-client-aead
        handle-hmac-key-id: application-bff-oauth-client-owner-hmac
  tenant:
    # Canonical application control-plane tenant. Platform-admin secret transitions require the
    # authenticated tenant to match this value and fail closed on a missing/mismatched identity.
    id: "platform"
    hosted-as:
      issuer: ${env:EXTERNAL_BASE_URL}
    owner:
      # Interactive first-run setup supplies the real operator email and display
      # name as a request-scoped override. Never seed a placeholder customer.
      roles: platform-admin
app:
  # Dev unlocks the break-glass operator credential below; prod requires the
  # invitation flow instead.
  deployment-mode: ${env:EDK_DEPLOYMENT_MODE:prod}
auth:
  login:
    require-application: false
platform:
  # Workloads that read hosted AS authority: the tenant AS signing runtime and the tenant KMS
  # custody checks for hosted AS signing keys.
  authorization-server-authority:
    allowed-service-actors: tenant-as-service,kms-service
  config-distribution:
    allowed-service-actors: tenant-as-service,issuer-service,kms-service,did-service,blob-service,verifier-service
  config:
    mount-path: /app/config
  onboarding:
    installation-base-domain: ${env:EDK_PLATFORM_BASE_DOMAIN}
    # Interactive setup-screen mode. The anonymous setup surface remains open
    # until the operator imports a protected license bundle and completes
    # bootstrap. The setup service creates the license recipient key in the
    # platform license system KMS on first license-request generation.
    trust-bundle-path: /app/license/license-root-ca.pem
    operator:
      # Interactive first-run setup supplies the real operator identity. The
      # customer deployment contains no fallback or example account.
      initial-credential: ${env:EDK_OWNER_INITIAL_CREDENTIAL}
  setup:
    kms:
      tenant-id: "platform"
      principal-id: platform-setup
    license-request:
      default-alias: platform-license-request
      default-algorithm: ECDSA_SHA256
      default-use: sig
# Documentation site playground. When enabled, every new tenant AS also receives a
# docs-playground public client at bootstrap. Tenant onboarding that selects sample
# data also registers that client for the tenant (same origins), independent of this flag.
docs:
  playground:
    enabled: ${env:EDK_DOCS_PLAYGROUND_ENABLED:true}
    client-id: docs-playground
    origins: ${env:EDK_DOCS_SITE_ORIGINS:https://docs.sphereon.com,http://127.0.0.1:3000,http://localhost:3000}
east-west:
  platform:
    base-url: http://enterprise-platform:18080
  tenant-as:
    base-url: http://enterprise-tenant-as:18083
  tenant-kms:
    base-url: http://enterprise-tenant-kms:8080
  tenant-did:
    base-url: http://enterprise-did:8080
  # Sample-data provisioning (tenant onboarding `sample-data-provisioned` step) seeds credential
  # designs / render variants / offers on the issuer and DCQL queries / verifier bindings on the
  # verifier, over east-west REST with a tenant-scoped impersonation bearer.
  tenant-issuer:
    base-url: http://enterprise-issuer:8080
  tenant-verifier:
    base-url: http://enterprise-verifier:8080
license:
  # This is the local licensing authority: it owns the deployment and is exempt
  # from the deployment license gate.
  command-enforcement:
    enabled: true
    missing-descriptor-mode: warn
  deployment-role: platform
  recipient:
    key-id: ${env:EDK_LICENSE_RECIPIENT_KEY_ID:license-recipient}
    kms:
      enabled: true
      alias: license-recipient
  trust:
    # Trust the compiled-in durable root. A license bound to this deployment
    # chains leaf -> intermediate -> embedded root, so no trust file is mounted.
    embedded:
      enabled: ${env:EDK_LICENSE_TRUST_EMBEDDED:true}
    root-ca-bundle-path: /app/license/license-root-ca.pem

secret:
  authority:
    allowed-clock-skew-millis: 5000
    central:
      permit:
        issuer: enterprise-platform
        audience: sphereon-secret-use
        signing-key: ${env:SECRET_AUTHORITY_CENTRAL_PERMIT_SIGNING_KEY}
      assertion:
        issuer: sphereon-secret-workload
        audience: enterprise-platform
        verification-keys: ${env:SECRET_AUTHORITY_CENTRAL_ASSERTION_VERIFICATION_KEYS}
    satellite:
      workload-id: service-platform
      workload-hosting-revision: 1
      assertion:
        issuer: sphereon-secret-workload
        audience: enterprise-platform
        ttl-millis: 30000
        signing-key: ${env:SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY}
      permit:
        issuer: enterprise-platform
        audience: sphereon-secret-use
        verification-keys: ${env:SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS}

