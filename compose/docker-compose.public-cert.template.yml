# Public static-certificate single-port gateway overlay for the EDK enterprise stack.
#
# This is a template rendered by scripts/start-letsencrypt.(ps1|sh) when DNS-01
# is handled manually. The rendered file is compose/docker-compose.public-cert.yml
# and is intentionally gitignored.
#
# Use this overlay when you already have a publicly trusted wildcard certificate
# in compose/gateway/certs/wildcard.crt and compose/gateway/certs/wildcard.key.
# The local CA/truststore mounts are intentionally absent: containers and
# browsers validate public CA certificates with their default truststores.

services:
  traefik:
    image: traefik:v3.3
    depends_on:
      enterprise-platform:
        condition: service_healthy
    command: []
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./gateway/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/traefik/dynamic.public-cert.generated.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./gateway/certs:/etc/traefik/certs:ro
    networks:
      appnet:
        aliases:
          - platform.__BASE_DOMAIN__
__PUBLIC_CERT_TENANT_ALIASES__

  enterprise-platform:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
      EXTERNAL_BASE_URL: https://platform.__BASE_DOMAIN__
      ONBOARDING_UI_BASE_URL: https://platform.__BASE_DOMAIN__
    healthcheck:
      test: ["CMD", "bash", "-c", "(exec 3<>/dev/tcp/127.0.0.1/18080 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) ') || (exec 4<>/dev/tcp/127.0.0.1/18080 && printf 'GET /api/platform/setup/v1/status HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&4 && head -n1 <&4 | grep -Eq ' (200|404) ')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  enterprise-tenant-as:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18083 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  enterprise-tenant-kms:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  enterprise-did:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
      EXTERNAL_BASE_URL: ""
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  enterprise-issuer:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
      EXTERNAL_BASE_URL: ""
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  enterprise-verifier:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
      EXTERNAL_BASE_URL: ""
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  admin-console:
    networks:
      appnet: {}
