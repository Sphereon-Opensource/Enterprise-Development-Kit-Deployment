# Let's Encrypt single-port gateway overlay for the EDK enterprise stack.
#
# This is a template rendered by scripts/start-letsencrypt.(ps1|sh). The rendered
# file is compose/docker-compose.letsencrypt.yml and is intentionally gitignored.
#
# Use this overlay instead of docker-compose.gateway.yml when the machine is
# reachable through a real public base domain and Traefik should obtain public
# Let's Encrypt certificates. The local CA/truststore mounts are intentionally
# absent: containers and browsers validate LE certificates with their default
# truststores.

services:
  traefik:
    image: traefik:v3.3
    depends_on:
      enterprise-platform:
        condition: service_healthy
    command: []
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./gateway/traefik/traefik.letsencrypt.generated.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/traefik/dynamic.letsencrypt.generated.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - edk-acme:/etc/traefik/acme
__LE_DNS_ENV_SECTION__
    networks:
      appnet:
        aliases:
          - platform.__BASE_DOMAIN__
__LE_TENANT_ALIASES__

  enterprise-platform:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
      EXTERNAL_BASE_URL: https://platform.__BASE_DOMAIN__
      ONBOARDING_UI_BASE_URL: https://platform.__BASE_DOMAIN__
    healthcheck:
      test: ["CMD", "bash", "-c", "(exec 3<>/dev/tcp/127.0.0.1/18080 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) ') || (exec 4<>/dev/tcp/127.0.0.1/18080 && printf 'GET /api/platform/setup/v1/status HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&4 && head -n1 <&4 | grep -Eq ' (200|404) ')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  enterprise-tenant-as:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18083 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  enterprise-tenant-kms:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  enterprise-did:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
      EXTERNAL_BASE_URL: ""
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  enterprise-issuer:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
      EXTERNAL_BASE_URL: ""
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  enterprise-verifier:
    environment:
      EDK_PLATFORM_BASE_DOMAIN: __BASE_DOMAIN__
      EDK_PLATFORM_PUBLIC_URL: https://platform.__BASE_DOMAIN__
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
      EXTERNAL_BASE_URL: ""
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: platform.__BASE_DOMAIN__\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -Eq ' (200|503) '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  admin-console:
    networks:
      appnet: {}
    environment:
      ADMIN_CONSOLE_PUBLIC_ORIGIN: https://platform.__BASE_DOMAIN__
      ADMIN_CONSOLE_ALLOW_LOCAL_DEVELOPMENT: "false"
      ADMIN_CONSOLE_TRUSTED_INGRESS_MODE: X_FORWARDED
      ADMIN_CONSOLE_TRUSTED_INGRESS_HOPS: "1"

volumes:
  edk-acme:
