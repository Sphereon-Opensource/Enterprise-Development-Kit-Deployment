# Optional journey overlay: the authored-workflow worker (with its Temporal store), the tenant Portal and the Inbox.
# The enterprise stack runs without it. Use it after docker-compose.gateway.yml (or a rendered gateway overlay):
#
#   1. node scripts/render-journey-gateway.mjs --base-domain <domain> --input gateway/traefik/<rendered table> \
#        --output gateway/traefik/dynamic.journey.generated.yml
#   2. EDK_JOURNEY_GATEWAY_CONFIG=./gateway/traefik/dynamic.journey.generated.yml docker compose \
#        -f docker-compose.yml -f docker-compose.gateway.yml -f docker-compose.workflow.yml up -d
#
# Generate the secret-authority keys for service-workflow, service-portal and service-inbox together with the base
# workloads, and set EDK_INTERNAL_CLIENT_SECRET_WORKFLOW, _PORTAL and _INBOX. Supply a policy service with the reviewed
# tenant policies through EDK_WORKFLOW_OPA_ENDPOINT. The Inbox is a VDX image: set VDX_REGISTRY and VDX_TAG.

services:
  traefik:
    volumes:
      - ${EDK_JOURNEY_GATEWAY_CONFIG:?Render a journey gateway config with scripts/render-journey-gateway.mjs}:/etc/traefik/dynamic/dynamic.yml:ro

  enterprise-platform:
    environment:
      EDK_INTERNAL_CLIENT_SECRET_WORKFLOW: ${EDK_INTERNAL_CLIENT_SECRET_WORKFLOW:?Set the workflow worker client secret}
      EDK_INTERNAL_CLIENT_SECRET_PORTAL: ${EDK_INTERNAL_CLIENT_SECRET_PORTAL:?Set the portal client secret}
      EDK_INTERNAL_CLIENT_SECRET_INBOX: ${EDK_INTERNAL_CLIENT_SECRET_INBOX:?Set the Inbox client secret}
    volumes:
      - ./config/platform.journey.application-container.yml:/app/config/application-container.yml:ro

  temporal-postgres:
    image: postgres:15.20-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${EDK_TEMPORAL_POSTGRES_PASSWORD:?Set EDK_TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_DB: temporal
    networks: [appnet]
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.29.6.1}
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${EDK_TEMPORAL_POSTGRES_PASSWORD:?Set EDK_TEMPORAL_POSTGRES_PASSWORD}
      DEFAULT_NAMESPACE: ${SPHEREON_TEMPORAL_NAMESPACE:-default}
      BIND_ON_IP: 0.0.0.0
    networks: [appnet]
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--address", "127.0.0.1:7233", "-n", "${SPHEREON_TEMPORAL_NAMESPACE:-default}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  enterprise-workflow:
    image: nexus.sphereon.com/edk-docker/enterprise-workflow:${EDK_TAG:?Set EDK_TAG to the approved release tag}
    depends_on:
      enterprise-platform:
        condition: service_healthy
      temporal:
        condition: service_healthy
    # The worker resolves the workflow definitions, step types and Forms admissions the platform owns.
    networks: [appnet, tenant-db-net, platform-db-net]
    environment:
      APP_PROFILE: container
      SPHEREON_CONFIG_LOCATION: /app/config
      EDK_PLATFORM_BASE_DOMAIN: ${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}
      EDK_PLATFORM_PUBLIC_URL: https://platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}
      LICENSE_DEPLOYMENT_ID: ${LICENSE_DEPLOYMENT_ID:?Set LICENSE_DEPLOYMENT_ID}
      EDK_INTERNAL_CLIENT_SECRET: ${EDK_INTERNAL_CLIENT_SECRET_WORKFLOW:?Set the workflow worker client secret}
      EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      DATABASE_APP_DEFAULT_HOST: platform-postgres
      DATABASE_APP_DEFAULT_DATABASE: ${EDK_PLATFORM_DB_NAME:-platform}
      DATABASE_APP_DEFAULT_USERNAME: ${EDK_PLATFORM_DB_USERNAME:-edk_platform}
      DATABASE_APP_DEFAULT_PASSWORD: ${EDK_PLATFORM_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      DATABASE_TENANTS_DEFAULT_HOST: tenant-postgres
      DATABASE_TENANTS_DEFAULT_DATABASE: ${EDK_TENANT_DB_NAME:-tenant}
      DATABASE_TENANTS_DEFAULT_USERNAME: ${EDK_TENANT_DB_USERNAME:-edk_tenant}
      DATABASE_TENANTS_DEFAULT_PASSWORD: ${EDK_TENANT_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      DATABASE_TENANTS_DEFAULT_ISOLATION: schema
      GRPC_AUTH_MODE: service-jwt
      TRANSPORT_AUTH_EXPECTED_AUDIENCE: enterprise-workflow
      SPHEREON_APP_TRANSPORT_AUTH_EXPECTED_AUDIENCE: enterprise-workflow
      AUTHZ_POLICY_ENGINES_OPA_MAIN_ENDPOINT: ${EDK_WORKFLOW_OPA_ENDPOINT:?Set EDK_WORKFLOW_OPA_ENDPOINT to the reviewed policy service}
      SPHEREON_TEMPORAL_ENDPOINT: temporal:7233
      SPHEREON_TEMPORAL_NAMESPACE: ${SPHEREON_TEMPORAL_NAMESPACE:-default}
      SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY: ${SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY:?Run scripts/generate-secret-authority-keys, then scripts/generate-compose-secrets.mjs}
      SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS: ${SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS:?Run scripts/generate-secret-authority-keys, then scripts/generate-compose-secrets.mjs}
    volumes:
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem:/app/secret-authority/public/central-permit.pub.pem:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-workflow:/app/secret-authority/workload:ro

  enterprise-portal:
    image: nexus.sphereon.com/edk-docker/enterprise-portal:${EDK_TAG:?Set EDK_TAG to the approved release tag}
    depends_on:
      enterprise-platform:
        condition: service_healthy
    networks: [appnet, tenant-db-net]
    environment:
      APP_PROFILE: container
      SPHEREON_CONFIG_LOCATION: /app/config
      EDK_PLATFORM_BASE_DOMAIN: ${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}
      EDK_PLATFORM_PUBLIC_URL: https://platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}
      EDK_INTERNAL_CLIENT_SECRET: ${EDK_INTERNAL_CLIENT_SECRET_PORTAL:?Set the portal client secret}
      EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      DATABASE_APP_DEFAULT_HOST: tenant-postgres
      DATABASE_APP_DEFAULT_DATABASE: ${EDK_TENANT_DB_NAME:-tenant}
      DATABASE_APP_DEFAULT_USERNAME: ${EDK_TENANT_DB_USERNAME:-edk_tenant}
      DATABASE_APP_DEFAULT_PASSWORD: ${EDK_TENANT_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      DATABASE_TENANTS_DEFAULT_HOST: tenant-postgres
      DATABASE_TENANTS_DEFAULT_DATABASE: ${EDK_TENANT_DB_NAME:-tenant}
      DATABASE_TENANTS_DEFAULT_USERNAME: ${EDK_TENANT_DB_USERNAME:-edk_tenant}
      DATABASE_TENANTS_DEFAULT_PASSWORD: ${EDK_TENANT_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      DATABASE_TENANTS_DEFAULT_ISOLATION: schema
      GRPC_AUTH_MODE: service-jwt
      TRANSPORT_AUTH_EXPECTED_AUDIENCE: enterprise-portal
      PORTAL_PUBLIC_ORIGIN: ${EDK_PORTAL_PUBLIC_ORIGIN:-https://platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}}
      PORTAL_ASSET_ORIGINS: ${EDK_PORTAL_ASSET_ORIGINS:-https://platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}}
      PORTAL_ASSET_RETENTION_POLICY_ID: ${EDK_PORTAL_ASSET_RETENTION_POLICY_ID:?Set EDK_PORTAL_ASSET_RETENTION_POLICY_ID}
      PORTAL_PUBLICATION_POLICY_RESOURCE_KEY: ${EDK_PORTAL_PUBLICATION_POLICY_RESOURCE_KEY:-portal.interaction}
      OID4VP_UNIVERSAL_EXTERNAL_BASE_URL: ${EDK_OID4VP_UNIVERSAL_EXTERNAL_BASE_URL:-https://platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}/oid4vp}
      AUTHZ_POLICY_ENGINES_OPA_MAIN_ENDPOINT: ${EDK_WORKFLOW_OPA_ENDPOINT:?Set EDK_WORKFLOW_OPA_ENDPOINT to the reviewed policy service}
      LICENSE_DEPLOYMENT_ID: ${LICENSE_DEPLOYMENT_ID:?Set LICENSE_DEPLOYMENT_ID}
      SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY: ${SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY:?Run scripts/generate-secret-authority-keys, then scripts/generate-compose-secrets.mjs}
      SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS: ${SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS:?Run scripts/generate-secret-authority-keys, then scripts/generate-compose-secrets.mjs}
    volumes:
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem:/app/secret-authority/public/central-permit.pub.pem:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-portal:/app/secret-authority/workload:ro

  vdx-inbox:
    image: ${VDX_REGISTRY:?Set VDX_REGISTRY to the native Inbox image registry}/vdx-inbox:${VDX_TAG:?Set VDX_TAG to the approved native Inbox image tag}
    depends_on:
      enterprise-platform:
        condition: service_healthy
    networks: [appnet, tenant-db-net]
    environment:
      APP_PROFILE: container
      SPHEREON_CONFIG_LOCATION: /app/config
      EDK_PLATFORM_BASE_DOMAIN: ${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}
      EDK_PLATFORM_ISSUER: https://platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}
      EDK_TRUST_TENANT_REGISTRY_ISSUERS: "true"
      EDK_INTERNAL_CLIENT_SECRET: ${EDK_INTERNAL_CLIENT_SECRET_INBOX:?Set the Inbox client secret}
      EDK_TENANT_DB_HOST: tenant-postgres
      EDK_TENANT_DB_NAME: ${EDK_TENANT_DB_NAME:-tenant}
      EDK_DB_USERNAME: ${EDK_TENANT_DB_USERNAME:-edk_tenant}
      EDK_DB_PASSWORD: ${EDK_TENANT_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Run scripts/generate-compose-secrets.mjs}
      GRPC_AUTH_MODE: service-jwt
      TRANSPORT_AUTH_EXPECTED_AUDIENCE: enterprise-inbox
      CALENDAR_COMMAND_ENDPOINT: grpc://enterprise-platform:9090
      AUTHZ_POLICY_ENGINES_OPA_MAIN_ENDPOINT: ${EDK_WORKFLOW_OPA_ENDPOINT:?Set EDK_WORKFLOW_OPA_ENDPOINT to the reviewed policy service}
      # Workloads allowed to post case notices; the workflow worker posts them.
      INBOX_NOTICES_WORKLOADS: ${INBOX_NOTICES_WORKLOADS:-workflow-service}
      LICENSE_DEPLOYMENT_ID: ${LICENSE_DEPLOYMENT_ID:?Set LICENSE_DEPLOYMENT_ID}
      SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY: ${SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY:?Run scripts/generate-secret-authority-keys, then scripts/generate-compose-secrets.mjs}
      SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS: ${SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS:?Run scripts/generate-secret-authority-keys, then scripts/generate-compose-secrets.mjs}
    volumes:
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem:/app/secret-authority/public/central-permit.pub.pem:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-inbox:/app/secret-authority/workload:ro

volumes:
  temporal-postgres-data:
