# enterprise-wallet-interaction runtime config.
#
# Server-side headless wallet interaction state is PostgreSQL-backed. Internal
# callers use gRPC command transport; the REST projection is not public in the
# default customer stack.
server:
  rest:
    port: 8080
    auth:
      enabled: true
      platform-issuer: ${env:EDK_PLATFORM_PUBLIC_URL}
      platform-jwks-uri: http://enterprise-platform:18080/.well-known/jwks.json
      expected-audience: enterprise-wallet-interaction
      trust-tenant-registry-issuers: ${env:EDK_TRUST_TENANT_REGISTRY_ISSUERS:true}
  service-identity:
    token-endpoint: http://enterprise-platform:18080/token
    active-as-client-role: wallet-interaction
    client-id: wallet-interaction-service
    client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
    audience: enterprise-platform
sphereon:
  telemetry:
    enabled: true
    tracing:
      enabled: true
    metrics:
      enabled: true
    sampling:
      rate: 1.0
    export:
      preset: otlp-all
  service:
    id: service-wallet-interaction
otel:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  exporter:
    otlp:
      endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      protocol: ${env:EDK_OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
security:
  workload-trust-policy:
    trusted_service_ids:
      - service-oid4vci
      - service-oid4vp
      - service-wallet-unit
      - service-monolith
    service_client_bindings:
      "[service-oid4vci]": issuer-service
      "[service-oid4vp]": verifier-service
      "[service-wallet-unit]": wallet-unit-service
transport:
  grpc:
    enabled: true
    port: 9090
  routing:
    configScope: APP
    modules:
      secret:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
        preferServiceTokenOverSessionBearer: false
      platform:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        services:
          config: &platformGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-platform:9090
      application:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
      kms:
        serviceTokenAudience: enterprise-tenant-kms
        preferServiceTokenOverSessionBearer: true
        services:
          # Client-instance keys are held by this workload's software WSCD.
          # Keep its key lifecycle local; only the distinct wallet-provider
          # attestation signature route below uses tenant KMS.
          key:
            target: LOCAL
          keys:
            target: LOCAL
          signature:
            commands:
              "[kms.signature.create]":
                target: SERVER
                transport: GRPC
                endpoint: grpc://enterprise-tenant-kms:9090
      wallet:
        serviceTokenAudience: enterprise-wallet-unit
        preferServiceTokenOverSessionBearer: true
        services:
          unit:
            target: SERVER
            transport: GRPC
            endpoint: ${env:WALLET_UNIT_GRPC_ENDPOINT:grpc://enterprise-wallet-unit:9090}
          "[hsm-policy]":
            commands:
              "[wallet.hsm-policy.authorize]":
                target: SERVER
                transport: GRPC
                endpoint: ${env:WALLET_UNIT_GRPC_ENDPOINT:grpc://enterprise-wallet-unit:9090}
                timeoutMs: 30000
config:
  providers:
    platform-config-remote:
      enabled: true
      bootstrap-required-keyspaces: crypto.kms.roles
    tenant-config-db:
      enabled: false
license:
  command-enforcement:
    enabled: true
    missing-descriptor-mode: warn
  installation-id: ${env:EDK_INSTALLATION_ID:}
  gate:
    service-role: enterprise-wallet-interaction
database:
  app:
    default:
      dialect: postgresql
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
  tenants:
    default:
      dialect: postgresql
      isolation: schema
      schema-pattern: "tenant_{id}"
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
tenant:
  resolution:
    remote: true
    platform:
      base-domain: ${env:EDK_PLATFORM_BASE_DOMAIN}
      subdomain:
        enabled: true
    custom-domain:
      enabled: true
did:
  persistence:
    type: postgresql
kms:
  providers:
    default:
      type: software
      enabled: true
      exposePrivateKeysDuringGeneration: false
      keyStore:
        type: pkcs12
        password: ${env:EDK_KEYSTORE_PASSWORD}
        keystoreRoot: ${env:WALLET_INTERACTION_KEYSTORE_ROOT:/keystore}
        keyVisibility: private
        persist: true
        overwriteAlias: true
    software:
      type: software
      id: software
      enabled: true
      keystore:
        type: pkcs12
        password: ${env:EDK_KEYSTORE_PASSWORD}
        keystoreRoot: ${env:WALLET_INTERACTION_KEYSTORE_ROOT:/keystore}
        keyVisibility: private
        persist: true
        overwriteAlias: true
        id: wallet-interaction-keystore
crypto:
  kms:
    roles:
      wallet-interaction:
        provider: software
        algorithm: ES256
blob-stores:
  wallet-interaction:
    type: kvstore
    kvStoreId: wallet-interaction-blobs
    scope-binding: TENANT
    maxBlobSizeBytes: ${env:WALLET_INTERACTION_BLOB_MAX_BYTES:10485760}
kv-stores:
  blob.metadata:
    type: database
    scope-binding: TENANT
  wallet-interaction-blobs:
    type: database
    scope-binding: TENANT
  wallet-interaction-sessions:
    type: database
    scope-binding: TENANT
wallet:
  interaction:
    trust:
      policy-mode: WARN
    security:
      require-challenge: true
    oid4vci:
      holder:
        signing-key-id: wallet-interaction-holder-signing
        signing-algorithm: ES256
