# enterprise-verifier runtime config.
#
# The verifier serves the OID4VP protocol surface to wallets and routes KMS and
# DID commands over gRPC and HTTP. Public surface is limited to the wallet-facing
# OID4VP endpoints (request-uri fetch and direct_post response) plus discovery;
# /oid4vp/backend and /api/dcql/v1 require a tenant AS bearer. The /oid4vp prefix
# is deliberately not anonymous wholesale so /oid4vp/backend stays protected.
server:
  rest:
    port: 8080
    auth:
      enabled: true
      # Tenant bearer issuers are dynamic registry-backed AS endpoints created
      # during tenant onboarding, not deployment-time URLs.
      platform-issuer: ${env:EDK_PLATFORM_PUBLIC_URL}
      platform-jwks-uri: http://enterprise-platform:18080/.well-known/jwks.json
      expected-audience: enterprise-verifier
      trust-tenant-registry-issuers: ${env:EDK_TRUST_TENANT_REGISTRY_ISSUERS:true}
      anonymous-path-prefixes: /oid4vp/request-uri,/oid4vp/auth/response,/.well-known
  service-identity:
    token-endpoint: http://enterprise-platform:18080/token
    token-endpoint-allow-http: true
    token-endpoint-source: active-as
    active-as-token-endpoint: http://enterprise-tenant-as:18083/token
    active-as-client-role: verifier
    client-id: verifier-service
    client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
    tenant-bound-client-id: true
    audience: enterprise-platform
    allowed-audiences: enterprise-tenant-kms
applications:
  admin-console:
    public-base-path: ${env:EDK_ADMIN_CONSOLE_PUBLIC_BASE_PATH:/admin-console}
sphereon:
  telemetry:
    enabled: true
    tracing:
      enabled: true
    metrics:
      enabled: true
    sampling:
      rate: 1.0
    export:
      preset: otlp-all
  service:
    id: service-oid4vp
otel:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  exporter:
    otlp:
      endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      protocol: ${env:EDK_OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      traces:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:grpc}
      metrics:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:grpc}
security:
  workload-trust-policy:
    trusted_service_ids:
      - service-crypto
      - service-data
      - service-oid4vci
      - service-oid4vp
      - service-eidas
      - service-monolith
    service_client_bindings:
      "[service-crypto]": kms-service
      "[service-data]": did-service
      "[service-oid4vci]": issuer-service
      "[service-oid4vp]": verifier-service
transport:
  grpc:
    enabled: false
    port: 9090
  routing:
    configScope: APP
    modules:
      kms:
        serviceTokenAudience: enterprise-tenant-kms
        preferServiceTokenOverSessionBearer: true
        services:
          key: &tenantKmsGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-tenant-kms:9090
          keys: *tenantKmsGrpcRoute
          signature:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-tenant-kms:9090
            commands:
              "[kms.signature.verify]":
                target: LOCAL
          mac: *tenantKmsGrpcRoute
          encryption: *tenantKmsGrpcRoute
          ecdh: *tenantKmsGrpcRoute
      did:
        target: SERVER
        transport: HTTP
        endpoint: http://enterprise-did:8080
      platform:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        services:
          config: &platformGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-platform:9090
      application:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
      # Trust-domain enforcement is ROUTED to the platform, which owns the trust-domain store.
      # Routes all trust reads (trust.domains.anchors.resolve, trust.domains.oid4vp.resolve,
      # trust.domains.oid4vp.selections.get, trust.domains.anchors.list) over east-west gRPC to the
      # platform, reusing the enterprise-platform service token audience (server.service-identity).
      # The verifier holds no trust-domain store.
      trust:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
        preferServiceTokenOverSessionBearer: true
config:
  providers:
    platform-config-remote:
      enabled: true
      bootstrap-required-keyspaces: crypto.kms.roles,oid4vp
    tenant-config-db:
      enabled: false
license:
  command-enforcement:
    enabled: true
    missing-descriptor-mode: warn
  # Optional explicit pin. Leave blank for first-run setup; the verified
  # protected license bundle supplies the installation binding.
  installation-id: ${env:EDK_INSTALLATION_ID:}
  gate:
    service-role: enterprise-verifier
database:
  app:
    default:
      dialect: postgresql
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
  tenants:
    default:
      dialect: postgresql
      isolation: schema
      schema-pattern: "tenant_{id}"
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
tenant:
  resolution:
    remote: true
    platform:
      base-domain: ${env:EDK_PLATFORM_BASE_DOMAIN}
      subdomain:
        enabled: true
    custom-domain:
      enabled: true
kms:
  providers:
    software:
      type: software
      enabled: true
      autoCreateCertificate: true
      keystore:
        type: pkcs12
        id: software
        password: ${env:EDK_KEYSTORE_PASSWORD}
        # This service routes KMS to the tenant KMS and holds no key material. The
        # only local use is the [kms.signature.verify] route, which operates on
        # public keys, so this keystore is ephemeral in the container temp
        # directory and not backed by a shared volume.
        path: "{tempDir}/edk-verify-keystore.p12"
