# enterprise-issuer runtime config.
#
# The issuer serves the OID4VCI protocol surface to wallets and signs credentials
# by routing KMS commands to the tenant KMS over gRPC. Public surface: issuer
# metadata, the OID4VCI protocol endpoints, hosted status list tokens, and public
# vct metadata. The /api/oid4vci/v1, credential-design, and status-list
# management surfaces require a tenant AS bearer.
server:
  rest:
    port: 8080
    auth:
      enabled: true
      # Tenant bearer issuers are dynamic registry-backed AS endpoints created
      # during tenant onboarding, not deployment-time URLs.
      platform-issuer: ${env:EDK_PLATFORM_PUBLIC_URL}
      platform-jwks-uri: http://enterprise-platform:18080/.well-known/jwks.json
      expected-audience: enterprise-issuer
      trust-tenant-registry-issuers: ${env:EDK_TRUST_TENANT_REGISTRY_ISSUERS:true}
      anonymous-path-prefixes: /oid4vci,/credential,/deferredCredential,/nonce,/notification,/.well-known,/public/statuslists,/public/schema,/public/assets,/credentials/offers
  # Wallet-driven issuance signs credentials by routing KMS commands, but the
  # wallet session carries no operator bearer. The issuer presents its own token
  # for those system calls, obtained from the tenant AS via client_credentials.
  service-identity:
    token-endpoint: http://enterprise-platform:18080/token
    token-endpoint-allow-http: true
    token-endpoint-source: active-as
    active-as-token-endpoint: http://enterprise-tenant-as:18083/token
    active-as-client-role: issuer
    client-id: issuer-service
    client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
    tenant-bound-client-id: true
    audience: enterprise-platform
    allowed-audiences: enterprise-tenant-kms,enterprise-tenant-as
applications:
  admin-console:
    public-base-path: ${env:EDK_ADMIN_CONSOLE_PUBLIC_BASE_PATH:/admin-console}
oid4vci:
  issuer:
    protocol:
      base-path: /oid4vci
sphereon:
  telemetry:
    enabled: true
    tracing:
      enabled: true
    metrics:
      enabled: true
    sampling:
      rate: 1.0
    export:
      preset: otlp-all
  service:
    id: service-oid4vci
otel:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  exporter:
    otlp:
      endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      protocol: ${env:EDK_OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      traces:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:grpc}
      metrics:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:grpc}
security:
  workload-trust-policy:
    trusted_service_ids:
      - service-crypto
      - service-data
      - service-oid4vci
      - service-oid4vp
      - service-eidas
      - service-monolith
    service_client_bindings:
      "[service-crypto]": kms-service
      "[service-data]": did-service
      "[service-oid4vci]": issuer-service
      "[service-oid4vp]": verifier-service
transport:
  grpc:
    enabled: false
    port: 9090
  routing:
    configScope: APP
    modules:
      kms:
        serviceTokenAudience: enterprise-tenant-kms
        preferServiceTokenOverSessionBearer: true
        services:
          key: &tenantKmsGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-tenant-kms:9090
          keys: *tenantKmsGrpcRoute
          signature:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-tenant-kms:9090
            commands:
              "[kms.signature.verify]":
                target: LOCAL
          mac: *tenantKmsGrpcRoute
          encryption: *tenantKmsGrpcRoute
          ecdh: *tenantKmsGrpcRoute
      oauth2:
        target: SERVER
        transport: HTTP
        endpoint: http://enterprise-tenant-as:18083
      "[oauth2-as-admin]":
        target: SERVER
        transport: HTTP
        endpoint: http://enterprise-tenant-as:18083
        serviceTokenAudience: enterprise-tenant-as
        preferServiceTokenOverSessionBearer: true
      platform:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        services:
          config: &platformGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-platform:9090
      application:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
      trust:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
        preferServiceTokenOverSessionBearer: true
config:
  providers:
    platform-config-remote:
      enabled: true
      bootstrap-required-keyspaces: crypto.kms.roles,oid4vci,credential-design,statuslists
    tenant-config-db:
      enabled: false
license:
  command-enforcement:
    enabled: true
    missing-descriptor-mode: warn
  # Optional explicit pin. Leave blank for first-run setup; the verified
  # protected license bundle supplies the installation binding.
  installation-id: ${env:EDK_INSTALLATION_ID:}
  gate:
    service-role: enterprise-issuer
database:
  app:
    default:
      dialect: postgresql
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
  tenants:
    default:
      dialect: postgresql
      isolation: schema
      schema-pattern: "tenant_{id}"
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
tenant:
  resolution:
    remote: true
    platform:
      base-domain: ${env:EDK_PLATFORM_BASE_DOMAIN}
      subdomain:
        enabled: true
    custom-domain:
      enabled: true
kms:
  providers:
    software:
      type: software
      enabled: true
      autoCreateCertificate: true
      keystore:
        type: pkcs12
        id: software
        password: ${env:EDK_KEYSTORE_PASSWORD}
        # This service routes KMS to the tenant KMS and holds no key material. The
        # only local use is the [kms.signature.verify] route, which operates on
        # public keys, so this keystore is ephemeral in the container temp
        # directory and not backed by a shared volume.
        path: "{tempDir}/edk-verify-keystore.p12"
# Design-asset blob store: logos/backgrounds uploaded via the credential-design
# API land here and are served content-addressed at /public/assets/design/{hash}.
# Backed by the design-assets KV store below (tenant database), so assets survive
# container restarts and pod rescheduling without a volume.
blob:
  stores:
    designs:
      type: kvstore
      kvStoreId: design-assets
# Pipeline session payloads are sealed with this master KEK before they reach the
# KV backend. TODO: supply both keys from your secret backend (base64url, 32
# bytes each); do not reuse keys across deployments.
issuance-pipeline:
  encryption:
    master-kek: ${env:EDK_PIPELINE_MASTER_KEK}
    blind-index-key: ${env:EDK_PIPELINE_BLIND_INDEX_KEY}
# Pipeline issuance sessions persist in the tenant database (encrypted at rest).
kv:
  stores:
    issuance-pipeline-sessions:
      type: KvStoreConfig
      backendId: database
      scopeBinding: TENANT
    # Backing store for the designs blob store above.
    design-assets:
      type: KvStoreConfig
      backendId: database
      scopeBinding: TENANT
    # Pins token-derived OID4VCI protocol sessions to their first routed issuer
    # instance using the database KV backend's atomic version chains.
    oid4vci:
      credential-request-identities:
        type: KvStoreConfig
        backendId: database
        scopeBinding: TENANT
    # Blob descriptor/metadata index for design assets. The dotted store id
    # "blob.metadata" is represented as nested config keys.
    blob:
      metadata:
        type: KvStoreConfig
        backendId: database
        scopeBinding: TENANT
# Issuer business config (issuer metadata, credential configurations, OCA gates,
# status-list definitions, credential-design public URLs, and AS bridge settings)
# is seeded into platform config during tenant setup and refreshed through the
# platform-config-remote provider. Use config.overrides.* for explicit local
# deployment overrides only.
