# enterprise-issuer runtime config.
#
# The issuer serves the OID4VCI protocol surface to wallets and signs credentials
# by routing KMS commands to the tenant KMS over gRPC. Public surface: issuer
# metadata, the OID4VCI protocol endpoints, hosted status list tokens, and public
# vct metadata. The /api/oid4vci/v1, credential-design, and status-list
# management surfaces require a tenant AS bearer.
server:
  rest:
    port: 8080
    auth:
      enabled: true
      issuer: ${env:EDK_TENANT_AS_PUBLIC_URL}
      jwks-uri: http://enterprise-tenant-as:18083/.well-known/jwks.json
      platform-issuer: ${env:EDK_PLATFORM_PUBLIC_URL}
      platform-jwks-uri: http://enterprise-platform:18080/.well-known/jwks.json
      expected-audience: enterprise-issuer
      trust-tenant-registry-issuers: ${env:EDK_TRUST_TENANT_REGISTRY_ISSUERS:false}
      anonymous-path-prefixes: /oid4vci,/.well-known,/public/statuslists,/public/schema,/public/assets,/credentials/offers
  # Wallet-driven issuance signs credentials by routing KMS commands, but the
  # wallet session carries no operator bearer. The issuer presents its own token
  # for those system calls, obtained from the tenant AS via client_credentials.
  service-identity:
    token-endpoint: http://enterprise-platform:18080/token
    client-id: issuer-service
    client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
sphereon:
  telemetry:
    enabled: true
    tracing:
      enabled: true
    metrics:
      enabled: true
    sampling:
      rate: 1.0
    export:
      preset: otlp-all
  service:
    id: service-oid4vci
otel:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  exporter:
    otlp:
      endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      protocol: ${env:EDK_OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      traces:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:grpc}
      metrics:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:grpc}
security:
  header-trust-policy:
    trusted_service_ids:
      - service-crypto
      - service-data
      - service-oid4vci
      - service-oid4vp
      - service-eidas
      - service-monolith
    service_client_bindings:
      "[service-crypto]": kms-service
      "[service-data]": did-service
      "[service-oid4vci]": issuer-service
      "[service-oid4vp]": verifier-service
transport:
  grpc:
    enabled: false
    port: 9090
  routing:
    modules:
      kms:
        services:
          key: &tenantKmsGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-tenant-kms:9090
          keys: *tenantKmsGrpcRoute
          signature:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-tenant-kms:9090
            commands:
              "[kms.signature.verify]":
                target: LOCAL
          mac: *tenantKmsGrpcRoute
          encryption: *tenantKmsGrpcRoute
      oauth2:
        target: SERVER
        transport: HTTP
        endpoint: http://enterprise-tenant-as:18083
      platform:
        services:
          config: &platformGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-platform:9090
      application:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
config:
  providers:
    platform-config-remote:
      enabled: true
    tenant-config-db:
      enabled: false
license:
  command-enforcement:
    enabled: true
    missing-descriptor-mode: warn
  installation-id: ${env:EDK_INSTALLATION_ID:11111111-1111-4111-8111-111111111111}
  gate:
    service-role: enterprise-issuer
database:
  app:
    default:
      dialect: postgresql
      host: ${env:EDK_DB_HOST}
      port: 5432
      database: ${env:EDK_DB_NAME}
      username: ${env:EDK_DB_USERNAME}
      password: ${env:EDK_DB_PASSWORD}
  tenants:
    default:
      dialect: postgresql
      isolation: shared
      host: ${env:EDK_DB_HOST}
      port: 5432
      database: ${env:EDK_DB_NAME}
      username: ${env:EDK_DB_USERNAME}
      password: ${env:EDK_DB_PASSWORD}
tenant:
  resolution:
    platform:
      base-domain: ${env:EDK_PLATFORM_BASE_DOMAIN}
      subdomain:
        enabled: true
    custom-domain:
      enabled: true
kms:
  providers:
    software:
      type: software
      enabled: true
      autoCreateCertificate: true
      keystore:
        type: pkcs12
        id: software
        password: ${env:EDK_KEYSTORE_PASSWORD}
        # This service routes KMS to the tenant KMS and holds no key material. The
        # only local use is the [kms.signature.verify] route, which operates on
        # public keys, so this keystore is ephemeral in the container temp
        # directory and not backed by a shared volume.
        path: "{tempDir}/edk-verify-keystore.p12"
# Design-asset blob store: logos/backgrounds uploaded via the credential-design
# API land here and are served content-addressed at /public/assets/design/{hash}.
blob:
  stores:
    designs:
      type: filesystem
      rootDir: "/tmp/edk-design-assets"
# Pipeline session payloads are sealed with this master KEK before they reach the
# KV backend. TODO: supply both keys from your secret backend (base64url, 32
# bytes each); do not reuse keys across deployments.
issuance-pipeline:
  encryption:
    master-kek: ${env:EDK_PIPELINE_MASTER_KEK}
    blind-index-key: ${env:EDK_PIPELINE_BLIND_INDEX_KEY}
# Pipeline issuance sessions persist in the tenant database (encrypted at rest).
kv:
  stores:
    issuance-pipeline-sessions:
      type: KvStoreConfig
      backendId: database
      scopeBinding: TENANT
    # Blob descriptor/metadata index for design assets. The dotted store id
    # "blob.metadata" is represented as nested config keys.
    blob:
      metadata:
        type: KvStoreConfig
        backendId: database
        scopeBinding: TENANT
# Public base URL for content-addressed credential-design asset hosting
# (/public/assets/design/*). Mirrors statuslists.hosting.external-base-url so all
# absolute public URLs originate from the same EXTERNAL_BASE_URL.
credential-design:
  external-base-url: ${env:EXTERNAL_BASE_URL}
# Issuer identifier (path-bearing) plus the bare endpoint base the wallet-facing
# protocol endpoints are advertised under in issuer metadata.
oid4vci:
  rest:
    externalBaseUrl: ${env:EXTERNAL_BASE_URL}
  issuer:
    identifier: ${env:EXTERNAL_BASE_URL}
    credential-configuration-ids: EuPid,Mdl
    authorization-servers: ${env:EDK_TENANT_AS_PUBLIC_URL}
    # Issuer-level display fallback: shown in wallets when no issuer design has been
    # configured yet. The primary source is the credential design; this entry only
    # applies until a design is created.
    display:
      - name: "Sphereon Issuer"
        locale: en
    as-bridge:
      internal-url: http://enterprise-tenant-as:18083
      client-id: issuer-service
      client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
    # OCA completeness gate for pipeline issuance: the mandatory set the
    # pipeline's contribute/evaluate steps are measured against.
    oca:
      "[EuPid]":
        mandatory: family_name,given_name,birth_date
        sensitive: birth_date
    # Sample credential configurations. Replace or extend these with the
    # credential types this deployment issues.
    credentials:
      "[EuPid]":
        format: "dc+sd-jwt"
        vct: "${env:EXTERNAL_BASE_URL}/public/schema/vct/EuPid"
        scope: eu_pid
        status-list-id: eupid-revocation
        signing-key-alias: ${env:EDK_TENANT_SLUG:acme}-assertion
        signing-key-mode: did:jwk
        signing-algorithms: ES256
        expiration-in-days: 365
        binding-methods: jwk,did:jwk,did:key
        proof-types:
          jwt:
            signing-algorithms: ES256
        claims:
          "[family_name]":
            mandatory: true
            sd: "allowed"
            display:
              "[en-US]":
                label: "Family Name"
          "[given_name]":
            mandatory: true
            sd: "allowed"
            display:
              "[en-US]":
                label: "Given Name"
          "[birth_date]":
            mandatory: true
            display:
              "[en-US]":
                label: "Date of Birth"
          "[age_over_18]":
            display:
              "[en-US]":
                label: "Age Over 18"
          "[nationality]":
            mandatory: true
            display:
              "[en-US]":
                label: "Nationality"
          "[issuing_authority]":
            mandatory: true
            display:
              "[en-US]":
                label: "Issuing Authority"
          "[issuing_country]":
            mandatory: true
            sd: "allowed"
            display:
              "[en-US]":
                label: "Issuing Country"
          "[document_number]":
            display:
              "[en-US]":
                label: "Document Number"
      "[Mdl]":
        format: "mso_mdoc"
        doctype: "org.iso.18013.5.1.mDL"
        scope: mdl
        signing-key-alias: ${env:EDK_TENANT_SLUG:acme}-assertion
        signing-algorithms: ES256
        expiration-in-days: 365
        binding-methods: cose_key
        proof-types:
          jwt:
            signing-algorithms: ES256
        claims:
          "[org.iso.18013.5.1.family_name]":
            mandatory: true
            display:
              "[en-US]":
                label: "Family Name"
          "[org.iso.18013.5.1.given_name]":
            mandatory: true
            display:
              "[en-US]":
                label: "Given Name"
          "[org.iso.18013.5.1.birth_date]":
            mandatory: true
            display:
              "[en-US]":
                label: "Date of Birth"
          "[org.iso.18013.5.1.issue_date]":
            mandatory: true
            display:
              "[en-US]":
                label: "Issue Date"
          "[org.iso.18013.5.1.expiry_date]":
            mandatory: true
            display:
              "[en-US]":
                label: "Expiry Date"
          "[org.iso.18013.5.1.issuing_country]":
            mandatory: true
            display:
              "[en-US]":
                label: "Issuing Country"
          "[org.iso.18013.5.1.issuing_authority]":
            mandatory: true
            display:
              "[en-US]":
                label: "Issuing Authority"
          "[org.iso.18013.5.1.document_number]":
            mandatory: true
            display:
              "[en-US]":
                label: "Document Number"
          "[org.iso.18013.5.1.portrait]":
            mandatory: true
            display:
              "[en-US]":
                label: "Portrait"
          "[org.iso.18013.5.1.driving_privileges]":
            mandatory: true
            display:
              "[en-US]":
                label: "Driving Privileges"
          "[org.iso.18013.5.1.un_distinguishing_sign]":
            mandatory: true
            display:
              "[en-US]":
                label: "UN Distinguishing Sign"

# Status list referenced by the EuPid configuration. Issuance fails closed when a
# configured list cannot be resolved, so the list definition ships with the
# deployment; the management REST surface operates on the same store.
statuslists:
  hosting:
    base-path: /public/statuslists
    management-base-path: /api/statuslist/v1
    external-base-url: ${env:EXTERNAL_BASE_URL}
  ids: eupid-revocation
  "[eupid-revocation]":
    publisher: rest
    spec: token_status_list
    proof-format: jwt
    purposes: revocation
    signing-key-alias: ${env:EDK_TENANT_SLUG:acme}-assertion
    signing-key-mode: did:jwk
    ttl-seconds: 300
