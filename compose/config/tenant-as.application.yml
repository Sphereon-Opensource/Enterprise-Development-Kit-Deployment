# enterprise-tenant-as runtime config.
#
# The tenant authorization server mints the bearer tokens that the tenant runtime
# services (KMS, DID, issuer, verifier) validate. Tenant runtime services trust
# tokens this server issues; the platform AS handles operator login.
#
# Public surface: OAuth/OIDC discovery and protocol endpoints plus the login UI.
# The /api/platform/admin/v1 surface requires an operator bearer even though it
# is tenantless; expose it only internally.
server:
  rest:
    # The AS listens on its public port so its issuer URL self-resolves for JWKS
    # fetches (bearer validation reads <issuer>/.well-known/jwks.json).
    port: 18083
    auth:
      enabled: true
      # Open prefixes: OAuth protocol surface, login UI, discovery/JWKS, the
      # internal pre-auth registration channel and RFC 7662 introspection. The signing-key command
      # transport is
      # intentionally protected: tenant resolution validates the platform-issued
      # bearer and uses its tenant_id claim before the tenant's public host is active.
      anonymous-path-prefixes: /authorize,/login,/logout,/token,/par,/.well-known,/internal/preauth,/internal/jwks,/introspect,/account-action,/api/account-actions,/as,/federation_registration
      # Trust anchor for the platform AS. The internal east-west surfaces validate a short-lived,
      # platform-issued bearer bound to this tenant (per-tenant audience), so they need the platform
      # issuer and JWKS, the same anchor the tenant runtime services trust.
      platform-issuer: ${env:EDK_PLATFORM_PUBLIC_URL}
      platform-jwks-uri: http://enterprise-platform:18080/.well-known/jwks.json
      # Resolve dynamic tenant issuer JWKS through the identity-addressed
      # internal bridge while preserving the public issuer path (for example
      # /as/acme) during bearer validation.
      self-jwks-base-url: http://enterprise-tenant-as:18083
      expected-audience: enterprise-tenant-as
  service-identity:
    token-endpoint: http://enterprise-platform:18080/token
    token-endpoint-allow-http: true
    token-endpoint-source: configured
    active-as-client-role: authorization-server
    client-id: tenant-as-service
    client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
    tenant-bound-client-id: true
    audience: enterprise-platform
    # The hosted login page reads the tenant's brand assets from the blob service. Invitation hooks and the
    # Interactive Authorization calls exchange a tenant token for the receiving service's own audience
    # (issuer, verifier).
    allowed-audiences: enterprise-tenant-kms,enterprise-issuer,enterprise-verifier,enterprise-blob
sphereon:
  telemetry:
    enabled: true
    tracing:
      enabled: true
    metrics:
      enabled: true
    sampling:
      rate: 1.0
    export:
      preset: otlp-all
  service:
    id: service-tenant-as
otel:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  exporter:
    otlp:
      endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      protocol: ${env:EDK_OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      traces:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:grpc}
      metrics:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:grpc}
security:
  # 0.25.0 posture: keep AuthZEN/PDP enforced, but run password/AAL1 login.
  # Native AAL2/passkey step-up is deferred to post-0.25.0.
  "profiles.default-required-aal": "aal1"
  "profiles.default-cross-border-policy": "allow"
  "commands.default-required-aal": "aal1"
  workload-trust-policy:
    trusted_service_ids:
      - service-crypto
      - service-data
      - service-oid4vci
      - service-oid4vp
      - service-eidas
      - service-monolith
      # The platform's per-tenant signing workload keeps its workload identity here.
      - as-signing-service
    service_client_bindings:
      "[service-crypto]": kms-service
      "[service-data]": did-service
      "[service-oid4vci]": issuer-service
      "[service-oid4vp]": verifier-service
transport:
  grpc:
    # The inbound gRPC listener is switched by the GRPC_ENABLED environment variable of the service, not by this key.
    enabled: false
    port: 9090
  # What this service answers on its internal gRPC transport; every other command is refused there. It owns the
  # invitations of every tenant except the platform tenant, and the issuer and verifier call invitation.service.*
  # here. The REST surface and in-process dispatch are not affected.
  served-commands: "invitation.service.*"
  routing:
    configScope: APP
    modules:
      # Hooks of invitation actions whose handler lives in another service: invitation-handler.<action>.<hook>. The
      # resolver takes the module from the first id segment and the service from the second, so one entry per action
      # covers its hooks. The call exchanges a tenant token for the hosting service's own audience.
      "[invitation-handler]":
        services:
          "[credential-issuance]":
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-issuer:9090
            serviceTokenAudience: enterprise-issuer
            preferServiceTokenOverSessionBearer: true
            timeoutMs: 15000
          "[credential-verification]":
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-verifier:9090
            serviceTokenAudience: enterprise-verifier
            preferServiceTokenOverSessionBearer: true
            timeoutMs: 15000
      # OID4VCI 1.1 Interactive Authorization: the authorization server asks the tenant's verifier for the
      # presentation request and its verification (oid4vp.iae.create, oid4vp.iae.verify) under this service's own
      # workload token, never the wallet's bearer.
      oid4vp:
        services:
          iae:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-verifier:9090
            serviceTokenAudience: enterprise-verifier
            preferServiceTokenOverSessionBearer: true
            timeoutMs: 15000
          # Account recovery by credential presentation: the request with the tenant's recovery query and its
          # verified result (oid4vp.universal.create, oid4vp.universal.status), under this service's own workload token.
          universal:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-verifier:9090
            serviceTokenAudience: enterprise-verifier
            preferServiceTokenOverSessionBearer: true
            timeoutMs: 15000
          # The saved presentation query a wallet verification method names (oid4vp.dcql.get), from the DCQL store
          # the platform hosts, under this service's own workload token.
          dcql:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-platform:9090
            serviceTokenAudience: enterprise-platform
            preferServiceTokenOverSessionBearer: true
            timeoutMs: 15000
      # Before it issues the authorization code, the authorization server asks the issuer whether the presented
      # credential may complete another grant of the offer (oid4vci.issuer.iae-admit), under this service's own
      # workload token.
      oid4vci:
        services:
          issuer:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-issuer:9090
            serviceTokenAudience: enterprise-issuer
            preferServiceTokenOverSessionBearer: true
            timeoutMs: 15000
      kms:
        serviceTokenAudience: enterprise-tenant-kms
        preferServiceTokenOverSessionBearer: true
        services:
          key: &tenantKmsGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-tenant-kms:9090
          keys: *tenantKmsGrpcRoute
          # Invitation-token HMAC envelopes use the typed leaf unwrap/wrap
          # commands. Keep those commands on the tenant-KMS execution plane;
          # the tenant-AS has no local managed-key implementation.
          leaf: *tenantKmsGrpcRoute
          signature:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-tenant-kms:9090
            commands:
              "[kms.signature.verify]":
                target: LOCAL
          mac: *tenantKmsGrpcRoute
          encryption: *tenantKmsGrpcRoute
          ecdh: *tenantKmsGrpcRoute
      # Tenant branding and the asset library belong to the blob service: the hosted login page reads the
      # tenant's brand assets (its logos) from that owner, the same store the admin console uploads to.
      assets:
        serviceTokenAudience: enterprise-blob
        preferServiceTokenOverSessionBearer: false
        services:
          content:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-blob:9090
      # A workflow worker's credential.issuance mint is proved by the case approval the platform holds
      # (organization.case-issuance-approval.verify), under this service's own workload token. The service name is
      # bracket-quoted: unquoted, its hyphens split the key.
      organization:
        services:
          "[case-issuance-approval]":
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-platform:9090
            serviceTokenAudience: enterprise-platform
            preferServiceTokenOverSessionBearer: true
            timeoutMs: 15000
      # The connector registry runs in the platform. The invitation gate at mint resolves attached bindings and
      # runs recipient and claim lookups there.
      connector:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
        preferServiceTokenOverSessionBearer: true
        timeoutMs: 15000
      # Email delivery belongs to the platform: it holds the email accounts, the routing policy and the SMTP
      # transport. This service binds EmailService to the three routed email commands and carries no email
      # implementation, so every session needs these routes; without them sign-in fails. The calls run under this
      # service's own workload token. With no email account configured the platform answers is-available false and
      # a send returns a delivery error, so owners are activated through the manual activation link.
      email:
        serviceTokenAudience: enterprise-platform
        preferServiceTokenOverSessionBearer: true
        services:
          service:
            commands:
              "[email.service.send]": &platformEmailGrpcRoute
                target: SERVER
                transport: GRPC
                endpoint: grpc://enterprise-platform:9090
                timeoutMs: 15000
              "[email.service.send-templated]": *platformEmailGrpcRoute
              "[email.service.is-available]": *platformEmailGrpcRoute
      platform:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
        services:
          config: &platformGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-platform:9090
            serviceTokenAudience: enterprise-platform
          # The managed-signing central read binds the tenant-AS workload token and refuses a
          # route that would forward the inbound session bearer instead.
          "[authorization-server-signing-authority]":
            preferServiceTokenOverSessionBearer: true
      application:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
      auth:
        # Identity and credential storage is owned by the platform control plane. Hosted login
        # stays local, but password verification must use the same central credential authority.
        serviceTokenAudience: enterprise-platform
        preferServiceTokenOverSessionBearer: true
        services:
          credentials:
            commands:
              "[auth.credentials.verify-remote]":
                target: SERVER
                transport: GRPC
                endpoint: grpc://enterprise-platform:9090
      secret:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
        preferServiceTokenOverSessionBearer: false
# The issuer is a resource server of every tenant AS and obtains a tenant-scoped
# token through this confidential client. Helm registers each satellite with a
# distinct clientSecretKeys entry (still exposed to the pod as
# EDK_INTERNAL_CLIENT_SECRET). Compose mounts that same issuer secret on this
# container as EDK_INTERNAL_CLIENT_SECRET_ISSUER so the AS registration matches
# the issuer satellite.
oauth2:
  # Only the platform's per-tenant signing workload (`as-signing-service:<tenant>`) may manage this
  # tenant AS's signing keys.
  as:
    signing-management:
      allowed-service-actors: as-signing-service
  servers:
    default:
      internal-clients:
        issuer:
          client-id: issuer-service
          client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET_ISSUER}
config:
  providers:
    platform-config-remote:
      enabled: true
      bootstrap-required-keyspaces: oauth2.servers,crypto.kms.roles
    tenant-config-db:
      enabled: false
database:
  app:
    default:
      dialect: postgresql
      isolation: shared
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
      schema: public
    # Runtime roles validate the platform-migrated shared schema and never receive DDL credentials.
    secret-management-tenant:
      dialect: postgresql
      isolation: shared
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: secret_management_tenant_serving
      password: ${env:EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
      pool:
        dedicated-pool: true
    secret-management-runtime:
      dialect: postgresql
      isolation: shared
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: secret_management_runtime
      password: ${env:EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}
      pool:
        dedicated-pool: true
  tenants:
    default:
      dialect: postgresql
      isolation: schema
      schema-pattern: "tenant_{id}"
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
tenant:
  resolution:
    remote: true
    platform:
      base-domain: ${env:EDK_PLATFORM_BASE_DOMAIN}
      subdomain:
        enabled: true
    custom-domain:
      enabled: true
  platform:
    owner:
      initial-credential: ${env:EDK_OWNER_INITIAL_CREDENTIAL}
  onboarding:
    operator:
      enabled: true
kms:
  providers:
    software:
      id: software
      type: software
      enabled: true
      autoCreateCertificate: true
      keystore:
        type: pkcs12
        id: software
        password: ${env:EDK_KEYSTORE_PASSWORD}
        path: "{tempDir}/edk-verify-keystore.p12"
crypto:
  kms:
    # The AS signing roles resolve against the tenant default provider, which is
    # served remotely by the tenant KMS via the kms routing module above. No key
    # material is held locally.
    roles:
      oauth2-as:
        algorithm: ES256
      issuer-signing:
        algorithm: ES256
      issuer-request-decryption:
        algorithm: ES256
      verifier-request-object-signing:
        algorithm: ES256
# AS instances, clients, and grant policy are platform-config rows seeded by
# tenant setup. Use config.overrides.oauth2.* only for explicit local overrides.
application:
  bootstrap:
    on-startup: false
app:
  security:
    encryption:
      # Federation session store encrypts PendingFederation under SYSTEM_TENANT using
      # this app-level key. Without it, Keycloak initiate fails at persist with
      # "encrypt PendingFederation failed".
      activeKeyId: ${env:FEDERATION_SESSION_ENCRYPTION_ACTIVE_KEY_ID:federation.session.v1}
      keys:
        federation:
          session:
            v1: ${env:FEDERATION_SESSION_ENCRYPTION_KEY}
  deployment-mode: ${env:EDK_DEPLOYMENT_MODE:prod}
auth:
  login:
    require-application: false
license:
  # Installation gate: the tenant AS binds to the platform installation and
  # declares its service role. Leave installation-id blank for first-run setup;
  # the verified protected license bundle supplies the installation binding.
  # Set EDK_INSTALLATION_ID only when intentionally pinning this runtime to a
  # known installation id; a mismatch fails closed.
  command-enforcement:
    enabled: true
    missing-descriptor-mode: warn
  installation-id: ${env:EDK_INSTALLATION_ID:}
  gate:
    service-role: enterprise-tenant-as
  trust:
    # Trust the compiled-in durable root. A license bound to this installation
    # chains leaf -> intermediate -> embedded root, so no trust file is mounted.
    embedded:
      enabled: ${env:EDK_LICENSE_TRUST_EMBEDDED:true}
    root-ca-bundle-path: /app/license/license-root-ca.pem

secret:
  authority:
    allowed-clock-skew-millis: 5000
    satellite:
      workload-id: service-tenant-as
      workload-hosting-revision: 1
      assertion:
        issuer: sphereon-secret-workload
        audience: enterprise-platform
        ttl-millis: 30000
        signing-key: ${env:SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY}
      permit:
        issuer: enterprise-platform
        audience: sphereon-secret-use
        verification-keys: ${env:SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS}

# Credential design content uses the same tenant-routed durable store as the issuer.
# Metadata repositories remain PostgreSQL; this stores asset bytes, not another design registry.
blob:
  stores:
    designs:
      type: kvstore
      scopeBinding: TENANT
      kvStoreId: design-assets
kv:
  stores:
    design-assets:
      type: KvStoreConfig
      backendId: database
      scopeBinding: TENANT
    blob:
      metadata:
        type: KvStoreConfig
        backendId: database
        scopeBinding: TENANT

# Invitation owner: this service holds the invitation state of every tenant except the platform tenant. Callers are
# default deny; the keys are the callers' server.service-identity.client-id values. The handlers of the two listed
# actions run in the issuer and the verifier (transport.routing.modules.[invitation-handler]).
invitation:
  handlers:
    remote-actions: "credential.issuance,credential.verification"
  callers:
    "[verifier-service]":
      actions: "credential.verification"
      operations: "mint,create-one,get,resolve,redeem"
    # The invitation job orchestrator runs on the issuer and creates verification batches too.
    "[issuer-service]":
      actions: "credential.issuance,credential.verification"
      # list: the invitation job service reads the invitations of its batches (held rows, sweep, callbacks).
      # reserve: the issuer reserves, releases and reports the one issuance of an invitation.
      operations: "mint,create-one,create-batch,get,list,resolve,redeem,reserve"

# Blob store each consumer reads and writes. There is no default store: every consumer names its store.
credential-design:
  store-id: designs
schema-registry:
  store-id: designs
