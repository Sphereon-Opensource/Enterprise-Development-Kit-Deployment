# enterprise-tenant-as runtime config.
#
# The tenant authorization server mints the bearer tokens that the tenant runtime
# services (KMS, DID, issuer, verifier) validate. Tenant runtime services trust
# tokens this server issues; the platform AS handles operator login.
#
# Public surface: OAuth/OIDC discovery and protocol endpoints plus the login UI.
# The /api/platform/admin/v1 surface requires an operator bearer even though it
# is tenantless; expose it only internally.
server:
  rest:
    # The AS listens on its public port so its issuer URL self-resolves for JWKS
    # fetches (bearer validation reads <issuer>/.well-known/jwks.json).
    port: 18083
    auth:
      enabled: true
      # Open prefixes: OAuth protocol surface, login UI, discovery/JWKS, the
      # internal pre-auth registration channel and RFC 7662 introspection. The signing-key command
      # transport is
      # intentionally protected: tenant resolution validates the platform-issued
      # bearer and uses its tenant_id claim before the tenant's public host is active.
      anonymous-path-prefixes: /authorize,/login,/logout,/token,/par,/.well-known,/internal/preauth,/introspect,/account-action,/api/account-actions,/as
      # Trust anchor for the platform AS. The internal east-west surfaces validate a short-lived,
      # platform-issued bearer bound to this tenant (per-tenant audience), so they need the platform
      # issuer and JWKS, the same anchor the tenant runtime services trust.
      platform-issuer: ${env:EDK_PLATFORM_PUBLIC_URL}
      platform-jwks-uri: http://enterprise-platform:18080/.well-known/jwks.json
      expected-audience: enterprise-tenant-as
  service-identity:
    token-endpoint: http://enterprise-platform:18080/token
    token-endpoint-allow-http: true
    token-endpoint-source: configured
    active-as-client-role: authorization-server
    client-id: tenant-as-service
    client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
    tenant-bound-client-id: true
    audience: enterprise-platform
    allowed-audiences: enterprise-tenant-kms
sphereon:
  telemetry:
    enabled: true
    tracing:
      enabled: true
    metrics:
      enabled: true
    sampling:
      rate: 1.0
    export:
      preset: otlp-all
  service:
    id: service-tenant-as
otel:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  exporter:
    otlp:
      endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      protocol: ${env:EDK_OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      traces:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:grpc}
      metrics:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:grpc}
security:
  workload-trust-policy:
    trusted_service_ids:
      - service-crypto
      - service-data
      - service-oid4vci
      - service-oid4vp
      - service-eidas
      - service-monolith
    service_client_bindings:
      "[service-crypto]": kms-service
      "[service-data]": did-service
      "[service-oid4vci]": issuer-service
      "[service-oid4vp]": verifier-service
transport:
  grpc:
    enabled: false
    port: 9090
  routing:
    configScope: APP
    modules:
      kms:
        serviceTokenAudience: enterprise-tenant-kms
        preferServiceTokenOverSessionBearer: true
        services:
          key: &tenantKmsGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-tenant-kms:9090
          keys: *tenantKmsGrpcRoute
          signature:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-tenant-kms:9090
            commands:
              "[kms.signature.verify]":
                target: LOCAL
          mac: *tenantKmsGrpcRoute
          encryption: *tenantKmsGrpcRoute
          ecdh: *tenantKmsGrpcRoute
      platform:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
        services:
          config: &platformGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-platform:9090
            serviceTokenAudience: enterprise-platform
      application:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
      auth:
        # Identity and credential storage is owned by the platform control plane. Hosted login
        # stays local, but password verification must use the same central credential authority.
        serviceTokenAudience: enterprise-platform
        preferServiceTokenOverSessionBearer: true
        services:
          credentials:
            commands:
              "[auth.credentials.verify-remote]":
                target: SERVER
                transport: GRPC
                endpoint: grpc://enterprise-platform:9090
      secret:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
        preferServiceTokenOverSessionBearer: false
# The issuer is a resource server of every tenant AS and obtains a tenant-scoped
# token through this confidential client. Helm registers each satellite with a
# distinct clientSecretKeys entry (still exposed to the pod as
# EDK_INTERNAL_CLIENT_SECRET). Compose currently shares one env value across
# satellites; splitting Compose is a follow-up.
oauth2:
  servers:
    default:
      internal-clients:
        issuer:
          client-id: issuer-service
          client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
config:
  providers:
    platform-config-remote:
      enabled: true
      bootstrap-required-keyspaces: oauth2.servers,crypto.kms.roles
    tenant-config-db:
      enabled: false
database:
  app:
    default:
      dialect: postgresql
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
    # Runtime roles validate the platform-migrated shared schema and never receive DDL credentials.
    secret-management-tenant:
      dialect: postgresql
      isolation: shared
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: secret_management_tenant_serving
      password: ${env:EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
      pool:
        dedicated-pool: true
    secret-management-runtime:
      dialect: postgresql
      isolation: shared
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: secret_management_runtime
      password: ${env:EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}
      pool:
        dedicated-pool: true
  tenants:
    default:
      dialect: postgresql
      isolation: schema
      schema-pattern: "tenant_{id}"
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
tenant:
  resolution:
    remote: true
    platform:
      base-domain: ${env:EDK_PLATFORM_BASE_DOMAIN}
      subdomain:
        enabled: true
    custom-domain:
      enabled: true
  platform:
    owner:
      initial-credential: ${env:EDK_OWNER_INITIAL_CREDENTIAL}
  onboarding:
    operator:
      enabled: true
kms:
  providers:
    software:
      id: software
      type: software
      enabled: true
      autoCreateCertificate: true
      keystore:
        type: pkcs12
        id: software
        password: ${env:EDK_KEYSTORE_PASSWORD}
        path: "{tempDir}/edk-verify-keystore.p12"
crypto:
  kms:
    # The AS signing roles resolve against the tenant default provider, which is
    # served remotely by the tenant KMS via the kms routing module above. No key
    # material is held locally.
    roles:
      oauth2-as:
        algorithm: ES256
      issuer-signing:
        algorithm: ES256
      issuer-request-decryption:
        algorithm: ES256
      verifier-request-object-signing:
        algorithm: ES256
# AS instances, clients, and grant policy are platform-config rows seeded by
# tenant setup. Use config.overrides.oauth2.* only for explicit local overrides.
application:
  bootstrap:
    on-startup: false
app:
  # TODO: set to prod for a production deployment.
  deployment-mode: ${env:EDK_DEPLOYMENT_MODE:prod}
auth:
  login:
    require-application: false
license:
  # Installation gate: the tenant AS binds to the platform installation and
  # declares its service role. Leave installation-id blank for first-run setup;
  # the verified protected license bundle supplies the installation binding.
  # Set EDK_INSTALLATION_ID only when intentionally pinning this runtime to a
  # known installation id; a mismatch fails closed.
  command-enforcement:
    enabled: true
    missing-descriptor-mode: warn
  installation-id: ${env:EDK_INSTALLATION_ID:}
  gate:
    service-role: enterprise-tenant-as
  trust:
    # Trust the compiled-in durable root. A license bound to this installation
    # chains leaf -> intermediate -> embedded root, so no trust file is mounted.
    embedded:
      enabled: ${env:EDK_LICENSE_TRUST_EMBEDDED:true}
    root-ca-bundle-path: /app/license/license-root-ca.pem

secret:
  authority:
    allowed-clock-skew-millis: 5000
    satellite:
      workload-id: service-tenant-as
      workload-hosting-revision: 1
      assertion:
        issuer: sphereon-secret-workload
        audience: enterprise-platform
        ttl-millis: 30000
        signing-key: ${env:SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY}
      permit:
        issuer: enterprise-platform
        audience: sphereon-secret-use
        verification-keys: ${env:SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS}
