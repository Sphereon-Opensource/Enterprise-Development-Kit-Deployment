# enterprise-tenant-kms runtime config.
#
# The KMS service holds key material and serves signing, MAC, and encryption
# commands to the other services over gRPC. It has NO public ingress. Reach it
# only from inside the cluster network or service mesh. Every REST request
# outside the implicit /health, /ready, /metrics prefixes must carry a bearer
# minted by the tenant AS.
server:
  rest:
    port: 8080
    auth:
      enabled: true
      # Tenant bearer issuers are dynamic. The platform creates one active
      # OAUTH2_AUTHORIZATION_SERVER public endpoint binding per onboarded
      # tenant, normally https://<tenant>.<base-domain>. This service trusts
      # those registry-backed issuers instead of a deployment-time tenant URL.
      # Trust the platform operator AS as a second fixed issuer so operator->tenant
      # STS tokens (RFC 8693) from the admin console are accepted.
      platform-issuer: ${env:EDK_PLATFORM_PUBLIC_URL}
      platform-jwks-uri: http://enterprise-platform:18080/.well-known/jwks.json
      self-jwks-base-url: http://enterprise-tenant-as:18083
      expected-audience: enterprise-tenant-kms
      trust-tenant-registry-issuers: ${env:EDK_TRUST_TENANT_REGISTRY_ISSUERS:true}
  service-identity:
    token-endpoint: http://enterprise-platform:18080/token
    token-endpoint-allow-http: true
    token-endpoint-source: configured
    active-as-client-role: kms
    client-id: kms-service
    client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
    tenant-bound-client-id: true
    audience: enterprise-platform
sphereon:
  telemetry:
    enabled: true
    tracing:
      enabled: true
    metrics:
      enabled: true
    sampling:
      rate: 1.0
    export:
      preset: otlp-all
  service:
    id: service-crypto
otel:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  exporter:
    otlp:
      endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      protocol: ${env:EDK_OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      traces:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:grpc}
      metrics:
        endpoint: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://otel-collector:4317}
        protocol: ${env:EDK_OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:grpc}
security:
  workload-trust-policy:
    trusted_service_ids:
      - service-crypto
      - service-data
      - service-oid4vci
      - service-oid4vp
      - service-eidas
      - service-monolith
      - service-tenant-as
    service_client_bindings:
      "[service-crypto]": kms-service
      "[service-data]": did-service
      "[service-oid4vci]": issuer-service
      "[service-oid4vp]": verifier-service
      "[service-tenant-as]": tenant-as-service
transport:
  grpc:
    enabled: true
    port: 9090
  routing:
    # Platform/license endpoints are deployment topology and must remain
    # available before tenant/principal configuration has loaded.
    configScope: APP
    modules:
      platform:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
        services:
          config: &platformGrpcRoute
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-platform:9090
            serviceTokenAudience: enterprise-platform
      application:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
      secret:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-platform:9090
        serviceTokenAudience: enterprise-platform
        # Authority metadata and permit exchange use the already downscoped tenant
        # bootstrap bearer; replacing it would recurse through the credential being unlocked.
        preferServiceTokenOverSessionBearer: false
config:
  # This workload receives the KMS commands that platform-side tenant sessions
  # route to SERVER. Keep the receiver's deployment-local execution target
  # LOCAL so it does not recursively invoke its own remote endpoint.
  overrides:
    transport:
      routing:
        modules:
          kms:
            services:
              key:
                target: LOCAL
              leaf:
                target: LOCAL
              mac:
                target: LOCAL
              encryption:
                target: LOCAL
  providers:
    platform-config-remote:
      enabled: true
      bootstrap-required-keyspaces: crypto.kms.roles
    tenant-config-db:
      enabled: false
license:
  # Deployment gate: this service declares its service role and validates the
  # protected license bundle. Leave installation-id blank for first-run setup;
  # set EDK_INSTALLATION_ID only when intentionally pinning this runtime to a
  # known installation id.
  command-enforcement:
    enabled: true
    missing-descriptor-mode: warn
  installation-id: ${env:EDK_INSTALLATION_ID:}
  gate:
    service-role: enterprise-tenant-kms
database:
  app:
    default:
      dialect: postgresql
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
    secret-management-tenant:
      dialect: postgresql
      isolation: shared
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: secret_management_tenant_serving
      password: ${env:EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
      pool:
        dedicated-pool: true
    secret-management-runtime:
      dialect: postgresql
      isolation: shared
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: secret_management_runtime
      password: ${env:EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}
      pool:
        dedicated-pool: true
  tenants:
    default:
      dialect: postgresql
      isolation: schema
      schema-pattern: "tenant_{id}"
      host: ${env:EDK_TENANT_DB_HOST}
      port: 5432
      database: ${env:EDK_TENANT_DB_NAME}
      username: ${env:EDK_TENANT_DB_USERNAME}
      password: ${env:EDK_TENANT_DB_PASSWORD}
tenant:
  resolution:
    remote: true
    platform:
      base-domain: ${env:EDK_PLATFORM_BASE_DOMAIN}
      subdomain:
        enabled: true
    custom-domain:
      enabled: true
kms:
  # Internal-only software provider used before tenant platform config has been
  # pulled. It gives tenant-KMS local crypto support for validating platform
  # bearer signatures; REST discovery hides providers marked system=true.
  providers:
    internal-token-verifier:
      type: software
      id: internal-token-verifier
      enabled: true
      system: true
      role: internal
      exposePrivateKeysDuringGeneration: false
      persistKeysDuringGeneration: false
      keyStore:
        type: memory
        id: internal-token-verifier-memory
        keyVisibility: public
        overwriteAlias: true
  # Tenant KMS roles are authored by the platform during tenant registration and
  # exposed to this service through platform-config-remote as crypto.kms.roles.*.
  # Tenant-KMS must not define a second tenant-visible local role or restore the
  # removed generic provider API. Key material persists in the tenant-kms-keystore
  # volume mounted at /keystore.
  enterprise:
    lifecycle:
      enabled: true
      interval: PT1H
      run-on-startup: true

secret:
  authority:
    allowed-clock-skew-millis: 5000
    satellite:
      workload-id: service-crypto
      workload-hosting-revision: 1
      assertion:
        issuer: sphereon-secret-workload
        audience: enterprise-platform
        ttl-millis: 30000
        signing-key: ${env:SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY}
      permit:
        issuer: enterprise-platform
        audience: sphereon-secret-use
        verification-keys: ${env:SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS}
