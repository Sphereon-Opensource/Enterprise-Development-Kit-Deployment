# Optional journey profile for the platform: the authored-workflow worker, the tenant Portal and the Inbox.
# Mounted as /app/config/application-container.yml by compose/docker-compose.workflow.yml only. The base deployment
# runs without it and routes nothing to these services.

server:
  service-identity:
    # The platform answers a person's lifecycle start and form translation with a token delegated for that person,
    # naming the platform as actor. The delegated token is minted at the tenant authorization server.
    delegation:
      enabled: true
      profile-selection: verified-issuer
      token-endpoint-source: active-as
      active-as-token-endpoint: http://enterprise-tenant-as:18083/token
      active-as-client-role: platform-delegation
      tenant-bound-client-id: true
      audience: enterprise-platform
      allowed-audiences: enterprise-workflow
    platform-user-delegation:
      token-endpoint: http://enterprise-platform:18080/token
      token-endpoint-allow-http: true
      active-as-client-role: platform-delegation
      client-id: platform-delegation-service
      tenant-bound-client-id: true
      audience: enterprise-platform
      allowed-audiences: enterprise-workflow

oauth2:
  servers:
    platform:
      internal-clients:
        workflow:
          client-id: workflow-service
          client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET_WORKFLOW}
          grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
          default-access-token-audience: enterprise-platform
          allowed-access-token-audiences: enterprise-tenant-kms,enterprise-portal,enterprise-tenant-as,enterprise-inbox,enterprise-issuer
          token-exchange:
            mode: secret-bootstrap
            audiences: enterprise-platform
        portal:
          client-id: portal-service
          client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET_PORTAL}
          grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
          default-access-token-audience: enterprise-platform
          allowed-access-token-audiences: enterprise-tenant-kms,enterprise-workflow,enterprise-issuer,enterprise-verifier,enterprise-blob
          token-exchange:
            mode: secret-bootstrap
            audiences: enterprise-platform
        inbox:
          client-id: inbox-service
          client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET_INBOX}
          grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
          default-access-token-audience: enterprise-platform
          allowed-access-token-audiences: enterprise-tenant-kms
          token-exchange:
            mode: secret-bootstrap
            audiences: enterprise-platform

tenant:
  registration:
    internal-clients:
      additional:
        platform-delegation:
          client-id: platform-delegation-service
          allowed-audiences: enterprise-workflow
          grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
          user-delegation-source: enterprise-platform
          user-delegation-audiences: enterprise-workflow
          user-delegation-on-tenant-as: true
        portal:
          client-id: portal-service
          allowed-audiences: enterprise-platform,enterprise-tenant-kms,enterprise-workflow,enterprise-issuer,enterprise-verifier,enterprise-blob
        inbox:
          client-id: inbox-service
          allowed-audiences: enterprise-platform,enterprise-tenant-kms
        workflow:
          client-id: workflow-service
          allowed-audiences: enterprise-platform,enterprise-tenant-kms,enterprise-portal,enterprise-tenant-as,enterprise-inbox,enterprise-issuer

security:
  workload-trust-policy:
    service_client_bindings:
      "[service-workflow]": workflow-service
      "[service-portal]": portal-service
      "[service-inbox]": inbox-service

transport:
  routing:
    # Nothing is delegated unless a route asks for it.
    defaults:
      delegationMode: DISABLED
    modules:
      # Lifecycle execution belongs to the workflow worker. A person's start and form translation carry a token
      # delegated for that person, never the platform's own.
      lifecycle:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-workflow:9090
        serviceTokenAudience: enterprise-workflow
        preferServiceTokenOverSessionBearer: false
        services:
          execution:
            delegationMode: REQUIRED
          form:
            delegationMode: REQUIRED
      portal:
        target: SERVER
        transport: GRPC
        endpoint: grpc://enterprise-portal:9090
        serviceTokenAudience: enterprise-portal
        preferServiceTokenOverSessionBearer: true
      # The platform mounts the workflow REST surfaces; the engine and the submission store live on the worker host.
      workflow:
        serviceTokenAudience: enterprise-workflow
        services:
          submission:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-workflow:9090
            preferServiceTokenOverSessionBearer: true
          execution:
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-workflow:9090
            preferServiceTokenOverSessionBearer: false
            delegationMode: REQUIRED
          "[form-operation]":
            target: SERVER
            transport: GRPC
            endpoint: grpc://enterprise-workflow:9090
            preferServiceTokenOverSessionBearer: false
            delegationMode: REQUIRED
