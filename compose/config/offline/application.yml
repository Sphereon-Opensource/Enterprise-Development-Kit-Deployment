# Offline profile overlay for enterprise-platform.
#
# Use this profile when the deployment is provisioned from a mounted license
# token rather than the interactive setup ceremony. The license token claims the
# setup gate at boot, so the setup endpoints stay closed. Activate it by setting
# APP_PROFILE=offline on the platform container; the platform then reads
# config/offline/application.yml on top of platform.application.yml.
platform:
  config:
    mount-path: /app/config
  onboarding:
    installation-base-domain: ${env:EDK_PLATFORM_BASE_DOMAIN}
    deployment-id: ${env:EDK_DEPLOYMENT_ID:deployment-1}
    license-token-path: license-token.txt
    recipient-key-path: /app/license/license-recipient.jwk.json
    trust-bundle-path: /app/license/license-root-ca.pem
    request-alias: platform-license-request
    operator:
      # TODO: set the platform operator identity for this deployment.
      email: ${env:EDK_PLATFORM_OPERATOR_EMAIL:operator@example.com}
      display-name: Platform Operator
      initial-credential: ${env:EDK_OWNER_INITIAL_CREDENTIAL}
application:
  admin:
    secret-backend:
      type: ${env:EDK_SECRET_BACKEND:config-system-dev-only}
license:
  recipient:
    # Must match the recipient key that the offline license token was encrypted to.
    key-id: ${env:EDK_LICENSE_RECIPIENT_KEY_ID:license-recipient}
    private-key-path: /app/license/license-recipient.jwk.json
  trust:
    embedded:
      enabled: ${env:EDK_LICENSE_TRUST_EMBEDDED:true}
    root-ca-bundle-path: /app/license/license-root-ca.pem
