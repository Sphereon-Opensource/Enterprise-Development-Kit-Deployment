# EDK enterprise stack, single-node Docker Compose deployment.
#
# This file runs the EDK enterprise services plus separate platform and tenant
# PostgreSQL databases from published container images. It pulls images only;
# nothing is built locally.
#
# Prerequisites:
#   1. docker login nexus.sphereon.com so the enterprise image pulls succeed.
#      Set EDK_TAG in .env to select the released image tag. The registry is
#      intentionally fixed to nexus.sphereon.com/edk-docker here; do not use
#      sphereon or docker.io/sphereon because that resolves to public Docker Hub.
#   2. Edit .env (hostnames, database credentials, secrets) and review the per
#      service templates under config/ for the TODO markers.
#   3. Start the stack and complete the license setup screen with the protected
#      license bundle returned by the license operator.
#
# Customer-facing surface:
#   - The gateway route table is the customer URL contract:
#     platform.<base-domain> for the operator plane and <tenant>.<base-domain>
#     for tenant protocol and protected API paths.
#   - The base file's loopback host ports are local diagnostics only. Do not
#     publish them as customer routes and do not use service health probes as
#     customer checks.
#   - For a customer-managed reverse proxy without the gateway overlay, point
#     public origins at that proxy and preserve Host/X-Forwarded-Proto.
#   - Tenant KMS has no public ingress. It is reachable only on the internal
#     compose network.
#
# The platform, tenant KMS, wallet unit, and wallet interaction services run the
# gRPC server transport (inbound). The other services route KMS and wallet
# commands over internal gRPC only.

name: edk-enterprise

x-edk-public-urls: &edk-public-urls
  platform: &edk-platform-public-url ${EDK_PLATFORM_EXTERNAL_BASE_URL:-https://platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}}
  onboarding: &edk-onboarding-ui-public-url ${EDK_ONBOARDING_UI_EXTERNAL_BASE_URL:-${EDK_PLATFORM_EXTERNAL_BASE_URL:-https://platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}}}

x-edk-common-env: &edk-common-env
  APP_PROFILE: container
  PORT: "8080"
  REST_PORT: "8080"
  # DualTransport parses GRPC_AUTH_MODE at boot even when gRPC is disabled.
  # Canonical alias matches Helm grpc.authMode; unknown/blank fails closed.
  GRPC_AUTH_MODE: service-jwt
  SPHEREON_CONFIG_LOCATION: /app/config
  EDK_PLATFORM_BASE_DOMAIN: ${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}
  EDK_PLATFORM_PUBLIC_URL: *edk-platform-public-url
  # Workload STS requires an HTTPS issuer. This is overrideable for a
  # customer-managed reverse proxy, but must remain identical across services.
  EDK_PLATFORM_ISSUER: ${EDK_PLATFORM_ISSUER:-https://platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}}
  EDK_TRUST_TENANT_REGISTRY_ISSUERS: ${EDK_TRUST_TENANT_REGISTRY_ISSUERS:-true}
  EDK_KEYSTORE_PASSWORD: ${EDK_KEYSTORE_PASSWORD}
  EDK_DEPLOYMENT_MODE: ${EDK_DEPLOYMENT_MODE:-prod}
  EDK_OWNER_INITIAL_CREDENTIAL: ${EDK_OWNER_INITIAL_CREDENTIAL}
  SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY: ${SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY:?Generate the secret-authority key window before starting the stack}
  SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS: ${SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS:?Generate the secret-authority key window before starting the stack}

# Distinct confidential-client passwords per STS registration. Satellites still
# consume EDK_INTERNAL_CLIENT_SECRET (one value per container). Platform sees
# every EDK_INTERNAL_CLIENT_SECRET_<ROLE> for internal-clients interpolation.
x-edk-platform-sts-secrets: &edk-platform-sts-secrets
  EDK_INTERNAL_CLIENT_SECRET_TENANT_KMS: ${EDK_INTERNAL_CLIENT_SECRET_TENANT_KMS:?Set EDK_INTERNAL_CLIENT_SECRET_TENANT_KMS}
  EDK_INTERNAL_CLIENT_SECRET_TENANT_AS: ${EDK_INTERNAL_CLIENT_SECRET_TENANT_AS:?Set EDK_INTERNAL_CLIENT_SECRET_TENANT_AS}
  EDK_INTERNAL_CLIENT_SECRET_DID: ${EDK_INTERNAL_CLIENT_SECRET_DID:?Set EDK_INTERNAL_CLIENT_SECRET_DID}
  EDK_INTERNAL_CLIENT_SECRET_BLOB: ${EDK_INTERNAL_CLIENT_SECRET_BLOB:?Set EDK_INTERNAL_CLIENT_SECRET_BLOB}
  EDK_INTERNAL_CLIENT_SECRET_ISSUER: ${EDK_INTERNAL_CLIENT_SECRET_ISSUER:?Set EDK_INTERNAL_CLIENT_SECRET_ISSUER}
  EDK_INTERNAL_CLIENT_SECRET_VERIFIER: ${EDK_INTERNAL_CLIENT_SECRET_VERIFIER:?Set EDK_INTERNAL_CLIENT_SECRET_VERIFIER}
  EDK_INTERNAL_CLIENT_SECRET_EMAIL: ${EDK_INTERNAL_CLIENT_SECRET_EMAIL:?Set EDK_INTERNAL_CLIENT_SECRET_EMAIL}

x-edk-tenant-db-env: &edk-tenant-db-env
  EDK_TENANT_DB_HOST: tenant-postgres
  EDK_TENANT_DB_NAME: ${EDK_TENANT_DB_NAME:-tenant}
  EDK_TENANT_DB_USERNAME: ${EDK_TENANT_DB_USERNAME:-edk_tenant}
  EDK_TENANT_DB_PASSWORD: ${EDK_TENANT_DB_PASSWORD}
  # Every runtime hosts the secret-use broker and uses only the tenant-serving
  # role. Authority-admin persistence credentials are platform-only.
  EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
  # Narrow runtime role for the shared replay ledger. It is not an authority-admin credential.
  EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}

x-edk-runtime-healthcheck-8080: &edk-runtime-healthcheck-8080
  # The runtime image ships no curl or wget; bash /dev/tcp is always available.
  # Before first-run setup closes, workload /health is license-gated and can
  # return 503. Accept that only while the platform setup gate is still open, so
  # the full customer stack can start before license import but fails closed
  # after setup if the license is still missing.
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && line=$$(head -n1 <&3) && echo \"$$line\" | grep -Eq ' (200|204) ' && exit 0; echo \"$$line\" | grep -q ' 503 ' || exit 1; exec 4<>/dev/tcp/enterprise-platform/18080 && printf 'GET /api/platform/setup/v1/status HTTP/1.0\\r\\nHost: platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}\\r\\n\\r\\n' >&4 && head -n1 <&4 | grep -q ' 200 '"]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

x-edk-runtime-healthcheck-18083: &edk-runtime-healthcheck-18083
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18083 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && line=$$(head -n1 <&3) && echo \"$$line\" | grep -Eq ' (200|204) ' && exit 0; echo \"$$line\" | grep -q ' 503 ' || exit 1; exec 4<>/dev/tcp/enterprise-platform/18080 && printf 'GET /api/platform/setup/v1/status HTTP/1.0\\r\\nHost: platform.${EDK_PLATFORM_BASE_DOMAIN:?EDK_PLATFORM_BASE_DOMAIN must be set explicitly}\\r\\n\\r\\n' >&4 && head -n1 <&4 | grep -q ' 200 '"]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

x-edk-runtime-healthcheck-9090: &edk-runtime-healthcheck-9090
  # Wallet runtimes are intentionally gRPC-only in this stack; REST is disabled.
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090"]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  platform-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${EDK_PLATFORM_DB_USERNAME:-edk_platform}
      POSTGRES_PASSWORD: ${EDK_PLATFORM_DB_PASSWORD}
      POSTGRES_DB: ${EDK_PLATFORM_DB_NAME:-platform}
      SECRET_MANAGEMENT_ADMIN_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD}
      SECRET_MANAGEMENT_TENANT_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
      SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
      - ./postgres-init/10-secret-management-roles.sh:/docker-entrypoint-initdb.d/10-secret-management-roles.sh:ro
    networks:
      - platform-db-net
    ports:
      - "127.0.0.1:${EDK_PLATFORM_POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "/docker-entrypoint-initdb.d/10-secret-management-roles.sh"]
      interval: 3s
      timeout: 3s
      retries: 20
      # initdb runs the same script as postgres while the healthcheck runs it as root. Holding
      # the first probe back until initdb has finished keeps the two out of each other's way.
      start_period: 20s

  tenant-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${EDK_TENANT_DB_USERNAME:-edk_tenant}
      POSTGRES_PASSWORD: ${EDK_TENANT_DB_PASSWORD}
      POSTGRES_DB: ${EDK_TENANT_DB_NAME:-tenant}
      SECRET_MANAGEMENT_ADMIN_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD}
      SECRET_MANAGEMENT_TENANT_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
      SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}
    volumes:
      - tenant-postgres-data:/var/lib/postgresql/data
      - ./postgres-init/10-secret-management-roles.sh:/docker-entrypoint-initdb.d/10-secret-management-roles.sh:ro
    networks:
      - tenant-db-net
    ports:
      - "127.0.0.1:${EDK_TENANT_POSTGRES_HOST_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "POSTGRES_USER=${EDK_TENANT_DB_USERNAME:-edk_tenant} POSTGRES_DB=${EDK_TENANT_DB_NAME:-tenant} SECRET_MANAGEMENT_ADMIN_DB_PASSWORD=$${SECRET_MANAGEMENT_ADMIN_DB_PASSWORD} SECRET_MANAGEMENT_TENANT_DB_PASSWORD=$${SECRET_MANAGEMENT_TENANT_DB_PASSWORD} SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD=$${SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD} sh /docker-entrypoint-initdb.d/10-secret-management-roles.sh"]
      interval: 3s
      timeout: 3s
      retries: 20
      # Same reason as platform-postgres: the healthcheck and initdb run this script as
      # different users, so let initdb settle before the first probe.
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - appnet
    ports:
      - "127.0.0.1:${EDK_OTEL_COLLECTOR_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${EDK_OTEL_COLLECTOR_HTTP_HOST_PORT:-4318}:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.54
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - appnet
    ports:
      - "127.0.0.1:${EDK_JAEGER_UI_HOST_PORT:-16686}:16686"

  # Control plane: operator login, OAuth/OIDC discovery, setup, platform admin,
  # platform config. Local licensing authority for the deployment. Runs the gRPC
  # server transport for config routing; REST listens on 18080 in-container.
  enterprise-platform:
    image: nexus.sphereon.com/edk-docker/enterprise-platform:${EDK_TAG:-0.25.0-SNAPSHOT}
    depends_on:
      platform-postgres:
        condition: service_healthy
      tenant-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - appnet
      - platform-db-net
      - tenant-db-net
    environment:
      <<: [*edk-common-env, *edk-tenant-db-env, *edk-platform-sts-secrets]
      EDK_PLATFORM_DB_HOST: platform-postgres
      SECRET_AUTHORITY_CENTRAL_PERMIT_SIGNING_KEY: ${SECRET_AUTHORITY_CENTRAL_PERMIT_SIGNING_KEY:?Generate the secret-authority key window before starting the stack}
      SECRET_AUTHORITY_CENTRAL_ASSERTION_VERIFICATION_KEYS: ${SECRET_AUTHORITY_CENTRAL_ASSERTION_VERIFICATION_KEYS:?Generate the secret-authority key window before starting the stack}
      EDK_PLATFORM_DB_NAME: ${EDK_PLATFORM_DB_NAME:-platform}
      EDK_PLATFORM_DB_USERNAME: ${EDK_PLATFORM_DB_USERNAME:-edk_platform}
      EDK_PLATFORM_DB_PASSWORD: ${EDK_PLATFORM_DB_PASSWORD}
      DATABASE_APP_DEFAULT_DIALECT: postgresql
      DATABASE_APP_DEFAULT_ISOLATION: shared
      DATABASE_APP_DEFAULT_HOST: platform-postgres
      DATABASE_APP_DEFAULT_PORT: "5432"
      DATABASE_APP_DEFAULT_DATABASE: ${EDK_PLATFORM_DB_NAME:-platform}
      DATABASE_APP_DEFAULT_USERNAME: ${EDK_PLATFORM_DB_USERNAME:-edk_platform}
      DATABASE_APP_DEFAULT_PASSWORD: ${EDK_PLATFORM_DB_PASSWORD}
      DATABASE_APP_TENANT_MIGRATOR_DIALECT: postgresql
      DATABASE_APP_TENANT_MIGRATOR_ISOLATION: shared
      DATABASE_APP_TENANT_MIGRATOR_HOST: tenant-postgres
      DATABASE_APP_TENANT_MIGRATOR_PORT: "5432"
      DATABASE_APP_TENANT_MIGRATOR_DATABASE: ${EDK_TENANT_DB_NAME:-tenant}
      DATABASE_APP_TENANT_MIGRATOR_USERNAME: ${EDK_TENANT_DB_USERNAME:-edk_tenant}
      DATABASE_APP_TENANT_MIGRATOR_PASSWORD: ${EDK_TENANT_DB_PASSWORD}
      DATABASE_TENANTS_DEFAULT_DIALECT: postgresql
      DATABASE_TENANTS_DEFAULT_ISOLATION: schema
      DATABASE_TENANTS_DEFAULT_SCHEMA_PATTERN: tenant_{id}
      DATABASE_TENANTS_DEFAULT_HOST: tenant-postgres
      DATABASE_TENANTS_DEFAULT_PORT: "5432"
      DATABASE_TENANTS_DEFAULT_DATABASE: ${EDK_TENANT_DB_NAME:-tenant}
      DATABASE_TENANTS_DEFAULT_USERNAME: ${EDK_TENANT_DB_USERNAME:-edk_tenant}
      DATABASE_TENANTS_DEFAULT_PASSWORD: ${EDK_TENANT_DB_PASSWORD}
      EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD}
      EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
      EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD: ${EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD:?Set EDK_SECRET_MANAGEMENT_RUNTIME_DB_PASSWORD}
      # Fail-closed cloud offering gate; Azure/AWS credentials are never copied
      # into this file and are attached through the typed platform-config API.
      # Compose is the developer-facing stack: expose typed Azure/AWS KMS
      # offerings by default. Credentials are attached through platform-config.
      SECRET_MANAGEMENT_AUTHORITY_TENANT_POLICY_ALLOW_TENANT_MANAGED_PROVIDERS: ${SECRET_MANAGEMENT_AUTHORITY_TENANT_POLICY_ALLOW_TENANT_MANAGED_PROVIDERS:-true}
      EXTERNAL_BASE_URL: *edk-platform-public-url
      ONBOARDING_UI_BASE_URL: *edk-onboarding-ui-public-url
      ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET: ${EDK_ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET:?Set EDK_ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET}
      PORT: "18080"
      REST_PORT: "18080"
      REST_ENABLED: "false"
      GRPC_ENABLED: "true"
      GRPC_PORT: "9090"
      TRANSPORT_AUTH_EXPECTED_AUDIENCE: enterprise-platform
      SPHEREON_APP_TRANSPORT_AUTH_EXPECTED_AUDIENCE: enterprise-platform
      AUTHORIZATION_SERVER_MIGRATION_RESUME_FAILED: ${AUTHORIZATION_SERVER_MIGRATION_RESUME_FAILED:-false}
      TENANT_KMS_AUTHORITY_BOOTSTRAP_HOST: enterprise-tenant-kms
      TENANT_KMS_AUTHORITY_BOOTSTRAP_PORT: "9090"
    volumes:
      - ./config/platform.application.yml:/app/config/application.yml:ro
      - ./config:/app/config/external:ro
      - ./config/secret-management-environment.manifest:/app/secret-management/deployment/environment.manifest:ro
      - ./config/secret-provider-private-endpoints.manifest:/app/secret-management/egress/private-endpoints.manifest:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/central:/app/secret-authority/central:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public:/app/secret-authority/public:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-platform:/app/secret-authority/workload:ro
      - platform-keystore:/keystore
    ports:
      - "${EDK_PLATFORM_HOST_PORT:-18080}:18080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Tenant authorization server: mints the bearer tokens the runtime services
  # validate. REST listens on 18083 in-container so its issuer URL self-resolves.
  enterprise-tenant-as:
    image: nexus.sphereon.com/edk-docker/enterprise-tenant-as:${EDK_TAG:-0.25.0-SNAPSHOT}
    depends_on:
      tenant-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      enterprise-platform:
        condition: service_healthy
    networks:
      - appnet
      - tenant-db-net
    environment:
      <<: [*edk-common-env, *edk-tenant-db-env]
      EDK_INTERNAL_CLIENT_SECRET: ${EDK_INTERNAL_CLIENT_SECRET_TENANT_AS:?Set EDK_INTERNAL_CLIENT_SECRET_TENANT_AS}
      EDK_INTERNAL_CLIENT_SECRET_ISSUER: ${EDK_INTERNAL_CLIENT_SECRET_ISSUER:?Set EDK_INTERNAL_CLIENT_SECRET_ISSUER}
      PORT: "18083"
      REST_PORT: "18083"
      # Authenticated issuer/verifier workloads call the Trust Domain API on
      # tenant-AS with service tokens issued by an active tenant AS binding.
      # Trust domains, anchors, and validation relationships remain REST state.
      SERVER_REST_AUTH_TRUST_TENANT_REGISTRY_ISSUERS: "true"
      # Remote theme resolution (theme.client.base-url): the hosted login page fetches
      # tenant/application branding from the platform service's public theme endpoints.
      # Unset it to serve the neutral login page.
      THEME_CLIENT_BASE_URL: http://enterprise-blob:8080
    volumes:
      - ./config/tenant-as.application.yml:/app/config/application.yml:ro
      - ./config:/app/config/external:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem:/app/secret-authority/public/central-permit.pub.pem:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-tenant-as:/app/secret-authority/workload:ro
    ports:
      - "${EDK_AS_HOST_PORT:-18083}:18083"
    healthcheck: *edk-runtime-healthcheck-18083

  # Key management: holds key material, serves signing/MAC/encryption commands
  # over gRPC. No public ingress. Runs the gRPC server transport (inbound).
  enterprise-tenant-kms:
    image: nexus.sphereon.com/edk-docker/enterprise-tenant-kms:${EDK_TAG:-0.25.0-SNAPSHOT}
    depends_on:
      tenant-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      enterprise-platform:
        condition: service_healthy
      enterprise-tenant-as:
        condition: service_healthy
    networks:
      - appnet
      - tenant-db-net
    environment:
      <<: [*edk-common-env, *edk-tenant-db-env]
      EDK_INTERNAL_CLIENT_SECRET: ${EDK_INTERNAL_CLIENT_SECRET_TENANT_KMS:?Set EDK_INTERNAL_CLIENT_SECRET_TENANT_KMS}
      EXTERNAL_BASE_URL: ${EDK_KMS_INTERNAL_BASE_URL:-http://enterprise-tenant-kms:8080}
      REST_ENABLED: "false"
      GRPC_ENABLED: "true"
      GRPC_PORT: "9090"
    volumes:
      - ./config/tenant-kms.application.yml:/app/config/application.yml:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem:/app/secret-authority/public/central-permit.pub.pem:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-crypto:/app/secret-authority/workload:ro
      - tenant-kms-keystore:/keystore
    # No host port mapping: tenant KMS is internal-only.
    expose:
      - "8080"
      - "9090"
    healthcheck: *edk-runtime-healthcheck-8080

  # DID resolver and did.json hosting; routes KMS commands to tenant KMS.
  enterprise-did:
    image: nexus.sphereon.com/edk-docker/enterprise-did:${EDK_TAG:-0.25.0-SNAPSHOT}
    depends_on:
      tenant-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      enterprise-platform:
        condition: service_healthy
      enterprise-tenant-kms:
        condition: service_healthy
    networks:
      - appnet
      - tenant-db-net
    environment:
      <<: [*edk-common-env, *edk-tenant-db-env]
      EDK_INTERNAL_CLIENT_SECRET: ${EDK_INTERNAL_CLIENT_SECRET_DID:?Set EDK_INTERNAL_CLIENT_SECRET_DID}
      EXTERNAL_BASE_URL: ${EDK_DID_EXTERNAL_BASE_URL:-http://localhost:18082}
    volumes:
      - ./config/did.application.yml:/app/config/application.yml:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem:/app/secret-authority/public/central-permit.pub.pem:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-data:/app/secret-authority/workload:ro
    ports:
      - "${EDK_DID_HOST_PORT:-18082}:8080"
    healthcheck: *edk-runtime-healthcheck-8080

  # Dedicated tenant blob and theme-data service. Branding bytes are kept on
  # their own durable volume and are never stored in the platform container.
  enterprise-blob:
    image: nexus.sphereon.com/edk-docker/service-data:${EDK_TAG:-0.25.0-SNAPSHOT}
    depends_on:
      tenant-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      enterprise-platform:
        condition: service_healthy
      enterprise-tenant-as:
        condition: service_healthy
    networks:
      - appnet
      - tenant-db-net
    environment:
      <<: [*edk-common-env, *edk-tenant-db-env]
      EDK_INTERNAL_CLIENT_SECRET: ${EDK_INTERNAL_CLIENT_SECRET_BLOB:?Set EDK_INTERNAL_CLIENT_SECRET_BLOB}
      EXTERNAL_BASE_URL: ${EDK_BLOB_EXTERNAL_BASE_URL:-http://enterprise-blob:8080}
      REST_ENABLED: "true"
      GRPC_ENABLED: "false"
    volumes:
      - ./config/blob.application.yml:/app/config/application.yml:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem:/app/secret-authority/public/central-permit.pub.pem:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-blob:/app/secret-authority/workload:ro
      - blob-store-data:/app/blobs
    expose:
      - "8080"
    healthcheck: *edk-runtime-healthcheck-8080

  # OID4VCI issuer: serves the wallet-facing protocol surface, signs credentials
  # by routing KMS commands to tenant KMS.
  enterprise-issuer:
    image: nexus.sphereon.com/edk-docker/enterprise-issuer:${EDK_TAG:-0.25.0-SNAPSHOT}
    depends_on:
      tenant-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      enterprise-platform:
        condition: service_healthy
      enterprise-tenant-kms:
        condition: service_healthy
      enterprise-tenant-as:
        condition: service_healthy
    networks:
      - appnet
      - tenant-db-net
    environment:
      <<: [*edk-common-env, *edk-tenant-db-env]
      EDK_INTERNAL_CLIENT_SECRET: ${EDK_INTERNAL_CLIENT_SECRET_ISSUER:?Set EDK_INTERNAL_CLIENT_SECRET_ISSUER}
      EXTERNAL_BASE_URL: ${EDK_ISSUER_EXTERNAL_BASE_URL:-http://localhost:18084}
      EDK_PIPELINE_MASTER_KEK: ${EDK_PIPELINE_MASTER_KEK}
      EDK_PIPELINE_BLIND_INDEX_KEY: ${EDK_PIPELINE_BLIND_INDEX_KEY}
    volumes:
      - ./config/issuer.application.yml:/app/config/application.yml:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem:/app/secret-authority/public/central-permit.pub.pem:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-oid4vci:/app/secret-authority/workload:ro
    ports:
      - "${EDK_ISSUER_HOST_PORT:-18084}:8080"
    healthcheck: *edk-runtime-healthcheck-8080

  # OID4VP verifier: serves the wallet-facing presentation surface, routes KMS
  # and DID commands.
  enterprise-verifier:
    image: nexus.sphereon.com/edk-docker/enterprise-verifier:${EDK_TAG:-0.25.0-SNAPSHOT}
    depends_on:
      tenant-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      enterprise-platform:
        condition: service_healthy
      enterprise-tenant-kms:
        condition: service_healthy
      enterprise-did:
        condition: service_healthy
      enterprise-tenant-as:
        condition: service_healthy
    networks:
      - appnet
      - tenant-db-net
    environment:
      <<: [*edk-common-env, *edk-tenant-db-env]
      EDK_INTERNAL_CLIENT_SECRET: ${EDK_INTERNAL_CLIENT_SECRET_VERIFIER:?Set EDK_INTERNAL_CLIENT_SECRET_VERIFIER}
      EXTERNAL_BASE_URL: ${EDK_VERIFIER_EXTERNAL_BASE_URL:-http://localhost:18085}
    volumes:
      - ./config/verifier.application.yml:/app/config/application.yml:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/public/central-permit.pub.pem:/app/secret-authority/public/central-permit.pub.pem:ro
      - ${EDK_SECRET_AUTHORITY_ROOT:?Set EDK_SECRET_AUTHORITY_ROOT}/workload/service-oid4vp:/app/secret-authority/workload:ro
    ports:
      - "${EDK_VERIFIER_HOST_PORT:-18085}:8080"
    healthcheck: *edk-runtime-healthcheck-8080

  # Platform admin console: a Next.js standalone app served under /admin-console on the
  # platform host. Host-agnostic single build that resolves the API and operator
  # AS (OIDC) origins from the request host at runtime, so it carries no per-host
  # config. Operator login runs against the platform AS; the OAuth callback is
  # {host}/admin-console/callback. Reached only through the gateway (no host
  # port by default).
  admin-console:
    image: nexus.sphereon.com/edk-docker/admin-console:${EDK_TAG:-0.25.0-SNAPSHOT}
    depends_on:
      enterprise-platform:
        condition: service_healthy
      enterprise-blob:
        condition: service_healthy
    networks:
      - appnet
    environment:
      # basePath: the app serves under /admin-console; the root / returns 404.
      NEXT_PUBLIC_BASE_PATH: /admin-console
      ADMIN_CONSOLE_MODE: PLATFORM
      ADMIN_CONSOLE_PLATFORM_BASE_URL: http://enterprise-platform:18080
      ADMIN_CONSOLE_PUBLIC_ORIGIN: *edk-onboarding-ui-public-url
      ADMIN_CONSOLE_ALLOW_LOCAL_DEVELOPMENT: "true"
      ADMIN_CONSOLE_TRUSTED_INGRESS_MODE: DIRECT
      ADMIN_CONSOLE_BFF_OAUTH_TRUSTED_INTERNAL_HTTP_ORIGINS: http://enterprise-platform:18080,http://enterprise-blob:8080
      ADMIN_CONSOLE_WORKLOAD_CLIENT_ID: admin-console-portal-bff
      ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET: ${EDK_ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET:?Set EDK_ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET}
      ADMIN_CONSOLE_AUDIT_BASE_URL: http://enterprise-platform:18080
      ADMIN_CONSOLE_THEME_BASE_URL: http://enterprise-blob:8080
      ADMIN_CONSOLE_TENANT_KMS_BASE_URL: http://enterprise-tenant-kms:8080
      ADMIN_CONSOLE_TENANT_DID_BASE_URL: http://enterprise-did:8080
      ADMIN_CONSOLE_TENANT_AS_BASE_URL: http://enterprise-tenant-as:18083
      ADMIN_CONSOLE_IDENTITY_BASE_URL: http://enterprise-tenant-as:18083
      ADMIN_CONSOLE_TRUST_DOMAIN_BASE_URL: http://enterprise-platform:18080
      ADMIN_CONSOLE_ISSUER_BASE_URL: http://enterprise-issuer:8080
      ADMIN_CONSOLE_VERIFIER_BASE_URL: http://enterprise-verifier:8080
      NEXT_PUBLIC_PLATFORM_AUDIENCE: enterprise-platform
      NEXT_PUBLIC_THEME_AUDIENCE: enterprise-blob
      NEXT_PUBLIC_TENANT_DID_AUDIENCE: enterprise-tenant-did
      NEXT_PUBLIC_TENANT_ISSUER_AUDIENCE: enterprise-issuer
      NEXT_PUBLIC_TENANT_VERIFIER_AUDIENCE: enterprise-verifier
      PORT: "3000"
    # No host port mapping: reached via the gateway at
    # platform.<base-domain>/admin-console.
    # Uncomment to expose the standalone server directly for local debugging.
    # ports:
    #   - "127.0.0.1:${EDK_ADMIN_CONSOLE_HOST_PORT:-13000}:3000"
    healthcheck:
      # The standalone image ships wget; probe the dedicated health route, not the setup-gated page.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/admin-console/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Tenant-facing administration uses the same image and /admin-console path,
  # but runs in a separate least-privilege process. It deliberately receives no
  # platform portal-BFF client id or secret. The trusted request host selects
  # the tenant and its default AS; the application rejects unknown hosts.
  admin-console-tenant:
    image: nexus.sphereon.com/edk-docker/admin-console:${EDK_TAG:-0.25.0-SNAPSHOT}
    depends_on:
      enterprise-platform:
        condition: service_healthy
      enterprise-tenant-as:
        condition: service_healthy
      enterprise-blob:
        condition: service_healthy
    networks:
      - appnet
    environment:
      NEXT_PUBLIC_BASE_PATH: /admin-console
      ADMIN_CONSOLE_MODE: TENANT
      ADMIN_CONSOLE_PLATFORM_BASE_URL: http://enterprise-platform:18080
      ADMIN_CONSOLE_DEVELOPER_CONSOLE_BASE_URL: http://enterprise-platform:18080
      ADMIN_CONSOLE_PLATFORM_BOOTSTRAP_BASE_URL: http://enterprise-platform:18080/api/platform/bootstrap/v1
      ADMIN_CONSOLE_TENANT_CONTEXT_URL: http://enterprise-platform:18080/api/platform/bootstrap/v1/admin-console-context
      ADMIN_CONSOLE_ALLOW_LOCAL_DEVELOPMENT: "false"
      ADMIN_CONSOLE_TRUSTED_INGRESS_MODE: X_FORWARDED
      ADMIN_CONSOLE_TRUSTED_INGRESS_HOPS: "1"
      ADMIN_CONSOLE_BFF_OAUTH_TRUSTED_INTERNAL_HTTP_ORIGINS: http://enterprise-platform:18080,http://enterprise-tenant-as:18083,http://enterprise-blob:8080
      ADMIN_CONSOLE_THEME_BASE_URL: http://enterprise-blob:8080
      ADMIN_CONSOLE_TENANT_KMS_BASE_URL: http://enterprise-tenant-kms:8080
      ADMIN_CONSOLE_TENANT_DID_BASE_URL: http://enterprise-did:8080
      ADMIN_CONSOLE_TENANT_AS_BASE_URL: http://enterprise-tenant-as:18083
      ADMIN_CONSOLE_IDENTITY_BASE_URL: http://enterprise-tenant-as:18083
      ADMIN_CONSOLE_TRUST_DOMAIN_BASE_URL: http://enterprise-platform:18080
      ADMIN_CONSOLE_ISSUER_BASE_URL: http://enterprise-issuer:8080
      ADMIN_CONSOLE_VERIFIER_BASE_URL: http://enterprise-verifier:8080
      NEXT_PUBLIC_TENANT_DID_AUDIENCE: enterprise-tenant-did
      NEXT_PUBLIC_THEME_AUDIENCE: enterprise-blob
      NEXT_PUBLIC_TENANT_ISSUER_AUDIENCE: enterprise-issuer
      NEXT_PUBLIC_TENANT_VERIFIER_AUDIENCE: enterprise-verifier
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/admin-console/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  platform-postgres-data:
  tenant-postgres-data:
  # Platform keystore: platform AS cert/user + the license-request instance cert.
  platform-keystore:
  # Tenant-KMS keystore: per-tenant software key material.
  tenant-kms-keystore:
  # Tenant branding and theme assets owned by enterprise-blob.
  blob-store-data:
networks:
  appnet:
  platform-db-net:
  tenant-db-net:
