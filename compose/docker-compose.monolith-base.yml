# Minimal database base for the customer collection's monolith parity run.
#
# The monolith owns its hosted authorization server and telemetry is disabled
# by its local overlay, so the legacy shared Keycloak and observability
# services are deliberately not part of this test topology.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vdx}
      POSTGRES_USER: ${POSTGRES_USER:-vdx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vdx_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vdx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vdx} -d ${POSTGRES_DB:-vdx}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:

networks:
  vdx-network:
