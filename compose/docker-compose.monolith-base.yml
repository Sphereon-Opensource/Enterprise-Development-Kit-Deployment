# Minimal base for the customer collection's monolith parity run.
#
# The monolith owns its hosted authorization server and telemetry is disabled
# by its local overlay, so the legacy shared Keycloak and observability
# services are deliberately not part of this test topology.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vdx}
      POSTGRES_USER: ${POSTGRES_USER:-vdx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vdx_secret}
    ports:
      - "${POSTGRES_PORT:-15937}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vdx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vdx} -d ${POSTGRES_DB:-vdx}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-11025}:1025"
      - "${MAILPIT_UI_PORT:-18025}:8025"
    volumes:
      - mailpit-data:/data
    networks:
      - vdx-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  mailpit-data:

networks:
  vdx-network:
