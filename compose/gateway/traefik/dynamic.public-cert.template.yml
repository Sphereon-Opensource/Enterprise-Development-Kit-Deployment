# Traefik dynamic routing table for the EDK public static-certificate gateway.
#
# Rendered by scripts/start-letsencrypt.(ps1|sh) when DNS-01 is handled manually
# and the public wildcard certificate is supplied as files under gateway/certs/.
# The generated file is dynamic.public-cert.generated.yml and is gitignored.
#
# Tenant identity is the Host header. The gateway fans out by path prefix to the
# right backend and preserves the Host header so tenant resolution works.

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/wildcard.crt
        keyFile: /etc/traefik/certs/wildcard.key
  certificates:
    - certFile: /etc/traefik/certs/wildcard.crt
      keyFile: /etc/traefik/certs/wildcard.key

http:
  routers:
    # --- Operator / platform host -------------------------------------------
    # No path constraint: the platform plane owns this host entirely (setup,
    # admin, operator login AS, onboarding + admin UI). Higher priority than the
    # tenant wildcard so platform.__BASE_DOMAIN__ never falls through to it.
    platform:
      rule: "Host(`platform.__BASE_DOMAIN__`)"
      entryPoints: ["websecure"]
      service: svc-platform
      priority: 1000
      tls: {}

    # --- Platform admin console (operator-authenticated) --------------------
    # Path-prefix only (no StripPrefix): Next.js serves under /admin-console and emits
    # /admin-console/_next/* asset URLs, which break if the prefix is stripped. Priority
    # above the platform catch-all (1000) so /admin-console reaches the console, not the
    # platform plane. The canonical platform origin is server configuration;
    # instance origins come only from the exact trusted gateway hop.
    platform-admin-console:
      rule: "Host(`platform.__BASE_DOMAIN__`) && PathPrefix(`/admin-console`)"
      entryPoints: ["websecure"]
      service: svc-admin-console
      priority: 1100   # above platform catch-all (1000)
      tls: {}

    # --- KMS / DID management APIs: host-agnostic, routed by path ------------
    # The KMS and DID management APIs are tenant-scoped by the request token,
    # not by host, so the operator console can call them same-origin on the
    # platform host. Deliberately no Host() constraint: priority above the
    # platform catch-all keeps these paths from falling through to platform.
    api-kms:
      rule: "PathPrefix(`/api/kms/v1`)"
      entryPoints: ["websecure"]
      service: svc-kms
      priority: 1100
      tls: {}
    api-did:
      rule: "PathPrefix(`/api/did/v1`)"
      entryPoints: ["websecure"]
      service: svc-did
      priority: 1100
      tls: {}

    # --- Tenant hosts: platform-owned tenant-scoped APIs --------------------
    tenant-platform-theme:
      rule: >-
        HostRegexp(`^[a-z0-9-]+\.__BASE_DOMAIN_REGEX__$`) &&
        PathPrefix(`/api/theme/v1`)
      entryPoints: ["websecure"]
      service: svc-platform
      priority: 300
      tls: {}
    tenant-platform-wallet-entitlement:
      rule: >-
        HostRegexp(`^[a-z0-9-]+\.__BASE_DOMAIN_REGEX__$`) &&
        PathPrefix(`/api/wallet-entitlement/v1`)
      entryPoints: ["websecure"]
      service: svc-platform
      priority: 300
      tls: {}

    # --- Public instance testing-console page -------------------------------
    # Rewrite only the canonical public page URL to Next's internal basePath.
    # Application/bootstrap policy remains fail-closed for disabled instances.
    instance-testing-console-page:
      rule: >-
        HostRegexp(`^[a-z0-9-]+\.__BASE_DOMAIN_REGEX__$`) &&
        PathRegexp(`^/testing-console/(issuer|verifier)/[^/]+/?$`)
      entryPoints: ["websecure"]
      service: svc-admin-console
      middlewares: ["instance-testing-console-add-admin-prefix"]
      priority: 260
      tls: {}

    # Browser-facing testing API under the neutral /testing-console prefix, so
    # the customer-facing surface never exposes admin-console URLs. Rewritten to
    # the Next base path before hitting the app.
    instance-testing-console-api:
      rule: >-
        HostRegexp(`^[a-z0-9-]+\.__BASE_DOMAIN_REGEX__$`) &&
        (PathPrefix(`/testing-console/api/oid4vci/v1/testing`) ||
         PathPrefix(`/testing-console/api/oid4vp/v1/testing`) ||
         Path(`/testing-console/api/portal-oauth/login`) ||
         Path(`/testing-console/api/portal-oauth/callback`) ||
         Path(`/testing-console/api/portal-oauth/grant`) ||
         Path(`/testing-console/api/portal-oauth/revoke`))
      entryPoints: ["websecure"]
      service: svc-admin-console
      middlewares: ["instance-testing-console-api-rewrite"]
      priority: 265
      tls: {}

    # --- Tenant hosts: OID4VCI issuer ---------------------------------------

    # Direct Next/BFF support paths; no public-page rewrite applies here.
    instance-testing-console-support:
      rule: >-
        HostRegexp(`^[a-z0-9-]+\.__BASE_DOMAIN_REGEX__$`) &&
        (PathPrefix(`/admin-console/api/oid4vci/v1/testing`) ||
         PathPrefix(`/admin-console/api/oid4vp/v1/testing`) ||
         Path(`/admin-console/api/portal-oauth/login`) ||
         Path(`/admin-console/api/portal-oauth/callback`) ||
         Path(`/admin-console/api/portal-oauth/grant`) ||
         Path(`/admin-console/api/portal-oauth/revoke`) ||
         PathPrefix(`/admin-console/_next`) ||
         PathPrefix(`/admin-console/public/assets`) ||
         Path(`/admin-console/health`))
      entryPoints: ["websecure"]
      service: svc-admin-console
      priority: 250
      tls: {}

    # --- Tenant hosts: OID4VCI issuer ---------------------------------------
    tenant-issuer:
      rule: >-
        HostRegexp(`^[a-z0-9-]+\.__BASE_DOMAIN_REGEX__$`) &&
        (PathPrefix(`/oid4vci`) || PathPrefix(`/credential`) ||
         PathPrefix(`/deferredCredential`) || PathPrefix(`/nonce`) ||
         PathPrefix(`/notification`) || PathPrefix(`/public/statuslists`) ||
         PathPrefix(`/.well-known/openid-credential-issuer`) || PathPrefix(`/public/schema`) ||
         PathPrefix(`/public/assets`) ||
         PathPrefix(`/api/oid4vci/v1`) || PathPrefix(`/api/credential-design/v1`) ||
         PathPrefix(`/api/statuslist/v1`))
      entryPoints: ["websecure"]
      service: svc-issuer
      priority: 200
      tls: {}

    # --- Tenant hosts: OID4VP verifier --------------------------------------
    tenant-verifier:
      rule: >-
        HostRegexp(`^[a-z0-9-]+\.__BASE_DOMAIN_REGEX__$`) &&
        (PathPrefix(`/oid4vp`) || PathPrefix(`/request_uri`) ||
         PathPrefix(`/direct_post`) || PathPrefix(`/api/oid4vp/v1`) ||
         PathPrefix(`/api/dcql/v1`))
      entryPoints: ["websecure"]
      service: svc-verifier
      priority: 200
      tls: {}

    # --- Tenant hosts: DID --------------------------------------------------
    tenant-did:
      rule: >-
        HostRegexp(`^[a-z0-9-]+\.__BASE_DOMAIN_REGEX__$`) &&
        (PathPrefix(`/1.0/identifiers`) || PathPrefix(`/.well-known/did.json`) ||
         PathPrefix(`/api/did/v1`))
      entryPoints: ["websecure"]
      service: svc-did
      priority: 200
      tls: {}

    # --- Tenant hosts: KMS management --------------------------------------
    tenant-kms:
      rule: >-
        HostRegexp(`^[a-z0-9-]+\.__BASE_DOMAIN_REGEX__$`) &&
        PathPrefix(`/api/kms/v1`)
      entryPoints: ["websecure"]
      service: svc-kms
      priority: 200
      tls: {}

    # --- Tenant hosts: authorization server (lowest tenant priority so the
    # protocol-specific routers above win their paths first) -----------------
    tenant-as:
      rule: >-
        HostRegexp(`^[a-z0-9-]+\.__BASE_DOMAIN_REGEX__$`) &&
        (PathPrefix(`/authorize`) || PathPrefix(`/token`) ||
         PathPrefix(`/userinfo`) || PathPrefix(`/oauth2`) || PathPrefix(`/login`) ||
         PathPrefix(`/.well-known/oauth-authorization-server`) ||
         PathPrefix(`/.well-known/openid-configuration`) ||
         PathPrefix(`/.well-known/jwks.json`))
      entryPoints: ["websecure"]
      service: svc-as
      priority: 100
      tls: {}

  middlewares:
    instance-testing-console-add-admin-prefix:
      addPrefix:
        prefix: /admin-console
    instance-testing-console-api-rewrite:
      replacePathRegex:
        regex: "^/testing-console/(.*)"
        replacement: "/admin-console/$1"

  services:
    svc-platform:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://enterprise-platform:18080"
    svc-as:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://enterprise-tenant-as:18083"
    svc-issuer:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://enterprise-issuer:8080"
    svc-verifier:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://enterprise-verifier:8080"
    svc-did:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://enterprise-did:8080"
    svc-kms:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://enterprise-tenant-kms:8080"
    svc-admin-console:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://admin-console:3000"
