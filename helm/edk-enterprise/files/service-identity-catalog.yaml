      - did
      - blob
      - issuer
      - verifier
      - wallet-onboarding
  admin-console-tenant:
    kind: bff
    clientId: admin-console-portal-bff
    serviceId: null
    receiverAudience: null
    defaultStsAudience: platform
    extraStsAudiences: []
    grpcReceiver: false
    peersIn: []
    peersOut:
      - platform
      - tenant-kms
      - tenant-as
      - did
      - blob
      - issuer
      - verifier
      - wallet-onboarding
  federation-console:
    kind: bff
    clientId: federation-console
    serviceId: null
    receiverAudience: null
    defaultStsAudience: platform
    extraStsAudiences: []
    grpcReceiver: false
    peersIn: []
    peersOut:
      - platform
      - tenant-as
  federation-console-tenant:
    kind: bff
    clientId: null
    serviceId: null
    receiverAudience: null
    defaultStsAudience: platform
    extraStsAudiences: []
    grpcReceiver: false
    peersIn: []
    peersOut:
      - platform
      - tenant-as
  # The backend workload is distinct from the business-wallet browser application below.
  business-wallet-runtime:
    kind: satellite
    clientId: business-wallet-service
    serviceId: service-business-wallet
    receiverAudience: vdx-business-wallet
    defaultStsAudience: platform
    extraStsAudiences:
      - wallet-unit
    grpcReceiver: true
    peersIn:
      - wallet-unit
      - wallet-interaction
      - wallet-onboarding
    peersOut:
