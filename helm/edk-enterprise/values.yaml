global:
  # Registry distributed with the standard EDK channel. An OEM/MSP may provide
  # a private mirror with the same enterprise image set.
  imageRegistry: nexus.sphereon.com/edk-docker
  # Pin the approved enterprise release tag in production. `latest` is rejected
  # in prod and requires imagePullPolicy=Always in non-production testing.
  imageTag: "0.25.0-SNAPSHOT"
  # IfNotPresent is appropriate for immutable/versioned tags. Use Always only
  # when deliberately testing the mutable `latest` tag outside production.
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Required. Set this explicitly for every installation; the chart has no
  # implicit public or localtest domain.
  platformBaseDomain: ""
  # Optional static pod host mappings for isolated integration environments.
  # Production normally leaves this empty and uses cluster/public DNS. The
  # OIDF conformance lane injects its ephemeral suite callback host explicitly.
  hostAliases: []

# Select process composition without renaming topology-neutral deployment
# settings. `distributed` is the established customer deployment; `monolith`
# hosts the same platform and tenant capability set in one application process.
topology:
  mode: distributed

# External product integrations the chart wires (HttpRoute / STS / console BASE_URL)
# but does not deploy. Wallet images stay outside edk-enterprise.
integrations:
  walletOnboarding:
    enabled: false
    # Existing Service (same namespace) that fronts enterprise-wallet-onboarding.
    serviceName: ""
    restPort: 8080

# Settings that exist only because the monolith is one Kubernetes workload.
# Database, license, origin, email, tenant, and secret values remain in their
# normal shared sections above and below.
monolith:
  image: sphereon/vdx-svc-monolith
  imageTag: ""
  replicas: 1
  restPort: 8080
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  env: []

database:
  enabled: true
  dialect: postgresql
  # Two PostgreSQL databases form the deployment's data plane.
  #
  # The control-plane (platform) database holds the tenant registry, routing and
  # public-endpoint bindings, platform configuration, the platform tenant, and the
  # platform authorization server. Only the platform service connects to it.
  #
  # The tenant workload data plane holds per-tenant runtime data. By default this
  # is one schema per tenant in the tenant database. `database` isolation creates
  # one database per tenant on the tenant PostgreSQL server.
  platform:
    host: edk-platform-postgres
    port: 5432
    name: platform
    existingSecret: edk-platform-postgres
    usernameKey: username
    passwordKey: password
    # Egress target for the platform database NetworkPolicy. Leave empty to allow
    # DNS/external managed Postgres; set podSelector or ipBlock in production values
    # to restrict egress to the platform database only.
    networkPolicy:
      # Empty selectors must never fall back to a broad CIDR. The default
      # assumes an in-cluster PostgreSQL workload with this reviewed label;
      # external databases must provide an explicit private endpoint CIDR and
      # enforce the same identity boundary at the database/firewall layer.
      podSelector:
        matchLabels:
          app.kubernetes.io/name: edk-platform-postgres
      namespaceSelector: {}
      ipBlock: {}
  # Secret management uses three fixed, separately credentialed PostgreSQL runtime roles
  # in the platform/tenant databases. None owns or creates schema objects. The deployment-only
  # migrator reuses the platform database owner during startup, then closes that connection.
  secretManagement:
    existingSecret: edk-secret-management-database
    adminPasswordKey: admin-password
    tenantPasswordKey: tenant-password
    runtimePasswordKey: runtime-password
  tenant:
    host: edk-tenant-postgres
    port: 5432
    name: tenant
    existingSecret: edk-tenant-postgres
    usernameKey: username
    passwordKey: password
    # Tenant workload isolation. The enterprise deployment uses one PostgreSQL
    # schema per tenant inside the tenant database.
    isolation: schema
    schemaPattern: "tenant_{id}"
    # Egress target for the tenant database NetworkPolicy. Leave empty to allow
    # DNS/external managed Postgres; set podSelector or ipBlock in production values
    # to restrict egress to the tenant database only.
    networkPolicy:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: edk-tenant-postgres
      namespaceSelector: {}
      ipBlock: {}
# Metadata for the explicit post-provision WeBuild TS 119 612 operator command.
# Helm never performs this authenticated mutation and never renders the token.
# Leave these values empty until the operator has the real domain, URL, scheme,
# signer-anchor references, and current ETags. The command reads its credential
# from TRUST_DOMAIN_OPERATOR_TOKEN_FILE or the runtime environment.
trustDomainBootstrap:
  mode: ""
  apiBaseUrl: ""
  domainId: ""
  operatorTokenExistingSecret: ""
  operatorTokenKey: ""
  eu:
    enabled: ""
    ifMatch: ""
  custom:
    sourceId: ""
    url: ""
    schemeIdentity: ""
    allowedHost: ""
    signerAnchorIds: []
    enabled: ""
    ifMatch: ""

# Self-contained secret-management bootstrap. The persisted software KMS is the
# baseline. Vault and cloud providers are configured separately and are never
# required for the default chart to start.
secretManagement:
  egress:
    allowedHttpsPorts:
      - 443
    # Platform-owned map of reviewed hostname patterns to exact private CIDRs.
    # Both the hostname and resolved IP must match; loopback, link-local, and
    # cloud metadata destinations remain forbidden.
    privateEndpointAllowlist: {}
  bootstrap:
    kek:
      mode: SOFTWARE_KMS
      identity: secret-management-bootstrap-kek
      version: 1
      kmsProviderId: software
      idempotencyMacKey: secret-management-idempotency-mac
  authority:
    platformStorageKmsProviderId: software
    platformStorageKmsBindingKey: platform-secret-storage
    defaultTenantOfferingKmsProviderId: software
    defaultTenantOfferingKmsBindingTemplate: isolated-tenant-secret-storage
    # Customer deployments start without synthetic cloud-provider offerings.
    # Enable only after the corresponding provider integration is configured.
    allowTenantManagedProviders: false
    # The baseline publishes only the per-tenant software-KMS offering.
    allowPlatformOfferings: true
    retentionDays: 30
  internalResolution:
    expectedAudience: enterprise-platform
    # Standard tenant satellites resolve their opaque, tenant-bound service
    # credentials through the platform before calling KMS. Keep this list
    # aligned with the platform AS internal clients below. Optional wallet
    # actors are appended by the chart only when those workloads are enabled.
    allowedServiceActors:
      - tenant-as-service
      - issuer-service
      - kms-service
      - did-service
      - blob-service
      - verifier-service
  # Read-only deployment source for operator-managed Kubernetes Secrets. The
  # manifest maps opaque `sec_*` IDs to keys/files in existingSecret; no tenant
  # API can select this source or supply a path.
  kubernetesMount:
    enabled: false
    existingSecret: ""
    manifest: {}
    # sha256 digest over the canonical manifest mapping, reported by the
    # deployment preparation tooling. Plaintext Secret values are not hashed.
    manifestSha256: ""

# Optional deployment-wide SMTP account. The same configuration belongs to the
# application process in both topologies: platform in distributed mode and the
# monolith process in monolith mode. It intentionally has no development relay
# default. An authenticated account receives its password through the normal
# email account / secret-management lifecycle, never through Helm values.
email:
  enabled: false
  routing:
    defaultAccountId: default
  accounts:
    default:
      transportId: smtp
      fromAddress: ""
      fromName: ""
      replyTo: ""
      smtp:
        host: ""
        port: 587
        username: ""
        useStarttls: true
        useSsl: false
        connectionTimeoutMs: 5000
        readTimeoutMs: 10000
  # Comma-separated exact host:port pairs for reviewed private SMTP relays.
  # Empty preserves the runtime's public-unicast-only default; loopback remains
  # rejected even if listed here.
  allowedPrivateDestinations: ""

# Secret-use authority material is operator supplied and isolated per workload.
# Each referenced Secret contains only the private key needed by that workload,
# the central permit public key, and the opaque coordinate strings consumed by
# the runtime. The platform Secret additionally contains the central permit
# private key and every workload assertion public key. The chart never creates,
# copies, or returns this key material.
secretAuthority:
  existingSecrets:
    platform: ""
    tenant-kms: ""
    tenant-as: ""
    did: ""
    blob: ""
    issuer: ""
    verifier: ""
    wallet-unit: ""
    wallet-interaction: ""
  keys:
    centralPermitSigningKey: central-permit-signing-key
    centralAssertionVerificationKeys: central-assertion-verification-keys
    satelliteAssertionSigningKey: satellite-assertion-signing-key
    satellitePermitVerificationKeys: satellite-permit-verification-keys
    centralPermitPrivateKey: central-permit-signing.pem
    centralPermitPublicKey: central-permit.pub.pem
    satelliteAssertionPrivateKey: assertion.pem
    assertionPublicKeys:
      service-platform: service-platform-assertion.pub.pem
      service-crypto: service-crypto-assertion.pub.pem
      service-data: service-data-assertion.pub.pem
      service-blob: service-blob-assertion.pub.pem
      service-tenant-as: service-tenant-as-assertion.pub.pem
      service-oid4vci: service-oid4vci-assertion.pub.pem
      service-oid4vp: service-oid4vp-assertion.pub.pem
      service-wallet-unit: service-wallet-unit-assertion.pub.pem
      service-wallet-interaction: service-wallet-interaction-assertion.pub.pem
      service-wallet-onboarding: service-wallet-onboarding-assertion.pub.pem

auth:
  enabled: true
  jwt:
    enabled: true
    issuer: ""
    jwksUri: ""
    audience: edk-enterprise

grpc:
  # Platform, tenant KMS, wallet-unit, and wallet-interaction carry the gRPC
  # server transport. External wallet-onboarding (integrations.walletOnboarding)
  # also receives gRPC when deployed outside this chart. Other services use
  # routed command clients.
  enabled: true
  port: 9090
  # service-jwt is application JWT on plaintext gRPC; it is not mTLS.
  authMode: service-jwt
  allowInsecureNone: false
  tls:
    cert: ""
    key: ""
    clientCa: ""

config:
  providers:
    # Applied to every satellite/workload service. The platform remains the
    # configuration authority; satellites fetch tenant/service config from the
    # platform over the routed command transport.
    platformConfigRemote:
      enabled: true
    # Keep the direct tenant-config database source disabled on satellites so the
    # tenant workload DB is not treated as the authoritative config backend.
    tenantConfigDb:
      enabled: false

# Keystore persistence is split per the per-tenant KMS keystore separation: the
# platform holds the platform AS cert/user plus the license-request instance
# cert, and tenant-kms holds the per-tenant software KMS key material. Each is a
# dedicated PVC mounted at /keystore in its own service only. The route-only
# EDK services (issuer/verifier/did/tenant-as) route KMS to tenant-kms and mount
# no keystore at all.
platformKeystore:
  # PVC mounted at /keystore in the platform service only.
  enabled: true
  size: 1Gi
  # Empty uses the cluster default StorageClass.
  storageClass: ""
  # Reference an existing PVC instead of creating one (e.g. a pre-seeded
  # license-request cert volume). When set, no PVC is rendered.
  existingClaim: ""

tenantKmsKeystore:
  # PVC mounted at /keystore in the tenant-kms service only.
  enabled: true
  size: 2Gi
  # Empty uses the cluster default StorageClass.
  storageClass: ""
  # Reference an existing PVC instead of creating one. When set, no PVC is rendered.
  existingClaim: ""

walletInteractionKeystore:
  # PVC mounted at /keystore in the wallet-interaction service only. This holds
  # server-side headless wallet holder/proof key material. Mobile/IDK wallet apps
  # do not use this VDX volume.
  enabled: false
  size: 1Gi
  storageClass: ""
  existingClaim: ""

# Durable filesystem storage owned by the dedicated blob/theme workload. The
# database contains only tenant-scoped metadata; uploaded bytes live here.
blobPersistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  existingClaim: ""

# Control-plane bootstrap for the platform service. The platform provisions its
# `platform` tenant, hosted authorization server, and operator owner on first
# boot. These inputs carry hyphenated keys that an environment variable name
# cannot express, so they are rendered into the platform config overlay
# (templates/configmap.yaml -> application-container.yml) and the steps are
# idempotent across restarts.
platform:
  # The platform authorization server's external base URL, used as its token
  # issuer (`iss`). The satellites trust this value as their platform-issuer when
  # validating east-west platform bearers. It must equal the EXTERNAL_BASE_URL the
  # platform service stamps on the tokens it mints.
  externalBaseUrl: https://platform.example.com
  # Additional browser origins that legitimately call the tenant-routed public
  # APIs served by this installation. Tenant-scoped Business Wallet and account-
  # action pages run on tenant subdomains, so list their exact HTTPS origins.
  # An unrestricted wildcard origin is deliberately not implied.
  corsOrigins: []
  setup:
    licenseRequest:
      # KMS material defaults used when creating the installation-bound license
      # request. These are the current runtime keys; the old
      # PLATFORM_SETUP_* environment variables are not consumed by the service.
      defaultAlias: platform-license-request
      defaultAlgorithm: ECDSA_SHA256
      defaultUse: sig
  onboarding:
    # Stable installation/deployment handle used by onboarding-owned secrets
    # and operator material. Keep it stable across upgrades.
    deploymentId: deployment-1
  sts:
    # Clients whose exchanged tenant tokens carry the dedicated tenant-provisioning role
    # the tenant AS bootstrap trust window requires. null (default) applies the built-in
    # sanction list: the operator CLI plus the secret-bootstrap workload client ids. An
    # explicit "" sanctions nobody; a comma-separated list sanctions exactly those clients.
    # The admin console is deliberately not sanctioned by default.
    provisioningRoleClientIds: null
  bootstrap:
    # true provisions the configured owner automatically during application
    # startup. Set false for setup-API-driven first installation: the setup API
    # imports the protected license before it writes and provisions the owner.
    automatic: false
    # Hosted authorization-server issuer URL for the `platform` tenant. The
    # operator signs in here and the admin console exchanges operator tokens for
    # tenant tokens against it. Set to the platform's external base URL.
    issuer: https://platform.example.com
    owner:
      # Used only when automatic=true. Interactive setup supplies the real
      # operator identity request-scoped and needs no deployment placeholder.
      email: ""
      displayName: Platform Operator
      # Roles granted to the operator owner. platform-admin authorizes the
      # tenant administration APIs (RegisterTenant and friends).
      roles: platform-admin
    # Break-glass operator credential. When set, the operator owner is
    # provisioned with a password so the operator can sign in immediately; the
    # value is supplied through the EDK_OWNER_INITIAL_CREDENTIAL Secret env.
    # Leave empty to provision a credential-less owner that activates login
    # through the invitation flow instead. Guarded to dev deployment mode.
    ownerInitialCredential: ""
    # Operator user store. `local` resolves operators against the platform's own
    # identity store. Federate to an external IdP through the platform-config API.
    userProviderMode: local
    # `dev` unlocks the break-glass operator credential and the dev license-trust
    # file override. Set to `prod` for production installations.
    deploymentMode: dev
    # Permit the platform to serve its hosted authorization server over loopback
    # HTTP. Production keeps the SSRF guard strict; enable only for a local
    # cluster reached over http://localhost.
    allowLocalHttpAs: false
    # Extra hosts that resolve directly to the `platform` tenant, appended to
    # the in-container service name and the platform gateway host. Use it to add
    # a port-forward host (e.g. `,localhost:18080`) for a local cluster reached by
    # `kubectl port-forward`. Leading comma required.
    selfHostsExtra: ""

# Tenant AS bootstrap trust window roles.
tenantAs:
  asAdmin:
    # Role a platform-STS bearer must carry to register the first signing key of a tenant
    # whose authorization server is not fully onboarded yet. Must match the role the
    # platform STS stamps for provisioning-sanctioned clients (tenant-provisioning).
    provisioningRequiredRole: tenant-provisioning
    # Role required on the bearer for post-onboarding signing-key changes. Absent (null)
    # refuses every post-onboarding key change (fail closed); set a role name to enable
    # operator-driven rotation.
    signingKeyRotationRole: null

# Service identity for the platform-issued east-west service tokens. The tenant
# AS authenticates here as a client_credentials client to mint a platform service
# token for its KMS hop during tenant registration. Provide distinct per-client
# secrets through a Secret referenced by `internalClientExistingSecret`.
serviceIdentity:
  # Secret holding per-client confidential-client secrets. Required when any
  # satellite is enabled. The platform AS registers each internal service client
  # with its own key from `clientSecretKeys`; each satellite pod mounts only
  # that role's key as `EDK_INTERNAL_CLIENT_SECRET`. This is a Secret name, not
  # the secret value; `edk-runtime-secrets` is the documented example name.
  # `internalClientSecretKey` is retired: Helm fails if that value is still set.
  internalClientExistingSecret: ""
  clientSecretKeys:
    tenant-kms: kms-service-client-secret
    tenant-as: tenant-as-service-client-secret
    did: did-service-client-secret
    blob: blob-service-client-secret
    issuer: issuer-service-client-secret
    verifier: verifier-service-client-secret
    wallet-unit: wallet-unit-service-client-secret
    wallet-interaction: wallet-interaction-service-client-secret
    wallet-onboarding: wallet-onboarding-service-client-secret
    trust-domain-identifier: trust-domain-service-client-secret
  # Per-service client_credentials client id each satellite presents to the
  # platform AS to mint its east-west service token. These match the platform's
  # registered internal clients.
  clientIds:
    tenant-kms: kms-service
    tenant-as: tenant-as-service
    did: did-service
    blob: blob-service
    issuer: issuer-service
    verifier: verifier-service
    trust-domain-identifier: trust-domain-service
    wallet-unit: wallet-unit-service
    wallet-interaction: wallet-interaction-service
    wallet-onboarding: wallet-onboarding-service
  # Local workload labels used to select credentials and configure the binding
  # to each platform-issued JWT client id. They are never sent as identity headers.
  serviceIds:
    tenant-kms: service-crypto
    tenant-as: service-tenant-as
    did: service-data
    blob: service-blob
    issuer: service-oid4vci
    verifier: service-oid4vp
    wallet-unit: service-wallet-unit
    wallet-interaction: service-wallet-interaction
    wallet-onboarding: service-wallet-onboarding
  # Receiver and STS audiences come from files/service-identity-catalog.yaml
  # (vendored with VDX Helm and the frontend). They are not Helm values and
  # there is no serviceIdentity.audiences override surface.
  # In-network surfaces each satellite admits without an operator bearer. The
  # tenant-AS signing-key provisioning endpoint is deliberately absent here:
  # it must validate the platform-issued bearer during tenant resolution so the
  # target tenant can be taken from the token before the public host is active.
  # The OAuth protocol surfaces (authorize/login/token/discovery) and the
  # in-network command/introspection channels stay open by design (each enforces
  # its own validation). Empty leaves the service's baked default.
  anonymousPathPrefixes:
    platform: "/,/index.html,/index.txt,/setup-license,/admin-console,/_next/**,/platform-config.js,/onboarding/callback,/favicon.ico,/icon.svg,/apple-icon.png,/manifest.json,/api/platform/setup/v1,/api/platform/bootstrap/v1,/api/account-actions/v1,/authorize,/login,/logout,/token,/.well-known,/internal/preauth,/introspect,/public/**,/public/catalogs"
    tenant-as: "/as,/authorize,/login,/logout,/token,/par,/.well-known,/internal/preauth,/introspect,/account-action,/api/account-actions"
    tenant-kms: ""
    did: "/.well-known"
    blob: "/public/assets"
    issuer: "/oid4vci,/credential,/deferredCredential,/nonce,/notification,/.well-known,/public/statuslists,/public/schema,/public/assets,/credentials/offers"
    verifier: "/oid4vp/request-uri,/oid4vp/auth/response,/.well-known"
    wallet-unit: ""
    wallet-interaction: ""
    wallet-onboarding: "/api/wallet-onboarding/v1/idv/email/callback,/wallet/verify"

# Interactive documentation site (docs playground). When enabled, registers a
# public OAuth client on the platform AS (authorization code + required PKCE +
# required PAR) and sets docs.playground.* so tenant AS bootstrap can provision
# the same client. Origins are both CORS candidates (merge into cors.origins)
# and OAuth redirect bases ({origin}/docs-env/callback).
docsPlayground:
  enabled: false
  clientId: docs-playground
  origins:
    - https://docs.sphereon.com
    - http://127.0.0.1:3000
    - http://localhost:3000

# Dedicated confidential client and cryptographic state protection for the
# public issuer/verifier testing-console BFF. The client secret is independent
# from satellite serviceIdentity.clientSecretKeys and is consumed only by the
# platform authorization server and the admin-console server process
# (ADMIN_CONSOLE_WORKLOAD_CLIENT_*). Do not point the console at
# EDK_INTERNAL_CLIENT_SECRET.
portalBff:
  clientId: admin-console-portal-bff
  audience: application-bff-oauth-client
  scope: bff.oauth
  existingSecret: ""
  clientSecretKey: admin-console-portal-bff-secret
  kms:
    providerId: platform
    encryptionKeyAlias: application-bff-oauth-client-aead
    handleHmacKeyAlias: application-bff-oauth-client-owner-hmac
  trustedIngress:
    # Gateway API implementations populate X-Forwarded-Host/Proto. Exactly one
    # trusted gateway hop is selected; extra browser-supplied values are ignored.
    mode: X_FORWARDED
    hops: 1

# Keystore password for the software KMS providers. Provide it through a Secret;
# the platform and tenant-kms read it as EDK_KEYSTORE_PASSWORD.
keystore:
  # Secret holding the keystore password (key `keystore-password` by default).
  # Required when platform or tenant-kms is enabled. This may reference the same
  # Kubernetes Secret as serviceIdentity, but must use an independently generated
  # value under its own key.
  existingSecret: ""
  passwordKey: keystore-password

# Issuer pipeline session payloads are encrypted before they are written to the
# tenant database. Supply two independently generated 32-byte base64url keys in
# an existing Secret; the chart never generates or stores these values itself.
issuerPipeline:
  existingSecret: ""
  masterKekKey: master-kek
  blindIndexKey: blind-index-key

# Deployment-scoped encryption for pending federation/session records. The
# chart references an existing Secret and never generates or stores key
# material itself.
federationSessionEncryption:
  existingSecret: ""
  key: federation-session-encryption-key
  activeKeyId: federation-session-v1

license:
  # Optional explicit installation pin for the license gate. Leave empty during
  # first-run setup; the protected license bundle supplies the installation id.
  # If set, it must match the installed license claims or the non-platform
  # services fail closed. The platform itself is the local licensing authority
  # and is exempt via deployment-role=platform (set in the deployment template,
  # not here).
  installationId: ""
  commandEnforcement:
    enabled: true
    missingDescriptorMode: warn
  # Per-service gate role advertised by each service. The platform key is
  # present for completeness but unused (the platform is exempt).
  serviceRoles:
    platform: enterprise-platform
    tenant-kms: enterprise-tenant-kms
    did: enterprise-did
    blob: service-data
    tenant-as: enterprise-tenant-as
    issuer: enterprise-issuer
    verifier: enterprise-verifier
    wallet-unit: enterprise-wallet-unit
    wallet-interaction: enterprise-wallet-interaction
    wallet-onboarding: enterprise-wallet-onboarding
  # License trust anchor and bundle delivery. The platform is the local
  # licensing authority; it trusts the installed license bundle's root CA. The
  # bundle itself is imported through the setup API after the platform boots.
  trust:
    # Mount a license root-CA PEM from a Secret into the platform (and the
    # satellites) so the platform trusts an evaluation license that
    # chains to it. The Secret's `rootCaKey` entry is mounted at `rootCaPath`.
    # Leave existingSecret empty to rely on the embedded production roots only.
    existingSecret: ""
    rootCaKey: license-root-ca.pem
    rootCaPath: /license-state/license-root-ca.pem
    # Trust the embedded production roots. With a dev QA license that chains to a
    # file-mounted root, set embeddedEnabled false and provide existingSecret.
    embeddedEnabled: true
    # Recipient key the platform decrypts the license envelope with. It must match
    # the kid the license is minted against; the bundle import installs the
    # matching private key into the KMS provider under recipientKmsAlias.
    recipientKeyId: license-recipient
    recipientKmsAlias: license-recipient

kmsLifecycle:
  enabled: true
  interval: PT1H
  runOnStartup: true

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The platform receives its own identity because only the control plane may
  # unlock the Tier-0 KMS and provision tenant-scoped capabilities.
  platform:
    create: true
    name: ""
    annotations: {}

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  allowDnsEgress: true
  # Provider traffic originates only from the platform control plane. This
  # network-layer rule is required by the Tier-0 KMS. Select in-cluster provider
  # pods and/or explicit CIDRs where the deployment has stable ranges. With no
  # peers it permits only the listed ports to any destination and remains paired
  # with the runtime HTTPS, DNS-rebinding, and resolved-IP policy.
  secretProviderEgress:
    enabled: true
    namespaceSelector: {}
    podSelector: {}
    ipBlocks: []
    ports:
      - 443
  ingressController:
    enabled: true
    namespaceSelector: {}
    podSelector: {}
  metricsScraper:
    enabled: false
    namespaceSelector: {}
    podSelector: {}

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics

opentelemetry:
  enabled: false
  endpoint: ""
  protocol: http/protobuf
  metricsExporter: otlp
  metricsExportIntervalMillis: 60000
  headers: ""
  resourceAttributes: ""

ingress:
  legacy:
    # Legacy per-service Ingress is off by default. Customer deployments use the
    # single-port Gateway below so the public contract is only
    # platform.<baseDomain> and <tenant>.<baseDomain>.
    enabled: false
  public:
    annotations: {}
  internal:
    annotations: {}

gateway:
  # Single-port multi-tenant Gateway API front door. One wildcard HTTPS listener
  # terminates TLS for both the operator host and tenant hosts; HTTPRoutes fan
  # out by host and path to each service per the routing contract.
  # Envoy Gateway-specific host snapshot/restore is opt-in because other
  # Gateway implementations already preserve the request authority upstream.
  envoyGateway:
    preserveOriginalHost: false
  enabled: true
  className: cilium
  # Optional implementation-specific per-Gateway parameters reference.
  # Leave name empty unless the selected GatewayClass documents this kind.
  infrastructureParametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: ""
  # Operator host = {operatorHost}.{baseDomain} (the platform plane).
  operatorHost: platform
  # Optional controller-specific annotations attached only to HTTPRoutes on the
  # exact platform listener. Use these to reference an IP-allowlist/WAF policy
  # without applying it to the public tenant wildcard listener.
  platformAccess:
    routeAnnotations: {}
  # Gateway API implementations may otherwise impose a short implementation-
  # specific default (Envoy Gateway defaults to 15 seconds). Tenant registration
  # performs fenced provisioning before returning and must be allowed to finish.
  requestTimeout: "60s"
  backendRequestTimeout: "60s"
  # Defaults to global.platformBaseDomain when empty.
  baseDomain: ""
  tls:
    # secret: reference an existing wildcard TLS Secret.
    # certManager: rely on a cert-manager ClusterIssuer (DNS-01) for the wildcard.
    # external: TLS terminates OUTSIDE the cluster (corporate load balancer or
    #   edge proxy owning the *.{base} wildcard); the Gateway serves plain HTTP
    #   on port 80 and no in-cluster certificate is needed. The external front
    #   must preserve the Host header and set X-Forwarded-Proto=https, and the
    #   data plane in front of the backends must trust that hop (see
    #   examples/gateway-external-tls-values.yaml).
    mode: secret
    secretName: edk-wildcard-tls
    clusterIssuer: ""
  # Add a :80 HTTP listener and a redirect HTTPRoute that 301s to https.
  # Ignored with tls.mode=external: the external front owns the redirect and
  # port 80 is the serving listener.
  httpRedirect: true

# Backing workload configuration. These entries create Kubernetes Deployments
# and Services; they do not define customer-facing hosts. Customer traffic enters
# through the single-port Gateway (`platform.<baseDomain>` and
# `<tenant>.<baseDomain>`). Runtime probes stay internal to Kubernetes. Any
# service may set `imageTag` to override `global.imageTag`; when omitted, the
# global tag remains authoritative.
services:
  platform:
    enabled: true
    image: enterprise-platform
    replicas: 1
    restPort: 8080
    publicIngress:
      enabled: true
      className: public
      host: platform.example.com
      paths:
        - /.well-known/oauth-authorization-server
        - /.well-known/openid-configuration
        - /authorize
        - /login
        - /token
        - /userinfo
        - /oauth2
        - /api/platform/setup/v1
        - /api/platform/bootstrap/v1
        - /api/platform/admin/v1
        - /api/catalog/v1
        - /public/catalogs
      annotations: {}
    internalIngress:
      enabled: true
      className: internal
      host: platform.internal.example.com
      paths:
        - /api/platform/setup/v1
        - /api/platform/bootstrap/v1
        - /api/platform/admin/v1
      annotations: {}
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    env:
      # EXTERNAL_BASE_URL and ONBOARDING_UI_BASE_URL are chart-owned: both
      # render from platform.externalBaseUrl and entries with those names in
      # this list are ignored.
      - name: LICENSE_RECIPIENT_KMS_ENABLED
        value: "true"
      - name: LICENSE_RECIPIENT_KMS_ALIAS
        value: license-recipient

  tenant-kms:
    enabled: true
    image: enterprise-tenant-kms
    replicas: 1
    restPort: 8080
    publicIngress:
      enabled: false
    internalIngress:
      enabled: false
      className: internal
      host: kms.internal.example.com
      # Tenant-KMS command traffic is east-west gRPC only. Do not publish an
      # internal REST ingress for the removed generic provider/key API.
      paths: []
      annotations: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    env: []

  did:
    enabled: true
    image: enterprise-did
    replicas: 1
    restPort: 8080
    publicIngress:
      enabled: false
      className: ""
      host: ""
      paths:
        - /1.0/identifiers
        - /.well-known/did.json
        - /api/did/v1
      annotations: {}
    internalIngress:
      enabled: false
      className: internal
      host: ""
      paths:
        - /api/did/v1
        - /universal-registrar/1.0/create
        - /universal-registrar/1.0/update
        - /universal-registrar/1.0/deactivate
      annotations: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    env: []

  # Dedicated tenant blob, asset-library, and theme-data workload. This keeps
  # tenant branding bytes out of the platform and protocol containers.
  blob:
    enabled: true
    image: service-data
    replicas: 1
    restPort: 8080
    publicIngress:
      enabled: false
      className: ""
      host: ""
      paths:
        - /api/theme/v1
        - /api/assets/v1
        - /public/assets
      annotations: {}
    internalIngress:
      enabled: false
      className: internal
      host: ""
      paths:
        - /api/theme/v1
        - /api/assets/v1
      annotations: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    env: []

  tenant-as:
    enabled: true
    image: enterprise-tenant-as
    replicas: 1
    restPort: 8080
    publicIngress:
      enabled: false
      className: ""
      host: ""
      paths:
        - /.well-known/oauth-authorization-server
        - /.well-known/openid-configuration
        - /.well-known/jwks.json
        - /authorize
        - /token
        - /userinfo
        - /oauth2
        - /login
        - /logout
        - /api/trust-domain/v1
      annotations: {}
    internalIngress:
      enabled: false
      className: internal
      host: ""
      paths:
        - /authorize
        - /token
        - /userinfo
        - /oauth2
        - /login
        - /logout
      annotations: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    env: []

  wallet-unit:
    enabled: false
    image: enterprise-wallet-unit
    replicas: 1
    restPort: 8080
    publicIngress:
      enabled: false
      className: ""
      host: ""
      paths: []
      annotations: {}
    internalIngress:
      enabled: false
      className: internal
      host: ""
      paths: []
      annotations: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    env: []

  wallet-interaction:
    enabled: false
    image: enterprise-wallet-interaction
    replicas: 1
    restPort: 8080
    publicIngress:
      enabled: false
      className: ""
      host: ""
      paths: []
      annotations: {}
    internalIngress:
      enabled: false
      className: internal
      host: ""
      paths: []
      annotations: {}
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    env:
      - name: WALLET_INTERACTION_KEYSTORE_ROOT
        value: /keystore

  issuer:
    enabled: true
    image: enterprise-issuer
    replicas: 1
    restPort: 8080
    publicIngress:
      enabled: false
      className: ""
      host: ""
      paths:
        - /.well-known/openid-credential-issuer
        - /oid4vci
        - /credential
        - /credential_deferred
        - /nonce
        - /notification
        - /public/statuslists
        - /public/schema
        - /public/catalogs
        - /api/oid4vci/v1
        - /api/credential-design/v1
        - /api/statuslist/v1
      annotations: {}
    internalIngress:
      enabled: false
      className: internal
      host: ""
      paths:
        - /api/oid4vci/v1
        - /api/credential-design/v1
        - /api/statuslist/v1
      annotations: {}
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    env: []

  verifier:
    enabled: true
    image: enterprise-verifier
    replicas: 1
    restPort: 8080
    publicIngress:
      enabled: false
      className: ""
      host: ""
      paths:
        - /oid4vp
        - /request_uri
        - /direct_post
        - /api/oid4vp/v1
        - /api/dcql/v1
      annotations: {}
    internalIngress:
      enabled: false
      className: internal
      host: ""
      paths:
        - /api/oid4vp/v1
        - /api/dcql/v1
      annotations: {}
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    env: []

  # Operator admin console plus instance-host testing console (Next.js
  # standalone, served under /admin-console). The application host guard grants
  # the complete UI/API only to platform.externalBaseUrl; instance hosts receive
  # /testing-console/{kind}/{instanceId} through a page-only gateway rewrite,
  # plus direct protocol-BFF, portal-OAuth, static asset, and health support
  # paths. The backend endpoint registry still enforces disabled/public/protected
  # instance modes; routing alone does not enable an instance.
  # NEVER strip /admin-console: Next emits absolute basePath asset URLs.
  admin-console:
    enabled: true
    image: admin-console
    replicas: 1
    restPort: 3000
    publicIngress:
      enabled: true
      className: public
      # Operator/platform host (= gateway.operatorHost.baseDomain). Matches the
      # platform service public host so the console is served at
      # platform.<baseDomain>/admin-console alongside the platform AS endpoints.
      host: platform.example.com
      paths:
        - /admin-console
      annotations: {}
    internalIngress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
      - name: NEXT_PUBLIC_BASE_PATH
        value: /admin-console
      - name: PORT
        value: "3000"

  # Tenant administration uses the same immutable image and basePath through a
  # separate runtime. It receives no platform portal-BFF credential.
  admin-console-tenant:
    enabled: true
    image: admin-console
    replicas: 1
    restPort: 3000
    publicIngress:
      enabled: false
      className: public
      host: "*.example.com"
      paths:
        - /admin-console
      annotations: {}
    internalIngress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
      - name: NEXT_PUBLIC_BASE_PATH
        value: /admin-console
      - name: PORT
        value: "3000"

  # One tenant-host runtime serves every configured business wallet. Tenant and
  # wallet selection remain request-scoped through the platform bootstrap API.
  business-wallet:
    enabled: true
    image: business-wallet
    replicas: 1
    restPort: 3006
    publicIngress:
      enabled: false
      className: public
      host: "*.example.com"
      paths:
        - /wallets
        - /_next
      annotations: {}
    internalIngress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
      - name: PORT
        value: "3006"
