{{- include "edk-enterprise.validateImageRegistry" . -}}
{{- include "edk-enterprise.validateImageReference" . -}}
{{- include "edk-enterprise.validateServiceIdentityCatalog" . -}}
{{- include "edk-enterprise.validateTopology" . -}}
{{- include "edk-enterprise.validateEmail" . -}}
{{- include "edk-enterprise.validateGatewayTls" . -}}
{{- include "edk-enterprise.validateGrpcAuthMode" . -}}
{{- include "edk-enterprise.validateRuntimeSecrets" . -}}
{{- include "edk-enterprise.validateTenantKmsDependency" . -}}
{{- include "edk-enterprise.validateRuntimeDependencies" . -}}
{{- if eq (include "edk-enterprise.topologyMode" .) "distributed" -}}
{{- $expectedSecretActors := list (index .Values.serviceIdentity.clientIds "tenant-as") (index .Values.serviceIdentity.clientIds "issuer") (index .Values.serviceIdentity.clientIds "tenant-kms") (index .Values.serviceIdentity.clientIds "did") (index .Values.serviceIdentity.clientIds "blob") (index .Values.serviceIdentity.clientIds "verifier") | sortAlpha -}}
{{- if (index .Values.services "wallet-unit").enabled }}{{- $expectedSecretActors = append $expectedSecretActors (index .Values.serviceIdentity.clientIds "wallet-unit") -}}{{- end -}}
{{- if (index .Values.services "wallet-interaction").enabled }}{{- $expectedSecretActors = append $expectedSecretActors (index .Values.serviceIdentity.clientIds "wallet-interaction") -}}{{- end -}}
{{- if eq (include "edk-enterprise.walletOnboardingServiceEnabled" .) "true" }}{{- $expectedSecretActors = append $expectedSecretActors (index .Values.serviceIdentity.clientIds "wallet-onboarding") -}}{{- end -}}
{{- $expectedSecretActors = $expectedSecretActors | sortAlpha -}}
{{- $configuredSecretActors := .Values.secretManagement.internalResolution.allowedServiceActors | sortAlpha -}}
{{- if ne (join "," $configuredSecretActors) (join "," $expectedSecretActors) -}}
{{- fail "secretManagement.internalResolution.allowedServiceActors must exactly match the standard signed opaque-secret workload clients" -}}
{{- end -}}
{{- end -}}
{{- $kek := .Values.secretManagement.bootstrap.kek -}}
{{- if ne $kek.mode "SOFTWARE_KMS" -}}
{{- fail "the baseline chart supports secretManagement.bootstrap.kek.mode=SOFTWARE_KMS; external KMS integrations must be configured explicitly" -}}
{{- end -}}
{{- if ne $kek.kmsProviderId "software" -}}
{{- fail "the baseline chart requires secretManagement.bootstrap.kek.kmsProviderId=software" -}}
{{- end -}}
{{- if eq $kek.idempotencyMacKey $kek.identity -}}
{{- fail "secretManagement.bootstrap.kek.idempotencyMacKey must be distinct from the bootstrap encryption key identity" -}}
{{- end -}}
{{- with .Values.secretManagement.authority.platformProviders -}}
{{- if ne (include "edk-enterprise.topologyMode" $) "distributed" -}}
{{- fail "secretManagement.authority.platformProviders requires the distributed topology" -}}
{{- end -}}
{{- if not $.Values.secretManagement.authority.allowTenantManagedProviders -}}
{{- fail "secretManagement.authority.platformProviders requires secretManagement.authority.allowTenantManagedProviders=true, which publishes the Azure and AWS offerings" -}}
{{- end -}}
{{- if not $.Values.secretManagement.kubernetesMount.enabled -}}
{{- fail "secretManagement.authority.platformProviders requires secretManagement.kubernetesMount.enabled=true to supply the provider credential" -}}
{{- end -}}
{{- range $providerId, $provider := . -}}
{{- if not (hasKey $.Values.secretManagement.kubernetesMount.manifest $provider.credentialSecretId) -}}
{{- fail (printf "secretManagement.authority.platformProviders.%s.credentialSecretId must be listed in secretManagement.kubernetesMount.manifest" $providerId) -}}
{{- end -}}
{{- end -}}
{{- end -}}
