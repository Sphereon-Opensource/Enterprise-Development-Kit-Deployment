{{- /*
Per-tenant KMS keystore separation: two dedicated PVCs, one for the platform
keystore (platform AS cert/user + license-request instance cert) and one for the
tenant-kms keystore (per-tenant software KMS key material). Each is mounted at
/keystore in its own service only. A PVC is rendered only when its persistence
block is enabled and no existingClaim is supplied.
*/ -}}
{{- if and .Values.platformKeystore.enabled (not .Values.platformKeystore.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-platform-keystore
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.platformKeystore.storageClass }}
  storageClassName: {{ .Values.platformKeystore.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.platformKeystore.size | quote }}
{{- end }}
{{- if and .Values.tenantKmsKeystore.enabled (not .Values.tenantKmsKeystore.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-tenant-kms-keystore
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-kms
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.tenantKmsKeystore.storageClass }}
  storageClassName: {{ .Values.tenantKmsKeystore.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.tenantKmsKeystore.size | quote }}
{{- end }}
