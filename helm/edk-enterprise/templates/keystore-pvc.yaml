{{- /*
Keystore separation: dedicated PVCs for the platform keystore (platform AS
cert/user + license-request instance cert), tenant-kms keystore (per-tenant
software KMS key material), and wallet-interaction holder/proof key material.
Each is mounted at /keystore in its own service only. A PVC is rendered only
when its persistence block is enabled and no existingClaim is supplied.
*/ -}}
{{- if and .Values.services.blob.enabled .Values.blobPersistence.enabled (not .Values.blobPersistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-blob-store
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: blob
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.blobPersistence.storageClass }}
  storageClassName: {{ .Values.blobPersistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.blobPersistence.size | quote }}
{{- end }}
{{- if and .Values.platformKeystore.enabled (not .Values.platformKeystore.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-platform-keystore
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.platformKeystore.storageClass }}
  storageClassName: {{ .Values.platformKeystore.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.platformKeystore.size | quote }}
{{- end }}
{{- if and .Values.tenantKmsKeystore.enabled (not .Values.tenantKmsKeystore.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-tenant-kms-keystore
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-kms
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.tenantKmsKeystore.storageClass }}
  storageClassName: {{ .Values.tenantKmsKeystore.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.tenantKmsKeystore.size | quote }}
{{- end }}
{{- if and .Values.walletInteractionKeystore.enabled (not .Values.walletInteractionKeystore.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-wallet-interaction-keystore
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: wallet-interaction
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.walletInteractionKeystore.storageClass }}
  storageClassName: {{ .Values.walletInteractionKeystore.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.walletInteractionKeystore.size | quote }}
{{- end }}
