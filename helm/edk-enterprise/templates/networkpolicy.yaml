{{- if and .Values.networkPolicy.enabled (eq (include "edk-enterprise.topologyMode" .) "distributed") }}
{{- if eq ($.Values.database.platform.networkPolicy.ipBlock.cidr | default "") "0.0.0.0/0" }}
{{- fail "database.platform.networkPolicy.ipBlock must not be 0.0.0.0/0" }}
{{- end }}
{{- if eq ($.Values.database.tenant.networkPolicy.ipBlock.cidr | default "") "0.0.0.0/0" }}
{{- fail "database.tenant.networkPolicy.ipBlock must not be 0.0.0.0/0" }}
{{- end }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $row := include "edk-enterprise.serviceIdentity.role" (dict "root" $ "role" $name) | fromYaml }}
{{- $grpcReceiver := eq (include "edk-enterprise.serviceIdentity.grpcReceiver" (dict "root" $ "role" $name)) "true" }}
{{- $isAdminConsole := or (eq $name "admin-console") (eq $name "admin-console-tenant") }}
{{- $tenantGatewayPaths := include "edk-enterprise.gateway.tenantPaths" (dict "name" $name) | trim }}
{{- $gatewayRouted := and $.Values.gateway.enabled (or (eq $name "platform") (eq $name "admin-console") (eq $name "admin-console-tenant") (ne $tenantGatewayPaths "")) }}
{{- $peersIn := $row.peersIn | default list }}
{{- $peersOut := $row.peersOut | default list }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "edk-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  podSelector:
    matchLabels:
      {{- include "edk-enterprise.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if and $.Values.networkPolicy.ingressController.enabled (or $svc.publicIngress.enabled $svc.internalIngress.enabled $gatewayRouted) }}
    - from:
        - namespaceSelector:
            {{- toYaml ($.Values.networkPolicy.ingressController.namespaceSelector | default dict) | nindent 12 }}
          podSelector:
            {{- toYaml ($.Values.networkPolicy.ingressController.podSelector | default dict) | nindent 12 }}
      ports:
        - protocol: TCP
          port: rest
    {{- end }}
    {{- if $peersIn }}
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  {{- range $peer := $peersIn }}
                  - {{ $peer }}
                  {{- end }}
      ports:
        - protocol: TCP
          port: rest
        {{- if and $.Values.grpc.enabled $grpcReceiver }}
        - protocol: TCP
          port: grpc
        {{- end }}
    {{- end }}
    {{- if $.Values.networkPolicy.metricsScraper.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml ($.Values.networkPolicy.metricsScraper.namespaceSelector | default dict) | nindent 12 }}
          podSelector:
            {{- toYaml ($.Values.networkPolicy.metricsScraper.podSelector | default dict) | nindent 12 }}
      ports:
        - protocol: TCP
          port: rest
    {{- end }}
  egress:
    {{- if $.Values.networkPolicy.allowDnsEgress }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with $.Values.networkPolicy.secretProviderEgress }}
    {{- if and (eq $name "platform") .enabled }}
    - {{- if or .namespaceSelector .podSelector .ipBlocks }}
      to:
        {{- if or .namespaceSelector .podSelector }}
        - {{- with .namespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- range .ipBlocks }}
        - ipBlock:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- if and $.Values.database.enabled (not $isAdminConsole) }}
    {{- /* The platform is the sole schema owner and reaches both databases.
           Runtime services reach only the tenant database and validate schemas. */}}
    {{- if eq $name "platform" }}
    - to:
        - {{- if $.Values.database.platform.networkPolicy.ipBlock }}
          ipBlock:
            {{- toYaml $.Values.database.platform.networkPolicy.ipBlock | nindent 12 }}
          {{- else if or $.Values.database.platform.networkPolicy.podSelector $.Values.database.platform.networkPolicy.namespaceSelector }}
          {{- if $.Values.database.platform.networkPolicy.namespaceSelector }}
          namespaceSelector:
            {{- toYaml $.Values.database.platform.networkPolicy.namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if $.Values.database.platform.networkPolicy.podSelector }}
          podSelector:
            {{- toYaml $.Values.database.platform.networkPolicy.podSelector | nindent 12 }}
          {{- end }}
          {{- else }}
          {{- fail "database.platform.networkPolicy must identify the platform database with a pod/namespace selector or explicit private ipBlock; broad CIDR fallback is forbidden" }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.database.platform.port }}
    - to:
        - {{- if $.Values.database.tenant.networkPolicy.ipBlock }}
          ipBlock:
            {{- toYaml $.Values.database.tenant.networkPolicy.ipBlock | nindent 12 }}
          {{- else if or $.Values.database.tenant.networkPolicy.podSelector $.Values.database.tenant.networkPolicy.namespaceSelector }}
          {{- if $.Values.database.tenant.networkPolicy.namespaceSelector }}
          namespaceSelector:
            {{- toYaml $.Values.database.tenant.networkPolicy.namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if $.Values.database.tenant.networkPolicy.podSelector }}
          podSelector:
            {{- toYaml $.Values.database.tenant.networkPolicy.podSelector | nindent 12 }}
          {{- end }}
          {{- else }}
          {{- fail "database.tenant.networkPolicy must identify the tenant database with a pod/namespace selector or explicit private ipBlock; broad CIDR fallback is forbidden" }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.database.tenant.port }}
    {{- else }}
    - to:
        - {{- if $.Values.database.tenant.networkPolicy.ipBlock }}
          ipBlock:
            {{- toYaml $.Values.database.tenant.networkPolicy.ipBlock | nindent 12 }}
          {{- else if or $.Values.database.tenant.networkPolicy.podSelector $.Values.database.tenant.networkPolicy.namespaceSelector }}
          {{- if $.Values.database.tenant.networkPolicy.namespaceSelector }}
          namespaceSelector:
            {{- toYaml $.Values.database.tenant.networkPolicy.namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if $.Values.database.tenant.networkPolicy.podSelector }}
          podSelector:
            {{- toYaml $.Values.database.tenant.networkPolicy.podSelector | nindent 12 }}
          {{- end }}
          {{- else }}
          {{- fail "database.tenant.networkPolicy must identify the tenant database with a pod/namespace selector or explicit private ipBlock; broad CIDR fallback is forbidden" }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.database.tenant.port }}
    {{- end }}
    {{- end }}
    {{- range $peer := $peersOut }}
    {{- $peerSvc := index $.Values.services $peer }}
    {{- $peerGrpcReceiver := eq (include "edk-enterprise.serviceIdentity.grpcReceiver" (dict "root" $ "role" $peer)) "true" }}
    {{- if $peerSvc.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "edk-enterprise.selectorLabels" (dict "root" $ "name" $peer) | nindent 14 }}
      ports:
        - protocol: TCP
          port: rest
        {{- if and $.Values.grpc.enabled $peerGrpcReceiver }}
        - protocol: TCP
          port: grpc
        {{- end }}
    {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
