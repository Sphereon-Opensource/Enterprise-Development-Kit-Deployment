{{- if .Values.networkPolicy.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $grpcReceiver := or (eq $name "platform") (eq $name "tenant-kms") (eq $name "wallet-unit") (eq $name "wallet-interaction") }}
{{- $isAdminConsole := or (eq $name "admin-console") (eq $name "admin-console-tenant") }}
{{- $tenantGatewayPaths := include "edk-enterprise.gateway.tenantPaths" (dict "name" $name) | trim }}
{{- $gatewayRouted := and $.Values.gateway.enabled (or (eq $name "platform") (eq $name "admin-console") (eq $name "admin-console-tenant") (ne $tenantGatewayPaths "")) }}
{{- $peersIn := list }}
{{- if eq $name "tenant-kms" }}{{- $peersIn = list "platform" "tenant-as" "did" "issuer" "verifier" "wallet-interaction" }}{{- end }}
{{- if eq $name "platform" }}{{- $peersIn = list "tenant-kms" "tenant-as" "did" "issuer" "verifier" "wallet-unit" "wallet-interaction" "admin-console" "admin-console-tenant" }}{{- end }}
{{- if eq $name "tenant-as" }}{{- $peersIn = list "platform" "tenant-kms" "did" "issuer" "verifier" "admin-console-tenant" }}{{- end }}
{{- if eq $name "did" }}{{- $peersIn = list "platform" "verifier" "admin-console" "admin-console-tenant" }}{{- end }}
{{- if eq $name "issuer" }}{{- $peersIn = list "platform" "admin-console" "admin-console-tenant" }}{{- end }}
{{- if eq $name "verifier" }}{{- $peersIn = list "platform" "admin-console" "admin-console-tenant" }}{{- end }}
{{- if eq $name "wallet-unit" }}{{- $peersIn = list "wallet-interaction" }}{{- end }}
{{- if eq $name "wallet-interaction" }}{{- $peersIn = list "issuer" "verifier" }}{{- end }}
{{- $peersOut := list }}
{{- if eq $name "platform" }}{{- $peersOut = list "tenant-as" "tenant-kms" "did" "issuer" "verifier" }}{{- end }}
{{- if eq $name "tenant-kms" }}{{- $peersOut = list "tenant-as" "platform" }}{{- end }}
{{- if eq $name "did" }}{{- $peersOut = list "tenant-kms" "tenant-as" "platform" }}{{- end }}
{{- if eq $name "tenant-as" }}{{- $peersOut = list "platform" "tenant-kms" }}{{- end }}
{{- if eq $name "wallet-unit" }}{{- $peersOut = list "platform" }}{{- end }}
{{- if eq $name "wallet-interaction" }}{{- $peersOut = list "wallet-unit" "tenant-kms" "platform" }}{{- end }}
{{- if eq $name "issuer" }}{{- $peersOut = list "tenant-kms" "tenant-as" "platform" "wallet-interaction" }}{{- end }}
{{- if eq $name "verifier" }}{{- $peersOut = list "tenant-kms" "tenant-as" "did" "platform" "wallet-interaction" }}{{- end }}
{{- if eq $name "admin-console" }}{{- $peersOut = list "platform" "did" "issuer" "verifier" }}{{- end }}
{{- if eq $name "admin-console-tenant" }}{{- $peersOut = list "platform" "tenant-as" "did" "issuer" "verifier" }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "edk-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  podSelector:
    matchLabels:
      {{- include "edk-enterprise.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if and $.Values.networkPolicy.ingressController.enabled (or $svc.publicIngress.enabled $svc.internalIngress.enabled $gatewayRouted) }}
    - from:
        - namespaceSelector:
            {{- toYaml ($.Values.networkPolicy.ingressController.namespaceSelector | default dict) | nindent 12 }}
          podSelector:
            {{- toYaml ($.Values.networkPolicy.ingressController.podSelector | default dict) | nindent 12 }}
      ports:
        - protocol: TCP
          port: rest
    {{- end }}
    {{- if $peersIn }}
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  {{- range $peer := $peersIn }}
                  - {{ $peer }}
                  {{- end }}
      ports:
        - protocol: TCP
          port: rest
        {{- if and $.Values.grpc.enabled $grpcReceiver }}
        - protocol: TCP
          port: grpc
        {{- end }}
    {{- end }}
    {{- if $.Values.networkPolicy.metricsScraper.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml ($.Values.networkPolicy.metricsScraper.namespaceSelector | default dict) | nindent 12 }}
          podSelector:
            {{- toYaml ($.Values.networkPolicy.metricsScraper.podSelector | default dict) | nindent 12 }}
      ports:
        - protocol: TCP
          port: rest
    {{- end }}
  egress:
    {{- if $.Values.networkPolicy.allowDnsEgress }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with $.Values.networkPolicy.secretProviderEgress }}
    {{- if and (eq $name "platform") .enabled }}
    - {{- if or .namespaceSelector .podSelector .ipBlocks }}
      to:
        {{- if or .namespaceSelector .podSelector }}
        - {{- with .namespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- range .ipBlocks }}
        - ipBlock:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- if and $.Values.database.enabled (not $isAdminConsole) }}
    {{- /* Database egress reflects the platform/tenant split. The platform service
           reaches ONLY the control-plane (platform) database; every runtime
           service reaches ONLY the tenant workload database. */}}
    {{- if eq $name "platform" }}
    - to:
        - {{- if $.Values.database.platform.networkPolicy.ipBlock }}
          ipBlock:
            {{- toYaml $.Values.database.platform.networkPolicy.ipBlock | nindent 12 }}
          {{- else if or $.Values.database.platform.networkPolicy.podSelector $.Values.database.platform.networkPolicy.namespaceSelector }}
          {{- if $.Values.database.platform.networkPolicy.namespaceSelector }}
          namespaceSelector:
            {{- toYaml $.Values.database.platform.networkPolicy.namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if $.Values.database.platform.networkPolicy.podSelector }}
          podSelector:
            {{- toYaml $.Values.database.platform.networkPolicy.podSelector | nindent 12 }}
          {{- end }}
          {{- else }}
          ipBlock:
            cidr: 0.0.0.0/0
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.database.platform.port }}
    {{- else }}
    - to:
        - {{- if $.Values.database.tenant.networkPolicy.ipBlock }}
          ipBlock:
            {{- toYaml $.Values.database.tenant.networkPolicy.ipBlock | nindent 12 }}
          {{- else if or $.Values.database.tenant.networkPolicy.podSelector $.Values.database.tenant.networkPolicy.namespaceSelector }}
          {{- if $.Values.database.tenant.networkPolicy.namespaceSelector }}
          namespaceSelector:
            {{- toYaml $.Values.database.tenant.networkPolicy.namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if $.Values.database.tenant.networkPolicy.podSelector }}
          podSelector:
            {{- toYaml $.Values.database.tenant.networkPolicy.podSelector | nindent 12 }}
          {{- end }}
          {{- else }}
          ipBlock:
            cidr: 0.0.0.0/0
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.database.tenant.port }}
    {{- end }}
    {{- end }}
    {{- range $peer := $peersOut }}
    {{- $peerSvc := index $.Values.services $peer }}
    {{- $peerGrpcReceiver := or (eq $peer "platform") (eq $peer "tenant-kms") (eq $peer "wallet-unit") (eq $peer "wallet-interaction") }}
    {{- if $peerSvc.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "edk-enterprise.selectorLabels" (dict "root" $ "name" $peer) | nindent 14 }}
      ports:
        - protocol: TCP
          port: rest
        {{- if and $.Values.grpc.enabled $peerGrpcReceiver }}
        - protocol: TCP
          port: grpc
        {{- end }}
    {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
