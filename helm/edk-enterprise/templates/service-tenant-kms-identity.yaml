{{- if and (eq (include "edk-enterprise.topologyMode" .) "distributed") (index .Values.services "tenant-kms").enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edk-enterprise.identityServiceName" (dict "root" . "name" "tenant-kms") }}
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-kms-identity
  annotations:
    edk.sphereon.com/readiness-path: /health/identity
spec:
  type: ClusterIP
  publishNotReadyAddresses: false
  selector:
    {{- include "edk-enterprise.selectorLabels" (dict "root" . "name" "tenant-kms") | nindent 4 }}
    edk.sphereon.com/tenant-kms-identity: "true"
  ports:
    - name: grpc
      port: {{ .Values.grpc.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
