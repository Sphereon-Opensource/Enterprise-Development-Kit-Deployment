{{- if and (eq (include "edk-enterprise.topologyMode" .) "distributed") (index .Values.services "tenant-kms").enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-tenant-kms-authority-bootstrap
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-kms-authority-bootstrap
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    {{- include "edk-enterprise.selectorLabels" (dict "root" . "name" "tenant-kms") | nindent 4 }}
    edk.sphereon.com/tenant-kms-authority-bootstrap: "true"
  ports:
    - name: grpc
      port: {{ .Values.grpc.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
