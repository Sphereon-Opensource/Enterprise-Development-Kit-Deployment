{{- if and .Values.serviceMonitor.enabled (eq (include "edk-enterprise.topologyMode" .) "distributed") }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
  {{- with $.Values.serviceMonitor.namespace }}
  namespace: {{ . | quote }}
  {{- end }}
  labels:
    {{- include "edk-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    {{- with $.Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "edk-enterprise.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  endpoints:
    - port: rest
      path: {{ $.Values.serviceMonitor.path | quote }}
      interval: {{ $.Values.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ $.Values.serviceMonitor.scrapeTimeout | quote }}
---
{{- end }}
{{- end }}
{{- end }}
