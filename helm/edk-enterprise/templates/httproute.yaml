{{- if .Values.gateway.enabled }}
{{- $base := include "edk-enterprise.gateway.baseDomain" . }}
{{- $wildcard := printf "*.%s" $base }}
{{- $operatorHost := printf "%s.%s" .Values.gateway.operatorHost $base }}
{{- $gatewayName := printf "%s-gateway" (include "edk-enterprise.fullname" .) }}
{{- $platformRouteAnnotations := .Values.gateway.platformAccess.routeAnnotations | default dict }}
{{- $preserveOriginalHost := .Values.gateway.envoyGateway.preserveOriginalHost | default false }}
{{- $edgeHostFilterName := printf "%s-preserve-edge-host" (include "edk-enterprise.fullname" .) }}
{{- if and .Values.gateway.enabled $preserveOriginalHost }}
# Envoy Gateway can rewrite the authority to a selected pod while forwarding to
# a Service backend. This restores its own early snapshot after route matching,
# so host-based tenant resolution receives the public tenant host.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ $edgeHostFilterName }}
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
spec:
  urlRewrite:
    hostname:
      type: Header
      header: x-forwarded-host
    appendXForwardedHost: false
---
{{- end }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- if eq $name "platform" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
  {{- with $platformRouteAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "edk-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: https-platform
  hostnames:
    - {{ $operatorHost | quote }}
  rules:
    - timeouts:
        request: {{ $.Values.gateway.requestTimeout | quote }}
        backendRequest: {{ $.Values.gateway.backendRequestTimeout | quote }}
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
          port: {{ $svc.restPort }}
---
{{- else if eq $name "admin-console" }}
# The one-request Secrets delegation issuer is east-west/BFF-only. Shadow its
# exact public path to the admin-console service without Next's /admin-console
# basePath, which deliberately returns 404. The BFF itself calls the platform
# service directly over the cluster network.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" "secret-delegation-hidden") }}
  {{- with $platformRouteAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "edk-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: https-platform
  hostnames:
    - {{ $operatorHost | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/platform/admin/v1/application/secrets/internal/delegated-token
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
          port: {{ $svc.restPort }}
---
# Operator/admin console on the operator host. The explicit /admin-console PathPrefix is
# more specific than the platform route's / catch-all, so Gateway API path
# precedence (longest prefix wins) routes /admin-console/* here while everything
# else falls through to the platform service. NEVER strip the /admin-console
# prefix: Next emits absolute /admin-console/_next/... asset URLs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
  {{- with $platformRouteAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "edk-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: https-platform
  hostnames:
    - {{ $operatorHost | quote }}
  rules:
    # The console BFF keeps the browser request open while synchronous tenant
    # provisioning completes. Envoy Gateway otherwise applies its 15-second
    # default to this outer route even though the platform route below permits
    # the configured provisioning timeout.
    - timeouts:
        request: {{ $.Values.gateway.requestTimeout | quote }}
        backendRequest: {{ $.Values.gateway.backendRequestTimeout | quote }}
      matches:
        - path:
            type: PathPrefix
            value: /admin-console
        - path:
            type: Exact
            value: /admin
        - path:
            type: PathPrefix
            value: /admin/
        - path:
            type: Exact
            value: /api/platform/bootstrap/v1/admin-console-context
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
          port: {{ $svc.restPort }}
---
{{- else if eq $name "admin-console-tenant" }}
# Tenant administration and the existing instance testing console share the
# tenant-mode runtime. The full /admin-console prefix is safe here because this
# process has no platform BFF credential and validates the exact tenant host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "edk-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: https
  hostnames:
    - {{ $wildcard | quote }}
  rules:
    # Only the browser-safe admin-console runtime projection is exposed from
    # the platform service on tenant hosts.
    - matches:
        - path:
            type: Exact
            value: /api/platform/bootstrap/v1/runtime-config/admin-console
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" "platform") }}
          port: {{ (index $.Values.services "platform").restPort }}
    - matches:
        - path:
            type: PathPrefix
            value: /admin-console
        - path:
            type: Exact
            value: /admin
        - path:
            type: PathPrefix
            value: /admin/
        - path:
            type: Exact
            value: /api/platform/bootstrap/v1/admin-console-context
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
          port: {{ $svc.restPort }}
    # Preserve the neutral public testing-console page and API rewrites.
    - matches:
        - path:
            type: PathPrefix
            value: /testing-console
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /admin-console/testing-console
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
          port: {{ $svc.restPort }}
    # Browser-facing testing API under the neutral /testing-console prefix, so the
    # customer-facing surface never exposes admin-console URLs. One rule per path
    # because each carries its own ReplacePrefixMatch; longest-prefix precedence
    # keeps these ahead of the page rule above.
    {{- range $apiPrefix := list "/api/oid4vci/v1/testing" "/api/oid4vp/v1/testing" "/api/portal-oauth/login" "/api/portal-oauth/callback" "/api/portal-oauth/grant" "/api/portal-oauth/revoke" }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ printf "/testing-console%s" $apiPrefix | quote }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ printf "/admin-console%s" $apiPrefix | quote }}
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
          port: {{ $svc.restPort }}
    {{- end }}
    - matches:
        {{- range $path := (include "edk-enterprise.gateway.tenantPaths" (dict "name" $name) | trim | fromYamlArray) }}
        - path:
            type: PathPrefix
            value: {{ $path | quote }}
        {{- end }}
        {{- range $path := list "/admin-console/api/portal-oauth/login" "/admin-console/api/portal-oauth/callback" "/admin-console/api/portal-oauth/grant" "/admin-console/api/portal-oauth/revoke" "/admin-console/health" }}
        - path:
            type: Exact
            value: {{ $path | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
          port: {{ $svc.restPort }}
---
{{- else }}
{{- $paths := include "edk-enterprise.gateway.tenantPaths" (dict "name" $name) | trim }}
{{- if $paths }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "edk-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: https
  hostnames:
    - {{ $wildcard | quote }}
  rules:
    - {{ if $preserveOriginalHost }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ $edgeHostFilterName }}
      {{ end }}
      matches:
        {{- range $path := ($paths | fromYamlArray) }}
        - path:
            type: PathPrefix
            value: {{ $path | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
          port: {{ $svc.restPort }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if (index .Values.services "tenant-as").enabled }}
# Customer identities and credentials are workload data. Route the canonical
# identity-manager, identity-auth admin, and Trust Domain APIs to tenant-AS,
# which owns the tenant database and tenant KMS identifier-protection keys.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-tenant-as-identity-admin
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-as
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: https
  hostnames:
    - {{ $wildcard | quote }}
  rules:
    - {{ if $preserveOriginalHost }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ $edgeHostFilterName }}
      {{ end }}
      matches:
        - path:
            type: RegularExpression
            value: "^/api/(identity/v1|identity-auth/v1/admin|party/v1|trust-domain/v1)(/.*)?$"
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" . "name" "tenant-as") }}
          port: {{ (index .Values.services "tenant-as").restPort }}
---
{{- end }}
{{- if .Values.services.platform.enabled }}
# Tenant-host platform projections used by the theme, wallet-entitlement and
# tenant-scoped platform-config APIs (which include typed KMS resource
# management). These are intentionally narrow; the platform's operator-host
# catch-all must not become a wildcard tenant-host catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-platform-tenant
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: https
  hostnames:
    - {{ $wildcard | quote }}
  rules:
    - {{ if $preserveOriginalHost }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ $edgeHostFilterName }}
      {{ end }}
      matches:
        - path:
            type: PathPrefix
            value: /api/theme/v1
        - path:
            type: PathPrefix
            value: /api/wallet-entitlement/v1
        - path:
            type: PathPrefix
            value: /api/platform/config/v1/tenants
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" . "name" "platform") }}
          port: {{ .Values.services.platform.restPort }}
---
{{- end }}
{{- range $name := list "did" }}
{{- $svc := index $.Values.services $name }}
{{- if $svc.enabled }}
# Operator-host DID management projection. Typed KMS resources are platform
# configuration routes; tenant-KMS command traffic remains internal gRPC.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "edk-enterprise.fullname" $ }}-{{ $name }}-operator
  {{- with $platformRouteAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "edk-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: https-platform
  hostnames:
    - {{ $operatorHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/api/did/v1"
      backendRefs:
        - name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
          port: {{ $svc.restPort }}
---
{{- end }}
{{- end }}
{{- if and .Values.gateway.httpRedirect (ne .Values.gateway.tls.mode "external") }}
{{- /* With tls.mode=external the external front owns the http->https redirect
       and the Gateway has no `http` listener, so the redirect route is
       skipped even when httpRedirect stays true. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-https-redirect
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: http
  hostnames:
    - {{ $wildcard | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
