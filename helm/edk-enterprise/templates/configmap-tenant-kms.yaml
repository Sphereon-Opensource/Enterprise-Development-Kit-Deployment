{{- /*
Tenant KMS configuration overlay.

The tenant KMS holds the per-tenant software key material and serves the
east-west signing, MAC, and encryption hops over gRPC. It must trust the
workload identities that call it — including the tenant authorization server,
which seeds its signing key here during tenant registration. The target tenant
must be carried in the cryptographically validated workload
JWT so the seed lands in the right tenant's key space.

Delivered as the tenant KMS application.yml through a subPath mount, which
REPLACES the image's baked /app/config/application.yml rather than merging with
it. Keys the baked file supplies (server.rest.port, server.rest.auth.enabled,
transport.grpc.*) must therefore come from environment variables the deployment
template renders.

Rendered only for the tenant KMS.
*/ -}}
{{- if and (eq (include "edk-enterprise.topologyMode" .) "distributed") (index .Values.services "tenant-kms").enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-tenant-kms-config
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-kms
data:
  application.yml: |
{{ include "edk-enterprise.secretAuthoritySatelliteConfig" (dict "workloadId" (index .Values.serviceIdentity.serviceIds "tenant-kms")) | indent 4 }}
{{ include "edk-enterprise.secretManagementSatelliteDatabaseConfig" . | indent 4 }}
    server:
      service-identity:
        # Tenant-scoped config fetches must use the tenant-bound KMS client at
        # the platform AS; active-AS discovery would recurse through KMS.
        token-endpoint: {{ printf "http://%s:%v/token" (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) ((index .Values.services "platform").restPort) | quote }}
        token-endpoint-allow-http: true
        token-endpoint-source: configured
        active-as-client-role: kms
        client-id: {{ index .Values.serviceIdentity.clientIds "tenant-kms" | quote }}
        client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
        tenant-bound-client-id: true
        audience: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "platform") | quote }}
    # Workload identities the tenant KMS trusts on east-west command-transport
    # calls, each bound to the client id of the service token the caller presents.
    # Tenant and principal claims are taken only from the validated workload JWT.
    security:
      workload-trust-policy:
        trusted_service_ids:
          - {{ index .Values.serviceIdentity.serviceIds "tenant-kms" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "did" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "issuer" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "verifier" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "tenant-as" | quote }}
          {{- if (index .Values.services "wallet-interaction").enabled }}
          - {{ index .Values.serviceIdentity.serviceIds "wallet-interaction" | quote }}
          {{- end }}
        service_client_bindings:
          "[{{ index .Values.serviceIdentity.serviceIds "tenant-kms" }}]": {{ index .Values.serviceIdentity.clientIds "tenant-kms" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "did" }}]": {{ index .Values.serviceIdentity.clientIds "did" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "issuer" }}]": {{ index .Values.serviceIdentity.clientIds "issuer" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "verifier" }}]": {{ index .Values.serviceIdentity.clientIds "verifier" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "tenant-as" }}]": {{ index .Values.serviceIdentity.clientIds "tenant-as" | quote }}
          {{- if (index .Values.services "wallet-interaction").enabled }}
          "[{{ index .Values.serviceIdentity.serviceIds "wallet-interaction" }}]": {{ index .Values.serviceIdentity.clientIds "wallet-interaction" | quote }}
          {{- end }}
    # Tenant configuration routes platform-side KMS commands to SERVER. This
    # workload is that receiver, so its deployment-local routing must remain
    # LOCAL to avoid recursively invoking the remote KMS endpoint.
    transport:
      routing:
        # Platform/license endpoints are deployment topology and must remain
        # available before tenant/principal configuration has loaded.
        configScope: APP
        modules:
          # Tenant-KMS is the only caller of the platform identity Service.
          # Identity-ready is /health/identity (gRPC + token/JWKS), not /ready.
          platform:
            target: SERVER
            transport: GRPC
            endpoint: {{ printf "grpc://%s:%v" (include "edk-enterprise.identityServiceName" (dict "root" . "name" "platform")) .Values.grpc.port | quote }}
            serviceTokenAudience: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "platform") | quote }}
            services:
              config:
                target: SERVER
                transport: GRPC
                endpoint: {{ printf "grpc://%s:%v" (include "edk-enterprise.identityServiceName" (dict "root" . "name" "platform")) .Values.grpc.port | quote }}
                serviceTokenAudience: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "platform") | quote }}
          application:
            target: SERVER
            transport: GRPC
            endpoint: {{ printf "grpc://%s:%v" (include "edk-enterprise.identityServiceName" (dict "root" . "name" "platform")) .Values.grpc.port | quote }}
            serviceTokenAudience: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "platform") | quote }}
          secret:
            target: SERVER
            transport: GRPC
            endpoint: {{ printf "grpc://%s:%v" (include "edk-enterprise.identityServiceName" (dict "root" . "name" "platform")) .Values.grpc.port | quote }}
            serviceTokenAudience: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "platform") | quote }}
            # Resolving the active KMS workload credential uses the dedicated
            # tenant bootstrap bearer supplied by RemoteOpaqueSecretResolver.
            preferServiceTokenOverSessionBearer: false
    config:
      providers:
        platform-config-remote:
          bootstrap-required-keyspaces: crypto.kms.roles
      overrides:
        transport:
          routing:
            modules:
              kms:
                services:
                  key:
                    target: LOCAL
                  leaf:
                    target: LOCAL
                  encryption:
                    target: LOCAL
                  # Tenant configuration points this group at the KMS server for
                  # every other workload. This service is that server, so the
                  # same setting would make it call itself.
                  mac:
                    target: LOCAL
    kms:
      # Internal-only software provider used before tenant platform config has
      # been pulled. It gives tenant-KMS local crypto support for validating
      # platform bearer signatures; REST discovery hides providers marked
      # system=true.
      providers:
        internal-token-verifier:
          type: software
          id: internal-token-verifier
          enabled: true
          system: true
          role: internal
          exposePrivateKeysDuringGeneration: false
          persistKeysDuringGeneration: false
          keyStore:
            type: memory
            id: internal-token-verifier-memory
            keyVisibility: public
            overwriteAlias: true
      # Tenant KMS roles are authored by the platform during tenant registration
      # and exposed through platform-config-remote as crypto.kms.roles.*.
      # Tenant-KMS must not define a second tenant-visible local role or restore
      # the removed generic provider API. Key material persists in the tenant-kms
      # keystore volume.
      enterprise:
        lifecycle:
          enabled: true
          interval: PT1H
          run-on-startup: true
    crypto:
      kms:
        roles:
          oauth2-as:
            algorithm: ES256
          issuer-signing:
            algorithm: ES256
          issuer-request-decryption:
            algorithm: ES256
          verifier-request-object-signing:
            algorithm: ES256
{{- end }}
