            preferServiceTokenOverSessionBearer: false
          kms:
            serviceTokenAudience: {{ include "edk-enterprise.serviceAudience" "tenant-kms" | quote }}
            preferServiceTokenOverSessionBearer: true
            services:
              # Client-instance keys stay in this workload's software WSCD.
              key:
                target: LOCAL
              keys:
                target: LOCAL
              signature:
                commands:
                  "[kms.signature.create]":
                    target: SERVER
                    transport: GRPC
                    endpoint: {{ printf "grpc://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "tenant-kms")) .Values.grpc.port | quote }}
          wallet:
            serviceTokenAudience: {{ include "edk-enterprise.serviceAudience" "wallet-unit" | quote }}
            preferServiceTokenOverSessionBearer: true
            services:
              unit:
                target: SERVER
                transport: GRPC
                endpoint: {{ printf "grpc://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "wallet-unit")) .Values.grpc.port | quote }}
              "[hsm-policy]":
                commands:
                  "[wallet.hsm-policy.authorize]":
                    target: SERVER
                    transport: GRPC
                    endpoint: {{ printf "grpc://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "wallet-unit")) .Values.grpc.port | quote }}
                    timeoutMs: 30000
    did:
      persistence:
        type: postgresql
    kms:
      providers:
        default:
          type: software
          enabled: true
          exposePrivateKeysDuringGeneration: false
          keyStore:
            type: pkcs12
            password: ${env:EDK_KEYSTORE_PASSWORD}
            keystoreRoot: /keystore
            keyVisibility: private
            persist: true
            overwriteAlias: true
        software:
          type: software
          id: software
          enabled: true
          keystore:
            type: pkcs12
            id: wallet-interaction-keystore
            password: ${env:EDK_KEYSTORE_PASSWORD}
            keystoreRoot: /keystore
            keyVisibility: private
            persist: true
            overwriteAlias: true
    crypto:
      kms:
        roles:
          wallet-interaction:
            provider: software
            algorithm: ES256
    blob-stores:
      wallet-interaction:
        type: kvstore
        kvStoreId: wallet-interaction-blobs
        scope-binding: TENANT
        maxBlobSizeBytes: 10485760
    kv-stores:
      blob.metadata: &walletDatabaseKv
        type: database
        scope-binding: TENANT
      wallet-interaction-blobs: *walletDatabaseKv
      wallet-interaction-sessions: *walletDatabaseKv
    wallet:
      interaction:
        trust:
          policy-mode: WARN
        security:
          require-challenge: true
        oid4vci:
          holder:
            signing-key-id: wallet-interaction-holder-signing
            signing-algorithm: ES256
{{- end }}
