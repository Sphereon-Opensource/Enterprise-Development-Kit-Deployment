{{- if (index .Values.services "wallet-interaction").enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-wallet-interaction-config
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: wallet-interaction
data:
  application.yml: |
    security:
      header-trust-policy:
        trusted_service_ids:
          - {{ index .Values.serviceIdentity.serviceIds "issuer" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "verifier" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "wallet-unit" | quote }}
        service_client_bindings:
          "[{{ index .Values.serviceIdentity.serviceIds "issuer" }}]": {{ index .Values.serviceIdentity.clientIds "issuer" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "verifier" }}]": {{ index .Values.serviceIdentity.clientIds "verifier" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "wallet-unit" }}]": {{ index .Values.serviceIdentity.clientIds "wallet-unit" | quote }}
    transport:
      routing:
        modules:
          wallet:
            serviceTokenAudience: {{ index .Values.serviceIdentity.audiences "wallet-unit" | quote }}
            preferServiceTokenOverSessionBearer: true
            services:
              "[hsm-policy]":
                commands:
                  "[wallet.hsm-policy.authorize]":
                    target: SERVER
                    transport: GRPC
                    endpoint: {{ printf "grpc://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "wallet-unit")) .Values.grpc.port | quote }}
                    timeoutMs: 30000
    did:
      persistence:
        type: postgresql
    kms:
      providers:
        default:
          type: software
          enabled: true
          exposePrivateKeysDuringGeneration: false
          keyStore:
            type: pkcs12
            password: ${env:EDK_KEYSTORE_PASSWORD}
            keystoreRoot: /keystore
            keyVisibility: private
            persist: true
            overwriteAlias: true
        software:
          type: software
          id: software
          enabled: true
          keystore:
            type: pkcs12
            id: wallet-interaction-keystore
            password: ${env:EDK_KEYSTORE_PASSWORD}
            keystoreRoot: /keystore
            keyVisibility: private
            persist: true
            overwriteAlias: true
    crypto:
      kms:
        roles:
          wallet-interaction:
            provider: software
            algorithm: ES256
    blob-stores:
      wallet-interaction:
        type: kvstore
        kvStoreId: wallet-interaction-blobs
        scope-binding: TENANT
        maxBlobSizeBytes: 10485760
    kv-stores:
      blob.metadata: &walletDatabaseKv
        type: database
        scope-binding: TENANT
      wallet-interaction-blobs: *walletDatabaseKv
      wallet-interaction-sessions: *walletDatabaseKv
    wallet:
      interaction:
        trust:
          policy-mode: WARN
        security:
          require-challenge: true
        oid4vci:
          holder:
            signing-key-id: wallet-interaction-holder-signing
            signing-algorithm: ES256
{{- end }}
