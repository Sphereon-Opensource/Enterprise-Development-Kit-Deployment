{{- /*
Runtime configuration that cannot be expressed safely or completely through the
shared Deployment environment. The enterprise images do not bake an
application.yml, so every service with service-specific routing, persistence, or
security policy receives an explicit base file here.
*/ -}}
{{- if .Values.services.did.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-did-config
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: did
data:
  application.yml: |
    security:
      header-trust-policy:
        trusted_service_ids:
          - {{ index .Values.serviceIdentity.serviceIds "tenant-kms" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "did" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "issuer" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "verifier" | quote }}
        service_client_bindings:
          "[{{ index .Values.serviceIdentity.serviceIds "tenant-kms" }}]": {{ index .Values.serviceIdentity.clientIds "tenant-kms" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "did" }}]": {{ index .Values.serviceIdentity.clientIds "did" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "issuer" }}]": {{ index .Values.serviceIdentity.clientIds "issuer" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "verifier" }}]": {{ index .Values.serviceIdentity.clientIds "verifier" | quote }}
    did:
      persistence:
        type: postgresql
    kms:
      providers:
        software:
          id: software
          type: software
          enabled: true
          autoCreateCertificate: true
          keystore:
            type: pkcs12
            id: software
            password: ${env:EDK_KEYSTORE_PASSWORD}
            path: "{tempDir}/edk-verify-keystore.p12"
    transport:
      routing:
        modules:
          kms:
            services:
              signature:
                commands:
                  "[kms.signature.verify]":
                    target: LOCAL
---
{{- end }}
{{- if .Values.services.issuer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-issuer-config
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: issuer
data:
  application.yml: |
    security:
      header-trust-policy:
        trusted_service_ids:
          - {{ index .Values.serviceIdentity.serviceIds "tenant-kms" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "did" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "issuer" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "verifier" | quote }}
        service_client_bindings:
          "[{{ index .Values.serviceIdentity.serviceIds "tenant-kms" }}]": {{ index .Values.serviceIdentity.clientIds "tenant-kms" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "did" }}]": {{ index .Values.serviceIdentity.clientIds "did" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "issuer" }}]": {{ index .Values.serviceIdentity.clientIds "issuer" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "verifier" }}]": {{ index .Values.serviceIdentity.clientIds "verifier" | quote }}
    applications:
      admin-console:
        public-base-path: /admin-console
    oid4vci:
      issuer:
        protocol:
          base-path: /oid4vci
    kms:
      providers:
        software:
          id: software
          type: software
          enabled: true
          autoCreateCertificate: true
          keystore:
            type: pkcs12
            id: software
            password: ${env:EDK_KEYSTORE_PASSWORD}
            path: "{tempDir}/edk-verify-keystore.p12"
    transport:
      routing:
        modules:
          kms:
            services:
              signature:
                commands:
                  "[kms.signature.verify]":
                    target: LOCAL
          oauth2:
            target: SERVER
            transport: HTTP
            endpoint: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "tenant-as")) ((index .Values.services "tenant-as").restPort) | quote }}
          wallet:
            serviceTokenAudience: {{ index .Values.serviceIdentity.audiences "wallet-interaction" | quote }}
            preferServiceTokenOverSessionBearer: true
            services:
              interaction:
                target: SERVER
                transport: GRPC
                endpoint: {{ printf "grpc://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "wallet-interaction")) .Values.grpc.port | quote }}
                timeoutMs: 30000
    blob:
      stores:
        designs:
          type: kvstore
          kvStoreId: design-assets
    issuance-pipeline:
      encryption:
        master-kek: ${env:EDK_PIPELINE_MASTER_KEK}
        blind-index-key: ${env:EDK_PIPELINE_BLIND_INDEX_KEY}
    kv:
      stores:
        issuance-pipeline-sessions: &tenantDatabaseKv
          type: KvStoreConfig
          backendId: database
          scopeBinding: TENANT
        design-assets: *tenantDatabaseKv
        oid4vci:
          credential-request-identities: *tenantDatabaseKv
        blob:
          metadata: *tenantDatabaseKv
---
{{- end }}
