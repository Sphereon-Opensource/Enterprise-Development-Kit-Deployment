{{- if eq (include "edk-enterprise.topologyMode" .) "distributed" }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $grpcReceiver := or (eq $name "platform") (eq $name "tenant-kms") (eq $name "wallet-unit") (eq $name "wallet-interaction") }}
{{- /* admin-console is a Next.js standalone web app, not an EDK Java service:
       it carries no DB/JWT/gRPC/license-gate wiring and is probed on its own
       /admin-console/health route rather than the EDK /health endpoint. */}}
{{- $isAdminConsole := or (eq $name "admin-console") (eq $name "admin-console-tenant") }}
{{- $isBusinessWallet := eq $name "business-wallet" }}
{{- $isFrontend := or $isAdminConsole $isBusinessWallet }}
{{- $imageTag := $svc.imageTag | default $.Values.global.imageTag | default $.Chart.AppVersion }}
{{- $secretAuthoritySecret := "" }}
{{- if not $isFrontend }}
{{- $secretAuthoritySecret = index $.Values.secretAuthority.existingSecrets $name }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "edk-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  {{- if not $isFrontend }}
  {{- /* Database schema migrations are fail-closed single-writer. RollingUpdate
         would run two schema generations against the same database at once and
         crash-loop the outgoing release, so the old pod must stop first. */}}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "edk-enterprise.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  template:
    metadata:
      {{- if or (not $isFrontend) $.Values.podAnnotations }}
      annotations:
        {{- if eq $name "platform" }}
        checksum/platform-config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret-management-manifests: {{ include (print $.Template.BasePath "/configmap-secret-management.yaml") $ | sha256sum }}
        {{- else if eq $name "tenant-as" }}
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap-tenant-as.yaml") $ | sha256sum }}
        {{- else if eq $name "tenant-kms" }}
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap-tenant-kms.yaml") $ | sha256sum }}
        {{- else if or (eq $name "did") (eq $name "blob") (eq $name "issuer") (eq $name "verifier") (eq $name "wallet-unit") (eq $name "wallet-interaction") }}
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap-runtime-services.yaml") $ | sha256sum }}
        {{- end }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "edk-enterprise.selectorLabels" (dict "root" $ "name" $name) | nindent 8 }}
        {{- if eq $name "platform" }}
        edk.sphereon.com/platform-authority-bootstrap: "true"
        {{- else if eq $name "tenant-kms" }}
        edk.sphereon.com/tenant-kms-authority-bootstrap: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ if eq $name "platform" }}{{ include "edk-enterprise.platformServiceAccountName" $ }}{{ else }}{{ include "edk-enterprise.serviceAccountName" $ }}{{ end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with $.Values.global.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $waitForPlatformGrpc := and $.Values.grpc.enabled (not $isFrontend) (ne $name "platform") }}
      {{- if or (and (eq $name "platform") $.Values.license.trust.existingSecret) $waitForPlatformGrpc }}
      initContainers:
        {{- if and (eq $name "platform") $.Values.license.trust.existingSecret }}
      {{- /* Seed the writable license-state volume with the root-CA trust anchor
             from the Secret on every start, so the platform trusts the activated
             license across restarts. The setup API still writes the imported
             bundle's root CA into the same volume. */}}
        - name: seed-license-trust
          image: "{{ $.Values.global.imageRegistry }}/{{ $svc.image }}:{{ $imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - cp /license-trust-seed/license-root-ca.pem {{ $.Values.license.trust.rootCaPath | quote }}
          volumeMounts:
            - name: license-root-ca
              mountPath: /license-trust-seed
              readOnly: true
            - name: license-state
              mountPath: {{ dir $.Values.license.trust.rootCaPath | quote }}
        {{- end }}
        {{- if $waitForPlatformGrpc }}
        {{- $platformGrpcService := include "edk-enterprise.serviceName" (dict "root" $ "name" "platform") }}
        {{- if eq $name "tenant-kms" }}
        {{- $platformGrpcService = printf "%s-platform-authority-bootstrap" (include "edk-enterprise.fullname" $) }}
        {{- end }}
        # Do not construct a long-lived gRPC channel while the platform Service
        # has no ready endpoint. Netty's reconnect backoff can otherwise outlive
        # the first tenant-registration request even though the platform becomes
        # ready moments later.
        - name: wait-for-platform-grpc
          image: "{{ $.Values.global.imageRegistry }}/{{ $svc.image }}:{{ $imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          command:
            - /bin/bash
            - -ec
            - >-
              until (echo > /dev/tcp/{{ $platformGrpcService }}/{{ $.Values.grpc.port }}) 2>/dev/null;
              do sleep 1;
              done
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $svc.image }}:{{ $imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          {{- with $svc.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: rest
              containerPort: {{ $svc.restPort }}
              protocol: TCP
            {{- if and $.Values.grpc.enabled $grpcReceiver }}
            - name: grpc
              containerPort: {{ $.Values.grpc.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- if not $isFrontend }}
            # Secret-authority coordinate strings contain key identifiers,
            # validity windows, and in-container paths. They remain in the
            # workload-isolated Secret with the corresponding key material.
            - name: SECRET_AUTHORITY_SATELLITE_ASSERTION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretAuthoritySecret | quote }}
                  key: {{ $.Values.secretAuthority.keys.satelliteAssertionSigningKey | quote }}
            - name: SECRET_AUTHORITY_SATELLITE_PERMIT_VERIFICATION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $secretAuthoritySecret | quote }}
                  key: {{ $.Values.secretAuthority.keys.satellitePermitVerificationKeys | quote }}
            {{- if eq $name "platform" }}
            - name: TENANT_KMS_AUTHORITY_BOOTSTRAP_HOST
              value: {{ printf "%s-tenant-kms-authority-bootstrap" (include "edk-enterprise.fullname" $) | quote }}
            - name: TENANT_KMS_AUTHORITY_BOOTSTRAP_PORT
              value: {{ $.Values.grpc.port | quote }}
            - name: SECRET_AUTHORITY_CENTRAL_PERMIT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretAuthoritySecret | quote }}
                  key: {{ $.Values.secretAuthority.keys.centralPermitSigningKey | quote }}
            - name: SECRET_AUTHORITY_CENTRAL_ASSERTION_VERIFICATION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $secretAuthoritySecret | quote }}
                  key: {{ $.Values.secretAuthority.keys.centralAssertionVerificationKeys | quote }}
            {{- end }}
            - name: APP_PROFILE
              value: "container"
            # Configuration directory the service reads: application.yml plus the
            # active-profile overlay (application-container.yml). The platform's
            # platform tenant datasource override is delivered here.
            - name: SPHEREON_CONFIG_LOCATION
              value: "/app/config"
            {{- if ne $name "platform" }}
            # Satellites use platform-owned configuration as their primary config
            # source. Local file/env config remains bootstrap and explicit override.
            - name: CONFIG_PROVIDERS_PLATFORM_CONFIG_REMOTE_ENABLED
              value: {{ $.Values.config.providers.platformConfigRemote.enabled | quote }}
            - name: CONFIG_PROVIDERS_PLATFORM_CONFIG_REMOTE_BOOTSTRAP_REQUIRED_KEYSPACES
              {{- $remoteKeyspaces := "crypto.kms.roles" -}}
              {{- if eq $name "tenant-as" -}}
              {{- $remoteKeyspaces = "oauth2.servers,crypto.kms.roles" -}}
              {{- else if eq $name "blob" -}}
              {{- $remoteKeyspaces = "oauth2.servers,crypto.kms.roles,theme" -}}
              {{- else if eq $name "issuer" -}}
              {{- $remoteKeyspaces = "crypto.kms.roles,oid4vci,credential-design,statuslists" -}}
              {{- else if eq $name "verifier" -}}
              {{- $remoteKeyspaces = "crypto.kms.roles,oid4vp" -}}
              {{- end }}
              value: {{ $remoteKeyspaces | quote }}
            - name: CONFIG_PROVIDERS_TENANT_CONFIG_DB_ENABLED
              value: {{ $.Values.config.providers.tenantConfigDb.enabled | quote }}
            {{- end }}
            - name: PORT
              value: {{ $svc.restPort | quote }}
            - name: REST_PORT
              value: {{ $svc.restPort | quote }}
            - name: GRPC_ENABLED
              value: {{ and $.Values.grpc.enabled $grpcReceiver | quote }}
            - name: GRPC_PORT
              value: {{ $.Values.grpc.port | quote }}
            - name: GRPC_AUTH_MODE
              value: {{ $.Values.grpc.authMode | quote }}
            - name: TENANT_RESOLUTION_PLATFORM_BASE_DOMAIN
              value: {{ $.Values.global.platformBaseDomain | quote }}
            - name: TENANT_RESOLUTION_PLATFORM_SUBDOMAIN_ENABLED
              value: "true"
            - name: TENANT_RESOLUTION_CUSTOM_DOMAIN_ENABLED
              value: "true"
            {{- /* The EDK strict-auth gate reads the un-prefixed `server.rest.auth.enabled`
                   property. The EDK property normalizer performs no prefix stripping, so the
                   SPHEREON_APP_ form below resolves to `sphereon.app.server.rest.auth.enabled`
                   and never reaches the gate; it is the VDX transport-server name and is kept
                   only for VDX-based images. This is the variable the gate actually reads, and
                   it matches the un-prefixed convention every SERVER_REST_AUTH_* sibling below
                   already uses. Without it the gate falls back to its permissive default
                   (RestAuthSettings.enabled = false) because the ConfigMap overlays replace the
                   image's baked application.yml through a subPath mount. */}}
            - name: SERVER_REST_AUTH_ENABLED
              value: {{ $.Values.auth.enabled | quote }}
            - name: SPHEREON_APP_SERVER_REST_AUTH_ENABLED
              value: {{ $.Values.auth.enabled | quote }}
            {{- $transportAudience := "" }}
            {{- if $grpcReceiver }}{{- $transportAudience = include "edk-enterprise.serviceAudience" $name }}{{- end }}
            {{- if $transportAudience }}
            # TransportServerConfigProvider reads the canonical unprefixed
            # transport.auth.expected-audience property from AppConfigService.
            # Keep the SPHEREON_APP_ form as well for assemblies that bind the
            # direct environment-backed transport provider.
            - name: TRANSPORT_AUTH_EXPECTED_AUDIENCE
              value: {{ $transportAudience | quote }}
            - name: SPHEREON_APP_TRANSPORT_AUTH_EXPECTED_AUDIENCE
              value: {{ $transportAudience | quote }}
            {{- end }}
            {{- if eq $name "platform" }}
            - name: EXTERNAL_BASE_URL
              value: {{ $.Values.platform.externalBaseUrl | quote }}
            # Setup-API CORS allow-list origin and operator-cli OAuth redirect
            # base. The platform UI lives at the platform's own origin, so this
            # is externalBaseUrl by definition; a divergent value only breaks
            # browser flows with CORS rejections.
            - name: ONBOARDING_UI_BASE_URL
              value: {{ $.Values.platform.externalBaseUrl | quote }}
            {{- include "edk-enterprise.emailEnv" $ | nindent 12 }}
            {{- end }}
            {{- if eq $name "tenant-as" }}
            - name: THEME_CLIENT_BASE_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "blob")) (index $.Values.services "blob").restPort | quote }}
            {{- end }}
            {{- /* East-west service identity + keystore secrets shared by the service containers.
                   The platform AS mints the service tokens the satellites present; the
                   satellites authenticate with the same internal client secret and read
                   their software keystore with the keystore password. */}}
            {{- if $.Values.serviceIdentity.internalClientExistingSecret }}
            - name: EDK_INTERNAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.serviceIdentity.internalClientExistingSecret }}
                  key: {{ $.Values.serviceIdentity.internalClientSecretKey }}
            {{- end }}
            {{- if $.Values.keystore.existingSecret }}
            - name: EDK_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.keystore.existingSecret }}
                  key: {{ $.Values.keystore.passwordKey }}
            {{- end }}
            {{- if and (eq $name "platform") $.Values.portalBff.existingSecret }}
            - name: ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.portalBff.existingSecret }}
                  key: {{ $.Values.portalBff.clientSecretKey }}
            {{- end }}
            {{- if and (eq $name "issuer") $.Values.issuerPipeline.existingSecret }}
            - name: EDK_PIPELINE_MASTER_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.issuerPipeline.existingSecret }}
                  key: {{ $.Values.issuerPipeline.masterKekKey }}
            - name: EDK_PIPELINE_BLIND_INDEX_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.issuerPipeline.existingSecret }}
                  key: {{ $.Values.issuerPipeline.blindIndexKey }}
            {{- end }}
            {{- if and (eq $name "tenant-as") $.Values.federationSessionEncryption.existingSecret }}
            - name: FEDERATION_SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.federationSessionEncryption.existingSecret }}
                  key: {{ $.Values.federationSessionEncryption.key }}
            {{- end }}
            {{- /* Public URLs the satellites self-fetch JWKS from and the platform/tenant
                   AS stamp as token issuers. The platform host and tenant-AS host derive
                   from the installation base domain. */}}
            - name: EDK_PLATFORM_PUBLIC_URL
              value: {{ $.Values.platform.externalBaseUrl | quote }}
            - name: EDK_PLATFORM_BASE_DOMAIN
              value: {{ $.Values.global.platformBaseDomain | quote }}
            {{- if $.Values.opentelemetry.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.opentelemetry.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ $.Values.opentelemetry.protocol | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ $.Values.opentelemetry.metricsExporter | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ $.Values.opentelemetry.metricsExportIntervalMillis | quote }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ $.Values.opentelemetry.headers | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "service.name=%s,%s" (include "edk-enterprise.serviceName" (dict "root" $ "name" $name)) $.Values.opentelemetry.resourceAttributes | trimSuffix "," | quote }}
            {{- end }}
            {{- if $.Values.auth.jwt.enabled }}
            - name: SPHEREON_APP_SERVER_REST_JWT_ENABLED
              value: "true"
            - name: SPHEREON_APP_SERVER_REST_JWT_DEFAULT_IDP_ISSUER
              value: {{ $.Values.auth.jwt.issuer | quote }}
            - name: SPHEREON_APP_SERVER_REST_JWT_DEFAULT_IDP_JWKS_URI
              value: {{ $.Values.auth.jwt.jwksUri | quote }}
            - name: SPHEREON_APP_SERVER_REST_JWT_DEFAULT_IDP_AUDIENCE
              value: {{ $.Values.auth.jwt.audience | quote }}
            {{- end }}
            {{- if $.Values.database.enabled }}
            {{- $platformDb := $.Values.database.platform }}
            {{- $tenantDb := $.Values.database.tenant }}
            {{- if eq $name "platform" }}
            # Control-plane datasource: the tenant registry, routing, public-endpoint
            # bindings, and platform configuration live in the platform database. The
            # platform service owns this connection. The system platform tenant is
            # control-plane state and is bound here via the database.tenants override.
            # The platform also owns migrations in the separate tenant workload database.
            - name: DATABASE_APP_DEFAULT_DIALECT
              value: {{ $.Values.database.dialect | quote }}
            - name: DATABASE_APP_DEFAULT_HOST
              value: {{ $platformDb.host | quote }}
            - name: DATABASE_APP_DEFAULT_PORT
              value: {{ $platformDb.port | quote }}
            - name: DATABASE_APP_DEFAULT_DATABASE
              value: {{ $platformDb.name | quote }}
            - name: DATABASE_APP_DEFAULT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $platformDb.existingSecret }}
                  key: {{ $platformDb.usernameKey }}
            - name: DATABASE_APP_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $platformDb.existingSecret }}
                  key: {{ $platformDb.passwordKey }}
            - name: DATABASE_APP_TENANT_MIGRATOR_DIALECT
              value: {{ $.Values.database.dialect | quote }}
            - name: DATABASE_APP_TENANT_MIGRATOR_HOST
              value: {{ $tenantDb.host | quote }}
            - name: DATABASE_APP_TENANT_MIGRATOR_PORT
              value: {{ $tenantDb.port | quote }}
            - name: DATABASE_APP_TENANT_MIGRATOR_DATABASE
              value: {{ $tenantDb.name | quote }}
            - name: DATABASE_APP_TENANT_MIGRATOR_ISOLATION
              value: "shared"
            - name: DATABASE_APP_TENANT_MIGRATOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.usernameKey }}
            - name: DATABASE_APP_TENANT_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.passwordKey }}
            - name: DATABASE_TENANTS_DEFAULT_DIALECT
              value: {{ $.Values.database.dialect | quote }}
            - name: DATABASE_TENANTS_DEFAULT_HOST
              value: {{ $tenantDb.host | quote }}
            - name: DATABASE_TENANTS_DEFAULT_PORT
              value: {{ $tenantDb.port | quote }}
            - name: DATABASE_TENANTS_DEFAULT_DATABASE
              value: {{ $tenantDb.name | quote }}
            - name: DATABASE_TENANTS_DEFAULT_ISOLATION
              value: {{ $tenantDb.isolation | quote }}
            - name: DATABASE_TENANTS_DEFAULT_SCHEMA_PATTERN
              value: {{ $tenantDb.schemaPattern | quote }}
            - name: DATABASE_TENANTS_DEFAULT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.usernameKey }}
            - name: DATABASE_TENANTS_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.passwordKey }}
            - name: EDK_TENANT_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.usernameKey }}
            - name: EDK_TENANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.passwordKey }}
            # Platform database credentials for the platform tenant datasource overlay,
            # resolved by the database.tenants override mounted from the platform config.
            - name: EDK_PLATFORM_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $platformDb.existingSecret }}
                  key: {{ $platformDb.usernameKey }}
            - name: EDK_PLATFORM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $platformDb.existingSecret }}
                  key: {{ $platformDb.passwordKey }}
            - name: EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.secretManagement.existingSecret }}
                  key: {{ $.Values.database.secretManagement.adminPasswordKey }}
            - name: EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.secretManagement.existingSecret }}
                  key: {{ $.Values.database.secretManagement.tenantPasswordKey }}
            {{- else }}
            # Tenant workload datasource. Runtime services own tenant workload
            # persistence and never receive platform database credentials.
            - name: DATABASE_TENANTS_DEFAULT_DIALECT
              value: {{ $.Values.database.dialect | quote }}
            - name: DATABASE_TENANTS_DEFAULT_HOST
              value: {{ $tenantDb.host | quote }}
            - name: DATABASE_TENANTS_DEFAULT_PORT
              value: {{ $tenantDb.port | quote }}
            - name: DATABASE_TENANTS_DEFAULT_DATABASE
              value: {{ $tenantDb.name | quote }}
            - name: DATABASE_TENANTS_DEFAULT_ISOLATION
              value: {{ $tenantDb.isolation | quote }}
            - name: DATABASE_TENANTS_DEFAULT_SCHEMA_PATTERN
              value: {{ $tenantDb.schemaPattern | quote }}
            - name: DATABASE_TENANTS_DEFAULT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.usernameKey }}
            - name: DATABASE_TENANTS_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.passwordKey }}
            # Runtime services keep their app-scope datasource on the tenant database,
            # so any app-scope access stays in the tenant data plane. The control-plane
            # platform database is reachable only by the platform service.
            - name: DATABASE_APP_DEFAULT_DIALECT
              value: {{ $.Values.database.dialect | quote }}
            - name: DATABASE_APP_DEFAULT_HOST
              value: {{ $tenantDb.host | quote }}
            - name: DATABASE_APP_DEFAULT_PORT
              value: {{ $tenantDb.port | quote }}
            - name: DATABASE_APP_DEFAULT_DATABASE
              value: {{ $tenantDb.name | quote }}
            - name: DATABASE_APP_DEFAULT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.usernameKey }}
            - name: DATABASE_APP_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.passwordKey }}
            - name: EDK_TENANT_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.usernameKey }}
            - name: EDK_TENANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $tenantDb.existingSecret }}
                  key: {{ $tenantDb.passwordKey }}
            - name: EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.secretManagement.existingSecret }}
                  key: {{ $.Values.database.secretManagement.adminPasswordKey }}
            - name: EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.secretManagement.existingSecret }}
                  key: {{ $.Values.database.secretManagement.tenantPasswordKey }}
            {{- end }}
            {{- end }}
            {{- if and (ne $name "platform") (ne $name "tenant-kms") (ne $name "tenant-as") (ne $name "wallet-unit") (ne $name "wallet-interaction") }}
            - name: TRANSPORT_ROUTING_MODULES_KMS_SERVICE_TOKEN_AUDIENCE
              value: {{ include "edk-enterprise.serviceAudience" "tenant-kms" | quote }}
            - name: TRANSPORT_ROUTING_MODULES_KMS_PREFER_SERVICE_TOKEN_OVER_SESSION_BEARER
              value: "true"
            {{- range $kmsService := list "key" "keys" "signature" "mac" "encryption" "ecdh" }}
            - name: TRANSPORT_ROUTING_MODULES_KMS_SERVICES_{{ $kmsService | upper }}_TARGET
              value: "SERVER"
            - name: TRANSPORT_ROUTING_MODULES_KMS_SERVICES_{{ $kmsService | upper }}_TRANSPORT
              value: "GRPC"
            - name: TRANSPORT_ROUTING_MODULES_KMS_SERVICES_{{ $kmsService | upper }}_ENDPOINT
              value: {{ printf "grpc://%s-tenant-kms:%v" (include "edk-enterprise.fullname" $) $.Values.grpc.port | quote }}
            {{- end }}
            {{- end }}
            {{- if and (or (eq $name "issuer") (eq $name "verifier")) (index $.Values.services "wallet-interaction").enabled }}
            - name: TRANSPORT_ROUTING_MODULES_WALLET_SERVICE_TOKEN_AUDIENCE
              value: {{ include "edk-enterprise.serviceAudience" "wallet-interaction" | quote }}
            - name: TRANSPORT_ROUTING_MODULES_WALLET_PREFER_SERVICE_TOKEN_OVER_SESSION_BEARER
              value: "true"
            - name: WALLET_INTERACTION_GRPC_ENDPOINT
              value: {{ printf "grpc://%s-wallet-interaction:%v" (include "edk-enterprise.fullname" $) $.Values.grpc.port | quote }}
            {{- end }}
            {{- if eq $name "wallet-interaction" }}
            - name: TRANSPORT_ROUTING_MODULES_WALLET_SERVICE_TOKEN_AUDIENCE
              value: {{ include "edk-enterprise.serviceAudience" "wallet-unit" | quote }}
            - name: TRANSPORT_ROUTING_MODULES_WALLET_PREFER_SERVICE_TOKEN_OVER_SESSION_BEARER
              value: "true"
            - name: WALLET_UNIT_GRPC_ENDPOINT
              value: {{ printf "grpc://%s-wallet-unit:%v" (include "edk-enterprise.fullname" $) $.Values.grpc.port | quote }}
            {{- end }}
            {{- if ne $name "platform" }}
            {{- /* The satellites route the platform and application command modules to the
                   platform over gRPC: the platform exposes the binary command transport on
                   its gRPC receiver, which carries the config reads and the license-state
                   projection (application.license.get-effective) each satellite fails closed
                   without. */}}
            - name: TRANSPORT_ROUTING_MODULES_PLATFORM_TARGET
              value: "SERVER"
            - name: TRANSPORT_ROUTING_MODULES_PLATFORM_TRANSPORT
              value: "GRPC"
            - name: TRANSPORT_ROUTING_MODULES_PLATFORM_ENDPOINT
              value: {{ printf "grpc://%s-platform:%v" (include "edk-enterprise.fullname" $) $.Values.grpc.port | quote }}
            - name: TRANSPORT_ROUTING_MODULES_PLATFORM_SERVICES_CONFIG_TARGET
              value: "SERVER"
            - name: TRANSPORT_ROUTING_MODULES_PLATFORM_SERVICES_CONFIG_TRANSPORT
              value: "GRPC"
            - name: TRANSPORT_ROUTING_MODULES_PLATFORM_SERVICES_CONFIG_ENDPOINT
              value: {{ printf "grpc://%s-platform:%v" (include "edk-enterprise.fullname" $) $.Values.grpc.port | quote }}
            # Satellites never read tenant routing/public-endpoint metadata from
            # a local tenant DB. They resolve it through the platform service so
            # anonymous public Host routes work across namespaces/clusters.
            - name: TENANT_RESOLUTION_REMOTE
              value: "true"
            - name: TRANSPORT_ROUTING_MODULES_APPLICATION_TARGET
              value: "SERVER"
            - name: TRANSPORT_ROUTING_MODULES_APPLICATION_TRANSPORT
              value: "GRPC"
            - name: TRANSPORT_ROUTING_MODULES_APPLICATION_ENDPOINT
              value: {{ printf "grpc://%s-platform:%v" (include "edk-enterprise.fullname" $) $.Values.grpc.port | quote }}
            {{- end }}
            {{- if eq $name "platform" }}
            {{- /* Break-glass operator credential for the first-boot owner. Supplied
                   only when platform.bootstrap.ownerInitialCredential is set; the value
                   resolves from the same secret as the keystore password by convention,
                   or set platform.bootstrap.ownerInitialCredential to a literal. */}}
            {{- if and $.Values.platform.bootstrap.automatic $.Values.platform.bootstrap.ownerInitialCredential }}
            - name: EDK_OWNER_INITIAL_CREDENTIAL
              value: {{ $.Values.platform.bootstrap.ownerInitialCredential | quote }}
            {{- end }}
            # The platform is the local licensing authority and is exempt from the
            # deployment license gate.
            - name: LICENSE_DEPLOYMENT_ROLE
              value: "platform"
            - name: LICENSE_COMMAND_ENFORCEMENT_ENABLED
              value: {{ $.Values.license.commandEnforcement.enabled | quote }}
            - name: LICENSE_COMMAND_ENFORCEMENT_MISSING_DESCRIPTOR_MODE
              value: {{ $.Values.license.commandEnforcement.missingDescriptorMode | quote }}
            - name: KMS_ENTERPRISE_LIFECYCLE_ENABLED
              value: {{ $.Values.kmsLifecycle.enabled | quote }}
            - name: KMS_ENTERPRISE_LIFECYCLE_INTERVAL
              value: {{ $.Values.kmsLifecycle.interval | quote }}
            - name: KMS_ENTERPRISE_LIFECYCLE_RUN_ON_STARTUP
              value: {{ $.Values.kmsLifecycle.runOnStartup | quote }}
            {{- else }}
            # Non-platform services declare their service role and validate the protected
            # license bundle. LICENSE_INSTALLATION_ID is an optional explicit pin; leave
            # empty for first-run setup so the verified bundle supplies the installation id.
            {{- if $.Values.license.installationId }}
            - name: LICENSE_INSTALLATION_ID
              value: {{ $.Values.license.installationId | quote }}
            {{- end }}
            - name: LICENSE_GATE_SERVICE_ROLE
              value: {{ index $.Values.license.serviceRoles $name | quote }}
            - name: LICENSE_COMMAND_ENFORCEMENT_ENABLED
              value: {{ $.Values.license.commandEnforcement.enabled | quote }}
            - name: LICENSE_COMMAND_ENFORCEMENT_MISSING_DESCRIPTOR_MODE
              value: {{ $.Values.license.commandEnforcement.missingDescriptorMode | quote }}
            {{- /* East-west service identity. Each satellite mints a platform-issued
                   client_credentials service token and attaches it to its command-transport
                   calls to the platform (config reads + license-state projection) and to
                   its KMS hop. The platform AS issues the token; the satellite authenticates
                   as its per-service confidential client with the shared internal secret.
                   The token endpoint is the platform authority bootstrap Service: satellites must
                   mint their identity while the platform is deliberately unready during its boot
                   ceremony, and the regular Service excludes not-ready endpoints. */}}
            {{- if $.Values.serviceIdentity.internalClientExistingSecret }}
            - name: SERVER_SERVICE_IDENTITY_TOKEN_ENDPOINT
              value: {{ printf "http://%s-platform-authority-bootstrap:%v/token" (include "edk-enterprise.fullname" $) (index $.Values.services "platform").restPort | quote }}
            - name: SERVER_SERVICE_IDENTITY_CLIENT_ID
              value: {{ index $.Values.serviceIdentity.clientIds $name | quote }}
            {{- /* Once tenant configuration is active, select the tenant-scoped
                   confidential client registered for this workload. Without this
                   role the bootstrap client remains in use and its token carries
                   tenant_id=platform, so tenant KMS routing fails closed. */}}
            {{- $activeAsClientRoles := dict "tenant-kms" "kms" "tenant-as" "authorization-server" "did" "did" "blob" "blob" "issuer" "issuer" "verifier" "verifier" "wallet-unit" "wallet-unit" "wallet-interaction" "wallet-interaction" }}
            - name: SERVER_SERVICE_IDENTITY_ACTIVE_AS_CLIENT_ROLE
              value: {{ index $activeAsClientRoles $name | quote }}
            - name: SERVER_SERVICE_IDENTITY_AUDIENCE
              value: {{ include "edk-enterprise.serviceAudience" "platform" | quote }}
            - name: SERVER_SERVICE_IDENTITY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.serviceIdentity.internalClientExistingSecret }}
                  key: {{ $.Values.serviceIdentity.internalClientSecretKey }}
            {{- /* Local workload label used to select the satellite credential. The platform
                   workload-trust-policy binds it to the client id in the validated JWT. */}}
            - name: SPHEREON_SERVICE_ID
              value: {{ index $.Values.serviceIdentity.serviceIds $name | quote }}
            {{- end }}
            {{- if eq $name "tenant-as" }}
            # The tenant-AS opens a long-lived remote platform-config gRPC channel.
            # Wait for a Health SERVING response in the process before exposing its
            # HTTP listener; its init container's TCP check alone is not sufficient.
            - name: PLATFORM_GRPC_HOST
              value: {{ include "edk-enterprise.serviceName" (dict "root" $ "name" "platform") | quote }}
            - name: PLATFORM_GRPC_PORT
              value: {{ $.Values.grpc.port | quote }}
            {{- end }}
            {{- /* In-network surfaces the strict-auth gate admits without an operator bearer.
                   The tenant-AS signing-key provisioning endpoint is intentionally omitted:
                   tenant resolution must validate the platform-issued bearer and use its
                   tenant_id claim before the tenant's public host is active. The in-network
                   command/introspection surfaces carry their own service-token validation,
                   and OAuth protocol surfaces stay open by design. */}}
            {{- $anon := index $.Values.serviceIdentity.anonymousPathPrefixes $name }}
            {{- if $anon }}
            - name: SERVER_REST_AUTH_ANONYMOUS_PATH_PREFIXES
              value: {{ $anon | quote }}
            {{- end }}
            {{- /* Trust anchor for the platform authorization server. Satellites validate
                   platform-issued bearers on east-west calls against this token issuer and
                   fetch its JWKS in-cluster. The issuer must equal the platform AS token `iss`
                   (its external base URL); the JWKS URI is the in-cluster authority bootstrap
                   Service, reachable across the platform boot ceremony like the token endpoint. */}}
            - name: SERVER_REST_AUTH_PLATFORM_ISSUER
              value: {{ $.Values.platform.externalBaseUrl | quote }}
            - name: SERVER_REST_AUTH_PLATFORM_JWKS_URI
              value: {{ printf "http://%s-platform-authority-bootstrap:%v/.well-known/jwks.json" (include "edk-enterprise.fullname" $) (index $.Values.services "platform").restPort | quote }}
            {{- $restAudience := include "edk-enterprise.serviceAudience" $name }}
            {{- if $restAudience }}
            - name: SERVER_REST_AUTH_EXPECTED_AUDIENCE
              value: {{ $restAudience | quote }}
            {{- end }}
            {{- /* Tenant AS issuers are dynamic. The platform writes
                   OAUTH2_AUTHORIZATION_SERVER public endpoint bindings during
                   tenant onboarding, and workloads trust tokens only when the
                   issuer maps to an active binding. This includes tenant-AS:
                   issuer/verifier service clients call its Trust Domain API
                   with tenant-issued tokens. */}}
            - name: SERVER_REST_AUTH_TRUST_TENANT_REGISTRY_ISSUERS
              value: "true"
            {{- end }}
            {{- end }}
            {{- if $isAdminConsole }}
            - name: ADMIN_CONSOLE_MODE
              value: {{ eq $name "admin-console" | ternary "PLATFORM" "TENANT" | quote }}
            - name: ADMIN_CONSOLE_PLATFORM_BASE_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "platform")) (index $.Values.services "platform").restPort | quote }}
            {{- if eq $name "admin-console-tenant" }}
            - name: ADMIN_CONSOLE_TENANT_CONTEXT_URL
              value: {{ printf "http://%s:%v/api/platform/bootstrap/v1/admin-console-context" (include "edk-enterprise.serviceName" (dict "root" $ "name" "platform")) (index $.Values.services "platform").restPort | quote }}
            {{- end }}
            {{- if $isBusinessWallet }}
            - name: BUSINESS_WALLET_BOOTSTRAP_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "platform")) (index $.Values.services "platform").restPort | quote }}
            - name: BUSINESS_WALLET_TRUSTED_INGRESS_MODE
              value: {{ $.Values.portalBff.trustedIngress.mode | quote }}
            - name: BUSINESS_WALLET_TRUSTED_INGRESS_HOPS
              value: {{ $.Values.portalBff.trustedIngress.hops | quote }}
            - name: BUSINESS_WALLET_COOKIE_SECURE
              value: "true"
            {{- end }}
            {{- if eq $name "admin-console" }}
            - name: ADMIN_CONSOLE_PUBLIC_ORIGIN
              value: {{ $.Values.platform.externalBaseUrl | quote }}
            {{- end }}
            - name: ADMIN_CONSOLE_TRUSTED_INGRESS_MODE
              value: {{ $.Values.portalBff.trustedIngress.mode | quote }}
            - name: ADMIN_CONSOLE_TRUSTED_INGRESS_HOPS
              value: {{ $.Values.portalBff.trustedIngress.hops | quote }}
            - name: ADMIN_CONSOLE_BFF_OAUTH_TRUSTED_INTERNAL_HTTP_ORIGINS
              value: {{ if eq $name "admin-console" }}{{ printf "http://%s:%v,http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "platform")) (index $.Values.services "platform").restPort (include "edk-enterprise.serviceName" (dict "root" $ "name" "blob")) (index $.Values.services "blob").restPort | quote }}{{ else }}{{ printf "http://%s:%v,http://%s:%v,http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "platform")) (index $.Values.services "platform").restPort (include "edk-enterprise.serviceName" (dict "root" $ "name" "tenant-as")) (index $.Values.services "tenant-as").restPort (include "edk-enterprise.serviceName" (dict "root" $ "name" "blob")) (index $.Values.services "blob").restPort | quote }}{{ end }}
            {{- if eq $name "admin-console" }}
            - name: ADMIN_CONSOLE_WORKLOAD_CLIENT_ID
              value: {{ $.Values.portalBff.clientId | quote }}
            - name: ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.portalBff.existingSecret }}
                  key: {{ $.Values.portalBff.clientSecretKey }}
            - name: ADMIN_CONSOLE_AUDIT_BASE_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "platform")) (index $.Values.services "platform").restPort | quote }}
            {{- end }}
            - name: ADMIN_CONSOLE_THEME_BASE_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "blob")) (index $.Values.services "blob").restPort | quote }}
            - name: ADMIN_CONSOLE_TENANT_KMS_BASE_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "tenant-kms")) (index $.Values.services "tenant-kms").restPort | quote }}
            - name: ADMIN_CONSOLE_TENANT_DID_BASE_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "did")) (index $.Values.services "did").restPort | quote }}
            - name: ADMIN_CONSOLE_TENANT_AS_BASE_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "tenant-as")) (index $.Values.services "tenant-as").restPort | quote }}
            - name: ADMIN_CONSOLE_IDENTITY_BASE_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "tenant-as")) (index $.Values.services "tenant-as").restPort | quote }}
            - name: ADMIN_CONSOLE_ISSUER_BASE_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "issuer")) (index $.Values.services "issuer").restPort | quote }}
            - name: ADMIN_CONSOLE_VERIFIER_BASE_URL
              value: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" $ "name" "verifier")) (index $.Values.services "verifier").restPort | quote }}
            {{- if eq $name "admin-console" }}
            - name: NEXT_PUBLIC_PLATFORM_AUDIENCE
              value: {{ include "edk-enterprise.serviceAudience" "platform" | quote }}
            {{- end }}
            - name: NEXT_PUBLIC_THEME_AUDIENCE
              value: {{ include "edk-enterprise.serviceAudience" "blob" | quote }}
            - name: NEXT_PUBLIC_TENANT_DID_AUDIENCE
              value: {{ include "edk-enterprise.serviceAudience" "did" | quote }}
            - name: NEXT_PUBLIC_TENANT_ISSUER_AUDIENCE
              value: {{ include "edk-enterprise.serviceAudience" "issuer" | quote }}
            - name: NEXT_PUBLIC_TENANT_VERIFIER_AUDIENCE
              value: {{ include "edk-enterprise.serviceAudience" "verifier" | quote }}
            {{- end }}
            {{- range $env := $svc.env }}
            {{- if not (and (eq $name "platform") (has (get $env "name") (list "EXTERNAL_BASE_URL" "ONBOARDING_UI_BASE_URL"))) }}
            {{- toYaml (list $env) | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- $probePath := $isAdminConsole | ternary "/admin-console/health" "/health" }}
          {{- if and $.Values.grpc.enabled $grpcReceiver }}
          # The REST listener becomes healthy before the native process starts its
          # gRPC command server. Keep the pod out of Service endpoints until the
          # command port is actually listening.
          #
          # The platform serves its command port first and only opens REST after the
          # database migrations finish, so its startup budget has to cover a real
          # migration rather than a process launch. Liveness only begins once this
          # probe succeeds, which keeps the migration window from being killed.
          startupProbe:
            {{- if eq $name "platform" }}
            httpGet:
              path: {{ $probePath }}
              port: rest
            periodSeconds: 5
            failureThreshold: 180
            {{- else }}
            tcpSocket:
              port: grpc
            periodSeconds: 1
            failureThreshold: 60
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $probePath }}
              port: rest
            initialDelaySeconds: 20
            periodSeconds: 20
          # Deliberately /health, not /ready: /ready is gated on the platform's boot ceremony,
          # and that ceremony calls satellites whose init gate waits for the platform Service to
          # have a ready endpoint. Pointing readiness at /ready deadlocks the two. Flipping it
          # requires those init gates to dial the bootstrap authority Service first, which
          # publishes not-ready addresses.
          readinessProbe:
            httpGet:
              path: {{ $probePath }}
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if not $isFrontend }}
            - name: secret-authority
              mountPath: /app/secret-authority
              readOnly: true
            {{- end }}
            {{- if and (eq $name "platform") $.Values.database.enabled }}
            # The system platform tenant is control-plane state. This overlay binds its
            # datasource to the platform database while customer tenant workload state
            # remains in the separate tenant workload database. It merges on top of the
            # environment configuration as the active-profile config file.
            - name: platform-db-override
              mountPath: /app/config/application.yml
              subPath: application.yml
              readOnly: true
            {{- end }}
            {{- if and (eq $name "platform") $.Values.secretManagement.kubernetesMount.enabled }}
            - name: secret-management-kubernetes-values
              mountPath: /app/secret-management/kubernetes-mount/values
              readOnly: true
            - name: secret-management-kubernetes-manifest
              mountPath: /app/secret-management/kubernetes-mount/kubernetes-mount.manifest
              subPath: kubernetes-mount.manifest
              readOnly: true
            {{- end }}
            {{- if and (eq $name "platform") $.Values.portalBff.existingSecret }}
            - name: secret-management-environment-manifest
              mountPath: /app/secret-management/deployment/environment.manifest
              subPath: environment.manifest
              readOnly: true
            {{- end }}
            {{- if and (eq $name "platform") $.Values.secretManagement.egress.privateEndpointAllowlist }}
            - name: secret-management-private-endpoints
              mountPath: /app/secret-management/egress/private-endpoints.manifest
              subPath: private-endpoints.manifest
              readOnly: true
            {{- end }}
            {{- if eq $name "tenant-as" }}
            # The tenant AS base configuration: the local keyless verify provider,
            # KMS role algorithms, and the gRPC KMS routing with a LOCAL verify route.
            - name: tenant-as-config
              mountPath: /app/config/application.yml
              subPath: application.yml
              readOnly: true
            {{- end }}
            {{- if eq $name "tenant-kms" }}
            # The tenant KMS base configuration: the trust policy for east-west
            # callers (incl. the tenant AS signing-key seed) and the software provider.
            - name: tenant-kms-config
              mountPath: /app/config/application.yml
              subPath: application.yml
              readOnly: true
            {{- end }}
            {{- if or (eq $name "did") (eq $name "blob") (eq $name "issuer") (eq $name "verifier") (eq $name "wallet-unit") (eq $name "wallet-interaction") }}
            # Service-specific routing, persistence and trust policy. This is a
            # subPath mount, so it REPLACES the image's baked
            # /app/config/application.yml rather than merging with it. Every key
            # the baked file supplies must therefore be reproduced here or
            # rendered as an environment variable (see SERVER_REST_AUTH_ENABLED,
            # PORT/REST_PORT and GRPC_ENABLED/GRPC_PORT above).
            - name: runtime-service-config
              mountPath: /app/config/application.yml
              subPath: application.yml
              readOnly: true
            {{- end }}
            {{- if and (eq $name "platform") $.Values.platformKeystore.enabled }}
            # The platform keystore holds the platform AS cert/user and the
            # license-request instance cert. Mounted only in the platform service.
            - name: keystore
              mountPath: /keystore
            {{- end }}
            {{- if and (eq $name "tenant-kms") $.Values.tenantKmsKeystore.enabled }}
            # The tenant-kms keystore holds per-tenant software KMS key material.
            # Mounted only in the tenant-kms service. The route-only services
            # (issuer/verifier/did/tenant-as) route KMS here and mount no keystore.
            - name: keystore
              mountPath: /keystore
            {{- end }}
            {{- if and (eq $name "wallet-interaction") $.Values.walletInteractionKeystore.enabled }}
            # The wallet-interaction keystore holds server-side headless wallet
            # proof material. Mobile/IDK wallet apps do not use this VDX volume.
            - name: wallet-interaction-keystore
              mountPath: /keystore
            {{- end }}
            {{- if and (eq $name "blob") $.Values.blobPersistence.enabled }}
            - name: blob-store
              mountPath: /app/blobs
            {{- end }}
            {{- if eq $name "platform" }}
            {{- /* License state is writable: the setup API writes the imported bundle's
                   root CA to license.trust.rootCaPath here, so the platform trusts the
                   installed license. Its parent directory is this volume. */}}
            - name: license-state
              mountPath: {{ dir $.Values.license.trust.rootCaPath | quote }}
            {{- end }}
            {{- if and (not $isFrontend) (ne $name "platform") $.Values.license.trust.existingSecret }}
            {{- /* Satellites only READ the license root CA (their config points at this
                   path); the platform writes its own copy into the writable license-state
                   volume above. The installed license chains to this root. */}}
            - name: license-root-ca
              mountPath: /app/config/license-root-ca.pem
              subPath: license-root-ca.pem
              readOnly: true
            {{- end }}
            {{- with $svc.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not $isFrontend }}
        - name: secret-authority
          secret:
            secretName: {{ $secretAuthoritySecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ $.Values.secretAuthority.keys.satelliteAssertionPrivateKey | quote }}
                path: workload/assertion.pem
              - key: {{ $.Values.secretAuthority.keys.centralPermitPublicKey | quote }}
                path: public/central-permit.pub.pem
              {{- if eq $name "platform" }}
              - key: {{ $.Values.secretAuthority.keys.centralPermitPrivateKey | quote }}
                path: central/permit-signing.pem
              {{- range $workloadId, $key := $.Values.secretAuthority.keys.assertionPublicKeys }}
              - key: {{ $key | quote }}
                path: {{ printf "public/%s-assertion.pub.pem" $workloadId | quote }}
              {{- end }}
              {{- end }}
        {{- end }}
        {{- if eq $name "platform" }}
        - name: license-state
          emptyDir: {}
        {{- end }}
        {{- if eq $name "tenant-as" }}
        - name: tenant-as-config
          configMap:
            name: {{ include "edk-enterprise.fullname" $ }}-tenant-as-config
        {{- end }}
        {{- if eq $name "tenant-kms" }}
        - name: tenant-kms-config
          configMap:
            name: {{ include "edk-enterprise.fullname" $ }}-tenant-kms-config
        {{- end }}
        {{- if or (eq $name "did") (eq $name "blob") (eq $name "issuer") (eq $name "verifier") (eq $name "wallet-unit") (eq $name "wallet-interaction") }}
        - name: runtime-service-config
          configMap:
            name: {{ include "edk-enterprise.fullname" $ }}-{{ $name }}-config
        {{- end }}
        {{- if and (not $isFrontend) $.Values.license.trust.existingSecret }}
        - name: license-root-ca
          secret:
            secretName: {{ $.Values.license.trust.existingSecret }}
            items:
              - key: {{ $.Values.license.trust.rootCaKey }}
                path: license-root-ca.pem
        {{- end }}
        {{- if and (eq $name "platform") $.Values.database.enabled }}
        - name: platform-db-override
          configMap:
            name: {{ include "edk-enterprise.fullname" $ }}-platform-db-override
        {{- end }}
        {{- if and (eq $name "platform") $.Values.secretManagement.kubernetesMount.enabled }}
        - name: secret-management-kubernetes-values
          secret:
            secretName: {{ $.Values.secretManagement.kubernetesMount.existingSecret | quote }}
        - name: secret-management-kubernetes-manifest
          configMap:
            name: {{ include "edk-enterprise.fullname" $ }}-secret-management-manifests
            items:
              - key: kubernetes-mount.manifest
                path: kubernetes-mount.manifest
        {{- end }}
        {{- if and (eq $name "platform") $.Values.portalBff.existingSecret }}
        - name: secret-management-environment-manifest
          configMap:
            name: {{ include "edk-enterprise.fullname" $ }}-secret-management-manifests
            items:
              - key: environment.manifest
                path: environment.manifest
        {{- end }}
        {{- if and (eq $name "platform") $.Values.secretManagement.egress.privateEndpointAllowlist }}
        - name: secret-management-private-endpoints
          configMap:
            name: {{ include "edk-enterprise.fullname" $ }}-secret-management-manifests
            items:
              - key: private-endpoints.manifest
                path: private-endpoints.manifest
        {{- end }}
        {{- if and (eq $name "platform") $.Values.platformKeystore.enabled }}
        - name: keystore
          persistentVolumeClaim:
            claimName: {{ $.Values.platformKeystore.existingClaim | default (printf "%s-platform-keystore" (include "edk-enterprise.fullname" $)) }}
        {{- end }}
        {{- if and (eq $name "tenant-kms") $.Values.tenantKmsKeystore.enabled }}
        - name: keystore
          persistentVolumeClaim:
            claimName: {{ $.Values.tenantKmsKeystore.existingClaim | default (printf "%s-tenant-kms-keystore" (include "edk-enterprise.fullname" $)) }}
        {{- end }}
        {{- if and (eq $name "wallet-interaction") $.Values.walletInteractionKeystore.enabled }}
        - name: wallet-interaction-keystore
          persistentVolumeClaim:
            claimName: {{ $.Values.walletInteractionKeystore.existingClaim | default (printf "%s-wallet-interaction-keystore" (include "edk-enterprise.fullname" $)) }}
        {{- end }}
        {{- if and (eq $name "blob") $.Values.blobPersistence.enabled }}
        - name: blob-store
          persistentVolumeClaim:
            claimName: {{ $.Values.blobPersistence.existingClaim | default (printf "%s-blob-store" (include "edk-enterprise.fullname" $)) }}
        {{- end }}
        {{- with $svc.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
