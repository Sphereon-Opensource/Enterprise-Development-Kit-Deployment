{{- if eq (include "edk-enterprise.topologyMode" .) "distributed" }}
{{- /*
Platform active-profile configuration overlay.

The platform service reads this file as its container-profile overlay
(application-container.yml). It merges on top of the image's baked-in
configuration and the environment configuration, supplying the keys an
environment variable name cannot express, including the platform tenant
datasource and the hyphenated control-plane bootstrap keys.

Two concerns live here:

  1. Platform tenant datasource - the system platform tenant is control-plane
     state and is bound to the platform database. Customer tenant workload state
     stays in the separate tenant workload database. Credentials resolve from
     the platform database Secret through the EDK_PLATFORM_DB_* values injected
     into the platform container.

  2. Control-plane bootstrap — the platform provisions its `platform` tenant,
     hosted authorization server, and operator owner on first boot. These inputs
     are hyphenated keys, so they are supplied here rather than as environment
     variables. The license root-CA trust anchor path is set here too so the
     platform trusts the installed license bundle.

Rendered only for the platform service.
*/ -}}
{{- if .Values.database.enabled }}
{{- $platformDb := .Values.database.platform }}
{{- $tenantDb := .Values.database.tenant }}
{{- $bootstrap := .Values.platform.bootstrap }}
{{- $licenseTrust := .Values.license.trust }}
{{- $secretBootstrapActors := .Values.secretManagement.internalResolution.allowedServiceActors }}
{{- if (index .Values.services "wallet-unit").enabled }}
{{- $secretBootstrapActors = append $secretBootstrapActors (index .Values.serviceIdentity.clientIds "wallet-unit") }}
{{- end }}
{{- if (index .Values.services "wallet-interaction").enabled }}
{{- $secretBootstrapActors = append $secretBootstrapActors (index .Values.serviceIdentity.clientIds "wallet-interaction") }}
{{- end }}
{{- $secretWorkloadActorIds := list }}
{{- range $service, $clientId := .Values.serviceIdentity.clientIds }}
{{- $workloadId := index $.Values.serviceIdentity.serviceIds $service }}
{{- if and $workloadId (ne $workloadId $clientId) (has $clientId $secretBootstrapActors) }}
{{- $secretWorkloadActorIds = append $secretWorkloadActorIds (printf "%s=%s" $clientId $workloadId) }}
{{- end }}
{{- end }}
{{- if ne $bootstrap.issuer .Values.platform.externalBaseUrl }}
{{- fail "platform.bootstrap.issuer must equal platform.externalBaseUrl; the platform AS issuer has a single canonical public origin" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-platform-db-override
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
data:
  # Delivered as the platform's base application.yml. The image bakes no
  # application.yml, so this is the platform's authoritative file configuration;
  # it merges over the environment configuration and supplies the keys an
  # environment variable name cannot express (the platform tenant datasource
  # and the hyphenated control-plane bootstrap keys).
  application.yml: |
{{ include "edk-enterprise.secretAuthorityPlatformConfig" . | indent 4 }}
    server:
      rest:
        auth:
          anonymous-path-prefixes: {{ index .Values.serviceIdentity.anonymousPathPrefixes "platform" | quote }}
          # The platform AS stamps tokens with the public issuer, but validates
          # them by fetching JWKS through the in-cluster service. This keeps
          # operator token validation independent from external gateway TLS
          # trust inside the service containers.
          issuer: ${env:EXTERNAL_BASE_URL}
          jwks-uri: {{ printf "http://%s:%v/.well-known/jwks.json" (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) ((index .Values.services "platform").restPort) | quote }}
          # Tenant-scoped platform-config APIs accept only issuers that resolve
          # to an active OAUTH2_AUTHORIZATION_SERVER registry binding.
          trust-tenant-registry-issuers: true
      {{- if and .Values.serviceIdentity.internalClientExistingSecret (index .Values.services "tenant-kms").enabled }}
      service-identity:
        # The platform uses the tenant-bound KMS client registered during
        # onboarding when routed customer KEK commands target tenant-KMS.
        token-endpoint: {{ printf "http://%s:%v/token" (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) ((index .Values.services "platform").restPort) | quote }}
        # The endpoint above is the in-cluster east-west address; the destination
        # preauthorizer approves plain http only on this explicit opt-in.
        token-endpoint-allow-http: true
        token-endpoint-source: configured
        active-as-client-role: kms
        client-id: {{ index .Values.serviceIdentity.clientIds "tenant-kms" | quote }}
        client-secret: {{ include "edk-enterprise.serviceIdentity.clientSecretEnvInterpolation" "tenant-kms" }}
        tenant-bound-client-id: true
        audience: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "platform") | quote }}
        # Routed KMS commands address the tenant-KMS service, so the minted access token may
        # name it; any audience outside this list is refused before a secret is leased.
        allowed-audiences: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "tenant-kms") | quote }}
      {{- end }}
    cors:
      origins: {{ include "edk-enterprise.browserCorsOrigins" . | quote }}
    account-action:
      # Tokens are appended as a URL fragment and never reach ingress access logs.
      public-base-url: ${env:ONBOARDING_UI_BASE_URL}/admin-console
    database:
      app:
        # Deployment-only owner route. Runtime traffic never uses this pool.
        secret-management-migrator:
          dialect: {{ .Values.database.dialect }}
          isolation: shared
          host: {{ $platformDb.host }}
          port: {{ $platformDb.port }}
          database: {{ $platformDb.name }}
          username: ${env:EDK_PLATFORM_DB_USERNAME}
          password: ${env:EDK_PLATFORM_DB_PASSWORD}
          pool:
            dedicated-pool: true
        secret-management-admin:
          dialect: {{ .Values.database.dialect }}
          isolation: shared
          host: {{ $platformDb.host }}
          port: {{ $platformDb.port }}
          database: {{ $platformDb.name }}
          username: secret_management_admin
          password: ${env:EDK_SECRET_MANAGEMENT_ADMIN_DB_PASSWORD}
          pool:
            dedicated-pool: true
        secret-management-tenant:
          dialect: {{ .Values.database.dialect }}
          isolation: shared
          host: {{ $platformDb.host }}
          port: {{ $platformDb.port }}
          database: {{ $platformDb.name }}
          username: secret_management_tenant_serving
          password: ${env:EDK_SECRET_MANAGEMENT_TENANT_DB_PASSWORD}
          pool:
            dedicated-pool: true
        tenant-migrator:
          dialect: {{ .Values.database.dialect }}
          isolation: shared
          host: {{ $tenantDb.host }}
          port: {{ $tenantDb.port }}
          database: {{ $tenantDb.name }}
          username: ${env:EDK_TENANT_DB_USERNAME}
          password: ${env:EDK_TENANT_DB_PASSWORD}
      tenants:
        # The platform is the sole migration owner for customer tenant schemas.
        default:
          dialect: {{ .Values.database.dialect }}
          isolation: {{ $tenantDb.isolation }}
          host: {{ $tenantDb.host }}
          port: {{ $tenantDb.port }}
          database: {{ $tenantDb.name }}
          username: ${env:EDK_TENANT_DB_USERNAME}
          password: ${env:EDK_TENANT_DB_PASSWORD}
          schema-pattern: {{ $tenantDb.schemaPattern }}
        platform:
          dialect: {{ .Values.database.dialect }}
          isolation: shared
          host: {{ $platformDb.host }}
          port: {{ $platformDb.port }}
          database: {{ $platformDb.name }}
          username: ${env:EDK_PLATFORM_DB_USERNAME}
          password: ${env:EDK_PLATFORM_DB_PASSWORD}
    secret-management:
      egress:
        allowed-https-ports: {{ join "," .Values.secretManagement.egress.allowedHttpsPorts | quote }}
        {{- if .Values.secretManagement.egress.privateEndpointAllowlist }}
        private-allowlist-path: /app/secret-management/egress/private-endpoints.manifest
        {{- end }}
      bootstrap:
        kek:
          mode: {{ .Values.secretManagement.bootstrap.kek.mode | quote }}
          identity: {{ .Values.secretManagement.bootstrap.kek.identity | quote }}
          version: {{ .Values.secretManagement.bootstrap.kek.version }}
          kms-provider-id: {{ .Values.secretManagement.bootstrap.kek.kmsProviderId | quote }}
          idempotency-mac-key: {{ .Values.secretManagement.bootstrap.kek.idempotencyMacKey | quote }}
      authority:
        platform-storage:
          kms-provider-id: {{ .Values.secretManagement.authority.platformStorageKmsProviderId | quote }}
          kms-binding-key: {{ .Values.secretManagement.authority.platformStorageKmsBindingKey | quote }}
        default-tenant-offering:
          kms-provider-id: {{ .Values.secretManagement.authority.defaultTenantOfferingKmsProviderId | quote }}
          kms-binding-template: {{ .Values.secretManagement.authority.defaultTenantOfferingKmsBindingTemplate | quote }}
        tenant-policy:
          allow-tenant-managed-providers: {{ .Values.secretManagement.authority.allowTenantManagedProviders }}
          allow-platform-offerings: {{ .Values.secretManagement.authority.allowPlatformOfferings }}
          retention-days: {{ .Values.secretManagement.authority.retentionDays }}
      internal-resolution:
        expected-audience: {{ .Values.secretManagement.internalResolution.expectedAudience | quote }}
        allowed-service-actors: {{ join "," $secretBootstrapActors | quote }}
        # A system credential is authorized to the workload a satellite attests to, never to its
        # OAuth client principal: transport authentication and secret authority stay independent.
        # Both halves already exist per service, so the platform's mapping is derived from them
        # rather than restated.
        workload-actor-ids: {{ join "," $secretWorkloadActorIds | quote }}
      deployment:
        environment:
          enabled: {{ ne .Values.portalBff.existingSecret "" }}
          {{- if .Values.portalBff.existingSecret }}
          manifest-path: /app/secret-management/deployment/environment.manifest
          manifest-sha256: "sha256:ad0ecf8dfd8fb6d55280e4a32438de20961499ee0eb833d047af34dc603ca30e"
          {{- end }}
        kubernetes-mount:
          enabled: {{ .Values.secretManagement.kubernetesMount.enabled }}
          {{- if .Values.secretManagement.kubernetesMount.enabled }}
          root-path: /app/secret-management/kubernetes-mount/values
          manifest-path: /app/secret-management/kubernetes-mount/kubernetes-mount.manifest
          manifest-sha256: {{ .Values.secretManagement.kubernetesMount.manifestSha256 | quote }}
          {{- end }}
    # Trust domains are stored by the platform, while identity identifiers
    # live in the tenant-AS database. Resolve anchor identifiers through the
    # authenticated tenant identity-manager API in this split Helm topology.
    trust-domain:
      identifier-source:
        mode: rest
      identifier-source-rest:
        internal-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "tenant-as")) ((index .Values.services "tenant-as").restPort) | quote }}
        {{- if and .Values.serviceIdentity.internalClientExistingSecret (index .Values.services "tenant-as").enabled }}
        # A closed token profile selects these server-authored coordinates; the opaque tenant-bound
        # client secret is resolved by the secret broker and is never rendered into this ConfigMap.
        service-identity:
          token-endpoint: {{ printf "http://%s:%v/token" (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) ((index .Values.services "platform").restPort) | quote }}
          token-endpoint-allow-http: true
          client-id: {{ index .Values.serviceIdentity.clientIds "trust-domain-identifier" | quote }}
          tenant-bound-client-id: true
          audience: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "tenant-as") | quote }}
        {{- end }}
    kv-stores:
      # Email catalog templates share one durable platform store. The catalog
      # namespaces per-tenant published state inside it using the resolved tenant id.
      vdx.template:
        type: database
        scope-binding: APP
    # Control-plane bootstrap inputs for the `platform` tenant, its hosted
    # authorization server, and the operator owner. The platform provisions
    # these on first boot and the steps are idempotent across restarts.
    application:
      bff:
        oauth-client:
          workload-audience: {{ .Values.portalBff.audience | quote }}
          workload-scope: {{ .Values.portalBff.scope | quote }}
          workload-client-id: {{ .Values.portalBff.clientId | quote }}
          kms:
            provider-id: {{ .Values.portalBff.kms.providerId | quote }}
            encryption-key-id: {{ .Values.portalBff.kms.encryptionKeyAlias | quote }}
            handle-hmac-key-id: {{ .Values.portalBff.kms.handleHmacKeyAlias | quote }}
      tenant:
        # Canonical control-plane identity used by platform-admin secret transitions.
        id: "platform"
        hosted-as:
          issuer: {{ $bootstrap.issuer | quote }}
        owner:
          {{- if $bootstrap.automatic }}
          email: {{ required "platform.bootstrap.owner.email is required when platform.bootstrap.automatic=true" $bootstrap.owner.email | quote }}
          display-name: {{ required "platform.bootstrap.owner.displayName is required when platform.bootstrap.automatic=true" $bootstrap.owner.displayName | quote }}
          {{- end }}
          {{- with $bootstrap.owner.roles }}
          roles: {{ . | quote }}
          {{- end }}
    # The platform hosts its own authorization server for operator sign-in and
    # the operator->tenant token exchange the admin console drives.
    oauth2:
      user-provider:
        mode: {{ $bootstrap.userProviderMode | quote }}
      servers:
        default:
          mode: HOSTED
          signing-key:
            auto-generate: true
          issuer: ${env:EXTERNAL_BASE_URL}
          oidc: SUPPORTED
          logout: SUPPORTED
          pkce: REQUIRED
{{ include "edk-enterprise.platformWebAuthnConfig" . | indent 10 }}
          par: SUPPORTED
          token-format: JWT
          scopes-supported: "openid,profile,email"
          grant-types-enabled: "authorization_code,urn:ietf:params:oauth:grant-type:pre-authorized_code,client_credentials,refresh_token,urn:ietf:params:oauth:grant-type:token-exchange"
          public-clients:
            allow-any: true
            permissive-redirect-uri: true
          {{- if .Values.serviceIdentity.internalClientExistingSecret }}
          internal-clients:
            issuer:
              client-id: {{ index .Values.serviceIdentity.clientIds "issuer" | quote }}
              client-secret: {{ include "edk-enterprise.serviceIdentity.clientSecretEnvInterpolation" "issuer" }}
              grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
              default-access-token-audience: {{ include "edk-enterprise.serviceIdentity.defaultStsAudience" (dict "root" . "role" "issuer") | quote }}
              allowed-access-token-audiences: {{ include "edk-enterprise.serviceIdentity.extraStsAudiencesCsv" (dict "root" . "role" "issuer") | quote }}
            kms:
              client-id: {{ index .Values.serviceIdentity.clientIds "tenant-kms" | quote }}
              client-secret: {{ include "edk-enterprise.serviceIdentity.clientSecretEnvInterpolation" "tenant-kms" }}
              grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
              default-access-token-audience: {{ include "edk-enterprise.serviceIdentity.defaultStsAudience" (dict "root" . "role" "tenant-kms") | quote }}
              allowed-access-token-audiences: {{ include "edk-enterprise.serviceIdentity.extraStsAudiencesCsv" (dict "root" . "role" "tenant-kms") | quote }}
            did:
              client-id: {{ index .Values.serviceIdentity.clientIds "did" | quote }}
              client-secret: {{ include "edk-enterprise.serviceIdentity.clientSecretEnvInterpolation" "did" }}
              grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
              default-access-token-audience: {{ include "edk-enterprise.serviceIdentity.defaultStsAudience" (dict "root" . "role" "did") | quote }}
              allowed-access-token-audiences: {{ include "edk-enterprise.serviceIdentity.extraStsAudiencesCsv" (dict "root" . "role" "did") | quote }}
            {{- if (index .Values.services "blob").enabled }}
            blob:
              client-id: {{ index .Values.serviceIdentity.clientIds "blob" | quote }}
              client-secret: {{ include "edk-enterprise.serviceIdentity.clientSecretEnvInterpolation" "blob" }}
              grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
              default-access-token-audience: {{ include "edk-enterprise.serviceIdentity.defaultStsAudience" (dict "root" . "role" "blob") | quote }}
              allowed-access-token-audiences: {{ include "edk-enterprise.serviceIdentity.extraStsAudiencesCsv" (dict "root" . "role" "blob") | quote }}
            {{- end }}
            verifier:
              client-id: {{ index .Values.serviceIdentity.clientIds "verifier" | quote }}
              client-secret: {{ include "edk-enterprise.serviceIdentity.clientSecretEnvInterpolation" "verifier" }}
              grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
              default-access-token-audience: {{ include "edk-enterprise.serviceIdentity.defaultStsAudience" (dict "root" . "role" "verifier") | quote }}
              allowed-access-token-audiences: {{ include "edk-enterprise.serviceIdentity.extraStsAudiencesCsv" (dict "root" . "role" "verifier") | quote }}
            tenantas:
              client-id: {{ index .Values.serviceIdentity.clientIds "tenant-as" | quote }}
              client-secret: {{ include "edk-enterprise.serviceIdentity.clientSecretEnvInterpolation" "tenant-as" }}
              grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
              default-access-token-audience: {{ include "edk-enterprise.serviceIdentity.defaultStsAudience" (dict "root" . "role" "tenant-as") | quote }}
              allowed-access-token-audiences: {{ include "edk-enterprise.serviceIdentity.extraStsAudiencesCsv" (dict "root" . "role" "tenant-as") | quote }}
            {{- if (index .Values.services "wallet-unit").enabled }}
            wallet-unit:
              client-id: {{ index .Values.serviceIdentity.clientIds "wallet-unit" | quote }}
              client-secret: {{ include "edk-enterprise.serviceIdentity.clientSecretEnvInterpolation" "wallet-unit" }}
              grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
              default-access-token-audience: {{ include "edk-enterprise.serviceIdentity.defaultStsAudience" (dict "root" . "role" "wallet-unit") | quote }}
            {{- end }}
            {{- if (index .Values.services "wallet-interaction").enabled }}
            wallet-interaction:
              client-id: {{ index .Values.serviceIdentity.clientIds "wallet-interaction" | quote }}
              client-secret: {{ include "edk-enterprise.serviceIdentity.clientSecretEnvInterpolation" "wallet-interaction" }}
              grant-types: "client_credentials,urn:ietf:params:oauth:grant-type:token-exchange"
              default-access-token-audience: {{ include "edk-enterprise.serviceIdentity.defaultStsAudience" (dict "root" . "role" "wallet-interaction") | quote }}
              allowed-access-token-audiences: {{ include "edk-enterprise.serviceIdentity.extraStsAudiencesCsv" (dict "root" . "role" "wallet-interaction") | quote }}
            {{- end }}
          {{- end }}
        platform:
          # Application bootstrap provisions the control-plane AS with slug
          # `platform`; keep key materialization enabled for that instance as well.
          signing-key:
            auto-generate: true
      clients:
        {{- if .Values.portalBff.existingSecret }}
        admin-console-portal-bff:
          client-id: {{ .Values.portalBff.clientId | quote }}
          client-name: Admin Console Portal BFF
          client-secret-id: sec_admin_console_portal_bff_01
          client-type: confidential
          grant-types: client_credentials
          allowed-scopes: {{ .Values.portalBff.scope | quote }}
          default-access-token-audience: {{ .Values.portalBff.audience | quote }}
          token-endpoint-auth-method: client_secret_basic
        {{- end }}
        platform-operator-cli:
          client-id: platform-operator-cli
          client-name: Platform Operator CLI
          client-type: public
          grant-types: "authorization_code,urn:ietf:params:oauth:grant-type:token-exchange"
          redirect-uris:
            - ${env:ONBOARDING_UI_BASE_URL}/admin-console/callback
            - ${env:ONBOARDING_UI_BASE_URL}/onboarding/callback
          post-logout-redirect-uris: "${env:ONBOARDING_UI_BASE_URL}/admin-console"
          allowed-scopes: openid
          default-access-token-audience: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "platform") | quote }}
          token-endpoint-auth-method: none
        {{- if .Values.docsPlayground.enabled }}
        # Public docs playground client: authorization code + required PKCE + required PAR.
        docs-playground:
          client-id: {{ .Values.docsPlayground.clientId | quote }}
          client-name: Documentation site playground
          client-type: public
          grant-types: "authorization_code,refresh_token,urn:ietf:params:oauth:grant-type:token-exchange"
          response-types: code
          redirect-uris:
            {{- range .Values.docsPlayground.origins }}
            - {{ printf "%s/docs-env/callback" . | quote }}
            {{- end }}
          post-logout-redirect-uris: {{ .Values.docsPlayground.origins | join "," | quote }}
          allowed-scopes: openid,profile,email
          require-pkce: true
          require-pushed-authorization-requests: true
          token-endpoint-auth-method: none
        {{- end }}
    {{- if .Values.docsPlayground.enabled }}
    docs:
      playground:
        enabled: "true"
        client-id: {{ .Values.docsPlayground.clientId | quote }}
        origins: {{ .Values.docsPlayground.origins | join "," | quote }}
    {{- end }}
    # The platform AS itself is the operator sign-in surface; an operator signs
    # in without an application binding and is resolved tenant-wide.
    auth:
      login:
        require-application: false
    {{- if $bootstrap.allowLocalHttpAs }}
    # The platform serves its hosted AS over loopback HTTP for a local cluster.
    # Production keeps the SSRF guard strict; opt in only for local testing.
    vdx:
      hosted-as-readiness:
        allow-local-http: true
    {{- end }}
    # Authenticated workload clients the platform trusts on east-west command
    # transport. Each local label is bound to the client id in the validated JWT.
    # The satellites read config and the license-state projection through these.
    security:
      workload-trust-policy:
        trusted_service_ids:
          - {{ index .Values.serviceIdentity.serviceIds "tenant-kms" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "did" | quote }}
          {{- if (index .Values.services "blob").enabled }}
          - {{ index .Values.serviceIdentity.serviceIds "blob" | quote }}
          {{- end }}
          - {{ index .Values.serviceIdentity.serviceIds "issuer" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "verifier" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "tenant-as" | quote }}
          {{- if (index .Values.services "wallet-unit").enabled }}
          - {{ index .Values.serviceIdentity.serviceIds "wallet-unit" | quote }}
          {{- end }}
          {{- if (index .Values.services "wallet-interaction").enabled }}
          - {{ index .Values.serviceIdentity.serviceIds "wallet-interaction" | quote }}
          {{- end }}
        service_client_bindings:
          "[{{ index .Values.serviceIdentity.serviceIds "tenant-kms" }}]": {{ index .Values.serviceIdentity.clientIds "tenant-kms" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "did" }}]": {{ index .Values.serviceIdentity.clientIds "did" | quote }}
          {{- if (index .Values.services "blob").enabled }}
          "[{{ index .Values.serviceIdentity.serviceIds "blob" }}]": {{ index .Values.serviceIdentity.clientIds "blob" | quote }}
          {{- end }}
          "[{{ index .Values.serviceIdentity.serviceIds "issuer" }}]": {{ index .Values.serviceIdentity.clientIds "issuer" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "verifier" }}]": {{ index .Values.serviceIdentity.clientIds "verifier" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "tenant-as" }}]": {{ index .Values.serviceIdentity.clientIds "tenant-as" | quote }}
          {{- if (index .Values.services "wallet-unit").enabled }}
          "[{{ index .Values.serviceIdentity.serviceIds "wallet-unit" }}]": {{ index .Values.serviceIdentity.clientIds "wallet-unit" | quote }}
          {{- end }}
          {{- if (index .Values.services "wallet-interaction").enabled }}
          "[{{ index .Values.serviceIdentity.serviceIds "wallet-interaction" }}]": {{ index .Values.serviceIdentity.clientIds "wallet-interaction" | quote }}
          {{- end }}
    {{- if and .Values.serviceIdentity.internalClientExistingSecret (or (index .Values.services "tenant-kms").enabled (index .Values.services "tenant-as").enabled) }}
    transport:
      routing:
        modules:
          {{- if (index .Values.services "tenant-kms").enabled }}
          # Deployment coordinates only. Tenant provisioning selects SERVER for
          # customer-tenant sessions; platform/anonymous sessions remain LOCAL.
          kms:
            serviceTokenAudience: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "tenant-kms") | quote }}
            # Tenant provisioning starts from an operator request, but tenant-KMS
            # accepts only the platform's dedicated workload identity. Never
            # forward the incoming operator bearer across this trust boundary.
            preferServiceTokenOverSessionBearer: true
            services:
              key:
                transport: GRPC
                endpoint: {{ printf "grpc://%s-tenant-kms-authority-bootstrap:%v" (include "edk-enterprise.fullname" .) .Values.grpc.port | quote }}
              # Typed key-resource operations are a separate service namespace.
              # Customer tenant sessions route them to tenant-KMS while the
              # application tenant continues to select LOCAL.
              leaf:
                transport: GRPC
                endpoint: {{ printf "grpc://%s-tenant-kms-authority-bootstrap:%v" (include "edk-enterprise.fullname" .) .Values.grpc.port | quote }}
              mac:
                transport: GRPC
                endpoint: {{ printf "grpc://%s-tenant-kms-authority-bootstrap:%v" (include "edk-enterprise.fullname" .) .Values.grpc.port | quote }}
              encryption:
                transport: GRPC
                endpoint: {{ printf "grpc://%s-tenant-kms-authority-bootstrap:%v" (include "edk-enterprise.fullname" .) .Values.grpc.port | quote }}
          {{- end }}
          {{- if (index .Values.services "tenant-as").enabled }}
          # A tenant's authorization server owns its signing-key store. Registration provisions
          # the key material and hands the descriptor to that service rather than writing into
          # the store behind its database route. The tenant AS serves no gRPC port, so this
          # travels over the ordinary command transport.
          # Unlike the KMS routes, this one is never session-dependent: the platform tenant
          # registers its own key in process and never issues this command, so every call it does
          # issue addresses a tenant served elsewhere. The target is pinned rather than defaulted
          # because the platform deliberately carries no local implementation to fall back to.
          # Registration exchanges an STS session for the addressed tenant with exactly this
          # audience before it issues the command, so the bearer on the session already carries
          # the tenant binding. Preferring a workload token here would discard that binding, and
          # the platform registers no authorization-server client role to mint one with.
          "[oauth2-as-admin]":
            target: SERVER
            serviceTokenAudience: {{ include "edk-enterprise.serviceAudience" (dict "root" . "name" "tenant-as") | quote }}
            preferServiceTokenOverSessionBearer: false
            services:
              "[signing-key]":
                target: SERVER
                transport: HTTP
                endpoint: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "tenant-as")) (index .Values.services "tenant-as").restPort | quote }}
          {{- end }}
    {{- end }}
    # First-boot operator owner and installation identity for the control-plane.
    app:
      deployment-mode: {{ $bootstrap.deploymentMode | quote }}
    platform:
      # Every satellite that consumes the remote platform configuration source must
      # be authorized from the same canonical actor list as secret resolution.
      config-distribution:
        allowed-service-actors: {{ join "," $secretBootstrapActors | quote }}
      setup:
        license-request:
          default-alias: {{ .Values.platform.setup.licenseRequest.defaultAlias | quote }}
          default-algorithm: {{ .Values.platform.setup.licenseRequest.defaultAlgorithm | quote }}
          default-use: {{ .Values.platform.setup.licenseRequest.defaultUse | quote }}
      sts:
        workload-client-id: {{ index .Values.serviceIdentity.clientIds "tenant-kms" | quote }}
        secret-bootstrap-workload-client-ids: {{ join "," $secretBootstrapActors | quote }}
        {{- $stsAudiences := list (include "edk-enterprise.serviceAudience" (dict "root" . "name" "platform")) (include "edk-enterprise.serviceAudience" (dict "root" . "name" "tenant-kms")) (include "edk-enterprise.serviceAudience" (dict "root" . "name" "did")) (include "edk-enterprise.serviceAudience" (dict "root" . "name" "tenant-as")) (include "edk-enterprise.serviceAudience" (dict "root" . "name" "issuer")) (include "edk-enterprise.serviceAudience" (dict "root" . "name" "verifier")) -}}
        {{- if (index .Values.services "blob").enabled }}{{- $stsAudiences = append $stsAudiences (include "edk-enterprise.serviceAudience" (dict "root" . "name" "blob")) -}}{{- end }}
        {{- if (index .Values.services "wallet-unit").enabled }}{{- $stsAudiences = append $stsAudiences (include "edk-enterprise.serviceAudience" (dict "root" . "name" "wallet-unit")) -}}{{- end }}
        {{- if (index .Values.services "wallet-interaction").enabled }}{{- $stsAudiences = append $stsAudiences (include "edk-enterprise.serviceAudience" (dict "root" . "name" "wallet-interaction")) -}}{{- end }}
        allowed-audiences: {{ join "," $stsAudiences | quote }}
        {{- $platformSts := (.Values.platform).sts | default dict }}
        {{- if and (hasKey $platformSts "provisioningRoleClientIds") (not (kindIs "invalid" $platformSts.provisioningRoleClientIds)) }}
        # Clients whose exchanged tenant tokens carry the dedicated tenant-provisioning role
        # required by the tenant AS bootstrap trust window. Omitting the value applies the
        # built-in default (operator CLI plus the secret-bootstrap workload client ids);
        # an explicit empty string sanctions nobody.
        provisioning-role-client-ids: {{ $platformSts.provisioningRoleClientIds | quote }}
        {{- end }}
      onboarding:
        installation-base-domain: {{ .Values.global.platformBaseDomain | quote }}
        deployment-id: {{ .Values.platform.onboarding.deploymentId | quote }}
        {{- if $licenseTrust.rootCaPath }}
        trust-bundle-path: {{ $licenseTrust.rootCaPath | quote }}
        {{- end }}
        {{- if $bootstrap.automatic }}
        operator:
          email: {{ required "platform.bootstrap.owner.email is required when platform.bootstrap.automatic=true" $bootstrap.owner.email | quote }}
          display-name: {{ required "platform.bootstrap.owner.displayName is required when platform.bootstrap.automatic=true" $bootstrap.owner.displayName | quote }}
          {{- if and $bootstrap.automatic $bootstrap.ownerInitialCredential }}
          initial-credential: ${env:EDK_OWNER_INITIAL_CREDENTIAL}
          {{- end }}
        {{- end }}
      config:
        mount-path: /app/config
    # Software KMS providers. The platform holds its own keystore, the
    # license-request instance cert, and the platform signing material. The owner
    # bootstrap derives a blind index for the operator's email through the
    # software provider, so it must be present.
    kms:
      providers:
        software:
          id: software
          type: software
          enabled: true
          exposePrivateKeysDuringGeneration: false
          persistKeysDuringGeneration: true
          autoCreateCertificate: true
          keystore:
            type: pkcs12
            id: software
            password: ${env:EDK_KEYSTORE_PASSWORD}
            keystoreRoot: /keystore
        license:
          id: license
          type: software
          enabled: true
          autoCreateCertificate: true
          keystore:
            type: pkcs12
            id: license
            password: ${env:EDK_KEYSTORE_PASSWORD}
            keystoreRoot: /keystore
        platform:
          id: platform
          type: software
          enabled: true
          autoCreateCertificate: true
          keystore:
            type: pkcs12
            id: platform
            password: ${env:EDK_KEYSTORE_PASSWORD}
            keystoreRoot: /keystore
    # KMS role bindings the hosted-AS provisioning and credential signing resolve
    # signing keys through (JOSE algorithm names).
    crypto:
      kms:
        roles:
          invitation:
            hmac-kek:
              # Keep the wrapping key in the persisted platform PKCS12 provider.
              provider: platform
          oauth2-as:
            algorithm: ES256
            default:
              algorithm: ES256
          issuer-signing:
            algorithm: ES256
          issuer-request-decryption:
            algorithm: ES256
          verifier-request-object-signing:
            algorithm: ES256
    # Tenant resolution. The platform host resolves through the installation base
    # domain; the platform's own in-container and loopback hosts map directly to
    # the `platform` tenant so operator and east-west surfaces resolve without a
    # registry lookup.
    tenant:
      resolution:
        # The platform owns the tenant authority database. Avoid a startup
        # routing/config-source cycle by selecting the local repository
        # explicitly; satellite ConfigMaps set this to true.
        remote: false
        platform:
          base-domain: {{ .Values.global.platformBaseDomain | quote }}
          subdomain:
            enabled: true
        custom-domain:
          enabled: true
        self:
          # Every in-cluster name the platform answers HTTP on, including the
          # bootstrap authority Service satellites mint their workload tokens
          # against. A name missing here reaches tenant resolution as an
          # unknown host and fails closed, so east-west calls to /token and
          # /.well-known/jwks.json are refused before the endpoint runs.
          tenant-id: "platform"
          hosts: {{ printf "%s,%s:%v,%s-platform-authority-bootstrap,%s-platform-authority-bootstrap:%v,localhost,platform.%s%s" (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) (.Values.services.platform.restPort) (include "edk-enterprise.fullname" .) (include "edk-enterprise.fullname" .) (.Values.services.platform.restPort) .Values.global.platformBaseDomain (.Values.platform.bootstrap.selfHostsExtra | default "") | quote }}
      {{- if and $bootstrap.automatic $bootstrap.ownerInitialCredential }}
      platform:
        owner:
          initial-credential: ${env:EDK_OWNER_INITIAL_CREDENTIAL}
      {{- end }}
      onboarding:
        operator:
          enabled: true
      registration:
        # Customer instance identifiers are server-issued at registration time, so per-instance
        # `signing-key.auto-generate` rows cannot exist in deployment configuration. This is the
        # one deployment decision that registration provisions product keys; a deployment bringing
        # externally provisioned keys leaves it unset and registration fails closed instead.
        signing-key:
          auto-generate: true
    # East-west reachability for registration-time signing-key provisioning. The
    # platform connects to the tenant services at these internal addresses and
    # carries the public tenant host in the Host header, so a freshly created
    # tenant is provisioned without resolving its public {tenant}.{base} subdomain
    # from inside the cluster network. The tenant AS seeds its own AS signing key;
    # the platform provisions the issuer/verifier signing keys directly in the
    # tenant KMS over its REST API.
    east-west:
      platform:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) ((index .Values.services "platform").restPort) | quote }}
      {{- if (index .Values.services "tenant-as").enabled }}
      tenant-as:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "tenant-as")) ((index .Values.services "tenant-as").restPort) | quote }}
      {{- end }}
      {{- if (index .Values.services "tenant-kms").enabled }}
      tenant-kms:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "tenant-kms")) ((index .Values.services "tenant-kms").restPort) | quote }}
      {{- end }}
      {{- if (index .Values.services "did").enabled }}
      tenant-did:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "did")) ((index .Values.services "did").restPort) | quote }}
      {{- end }}
      {{- if (index .Values.services "issuer").enabled }}
      tenant-issuer:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "issuer")) ((index .Values.services "issuer").restPort) | quote }}
      {{- end }}
      {{- if (index .Values.services "verifier").enabled }}
      tenant-verifier:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "verifier")) ((index .Values.services "verifier").restPort) | quote }}
      {{- end }}
    # License trust anchor and recipient binding. The platform is the local
    # licensing authority; it trusts the installed license bundle's root CA via
    # this path, and decrypts the license envelope with the recipient key it
    # imports from the bundle into the named KMS provider.
    license:
      deployment-role: platform
      recipient:
        key-id: {{ $licenseTrust.recipientKeyId | quote }}
        kms:
          enabled: true
          alias: {{ $licenseTrust.recipientKmsAlias | quote }}
      trust:
        embedded:
          enabled: {{ $licenseTrust.embeddedEnabled }}
        {{- if $licenseTrust.rootCaPath }}
        root-ca-bundle-path: {{ $licenseTrust.rootCaPath | quote }}
        {{- end }}
{{- end }}
{{- end }}
