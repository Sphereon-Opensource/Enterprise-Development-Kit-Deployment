{{- /*
Platform active-profile configuration overlay.

The platform service reads this file as its container-profile overlay
(application-container.yml). It merges on top of the image's baked-in
configuration and the environment configuration, supplying the keys an
environment variable name cannot express, including the platform tenant
datasource and the hyphenated control-plane bootstrap keys.

Two concerns live here:

  1. Platform tenant datasource - the system platform tenant is control-plane
     state and is bound to the platform database. Customer tenant workload state
     stays in the separate tenant workload database. Credentials resolve from
     the platform database Secret through the EDK_PLATFORM_DB_* values injected
     into the platform container.

  2. Control-plane bootstrap — the platform provisions its `platform` tenant,
     hosted authorization server, and operator owner on first boot. These inputs
     are hyphenated keys, so they are supplied here rather than as environment
     variables. The license root-CA trust anchor path is set here too so the
     platform trusts the installed license bundle.

Rendered only for the platform service.
*/ -}}
{{- if .Values.database.enabled }}
{{- $platformDb := .Values.database.platform }}
{{- $bootstrap := .Values.platform.bootstrap }}
{{- $licenseTrust := .Values.license.trust }}
{{- if ne $bootstrap.issuer .Values.platform.externalBaseUrl }}
{{- fail "platform.bootstrap.issuer must equal platform.externalBaseUrl; the platform AS issuer has a single canonical public origin" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-platform-db-override
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
data:
  # Delivered as the platform's base application.yml. The image bakes no
  # application.yml, so this is the platform's authoritative file configuration;
  # it merges over the environment configuration and supplies the keys an
  # environment variable name cannot express (the platform tenant datasource
  # and the hyphenated control-plane bootstrap keys).
  application.yml: |
    server:
      rest:
        auth:
          anonymous-path-prefixes: {{ index .Values.serviceIdentity.anonymousPathPrefixes "platform" | quote }}
          # The platform AS stamps tokens with the public issuer, but validates
          # them by fetching JWKS through the in-cluster service. This keeps
          # operator token validation independent from external gateway TLS
          # trust inside the service containers.
          issuer: ${env:EXTERNAL_BASE_URL}
          jwks-uri: {{ printf "http://%s:%v/.well-known/jwks.json" (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) ((index .Values.services "platform").restPort) | quote }}
    cors:
      origins: ${env:ONBOARDING_UI_BASE_URL}
    database:
      tenants:
        # The platform process creates tenant registry/control-plane rows during
        # registration. It does not receive tenant workload DB credentials, so
        # dynamic tenant ids must resolve to the platform DB inside this process.
        default:
          dialect: {{ .Values.database.dialect }}
          isolation: shared
          host: {{ $platformDb.host }}
          port: {{ $platformDb.port }}
          database: {{ $platformDb.name }}
          username: ${env:EDK_PLATFORM_DB_USERNAME}
          password: ${env:EDK_PLATFORM_DB_PASSWORD}
        platform:
          dialect: {{ .Values.database.dialect }}
          isolation: shared
          host: {{ $platformDb.host }}
          port: {{ $platformDb.port }}
          database: {{ $platformDb.name }}
          username: ${env:EDK_PLATFORM_DB_USERNAME}
          password: ${env:EDK_PLATFORM_DB_PASSWORD}
    # Control-plane bootstrap inputs for the `platform` tenant, its hosted
    # authorization server, and the operator owner. The platform provisions
    # these on first boot and the steps are idempotent across restarts.
    application:
      bff:
        oauth-client:
          workload-audience: {{ .Values.portalBff.audience | quote }}
          workload-scope: {{ .Values.portalBff.scope | quote }}
          workload-client-id: {{ .Values.portalBff.clientId | quote }}
          kms:
            provider-id: {{ .Values.portalBff.kms.providerId | quote }}
            encryption-key-id: {{ .Values.portalBff.kms.encryptionKeyAlias | quote }}
            handle-hmac-key-id: {{ .Values.portalBff.kms.handleHmacKeyAlias | quote }}
      admin:
        secret-backend:
          type: {{ .Values.platform.secretBackend.type | quote }}
      tenant:
        hosted-as:
          issuer: {{ $bootstrap.issuer | quote }}
        owner:
          email: {{ $bootstrap.owner.email | quote }}
          display-name: {{ $bootstrap.owner.displayName | quote }}
          {{- with $bootstrap.owner.roles }}
          roles: {{ . | quote }}
          {{- end }}
    # The platform hosts its own authorization server for operator sign-in and
    # the operator->tenant token exchange the admin console drives.
    oauth2:
      user-provider:
        mode: {{ $bootstrap.userProviderMode | quote }}
      servers:
        default:
          mode: HOSTED
          signing-key:
            auto-generate: true
          issuer: ${env:EXTERNAL_BASE_URL}
          oidc: SUPPORTED
          logout: SUPPORTED
          pkce: REQUIRED
          token-format: JWT
          scopes-supported: "openid,profile,email"
          grant-types-enabled: "authorization_code,urn:ietf:params:oauth:grant-type:pre-authorized_code,client_credentials,refresh_token,urn:ietf:params:oauth:grant-type:token-exchange"
          public-clients:
            allow-any: true
            permissive-redirect-uri: true
          {{- if .Values.serviceIdentity.internalClientExistingSecret }}
          internal-clients:
            issuer:
              client-id: {{ index .Values.serviceIdentity.clientIds "issuer" | quote }}
              client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
              default-access-token-audience: {{ index .Values.serviceIdentity.audiences "platform" | quote }}
              allowed-access-token-audiences: {{ join "," (list (index .Values.serviceIdentity.audiences "tenant-kms") (index .Values.serviceIdentity.audiences "wallet-interaction")) | quote }}
            kms:
              client-id: {{ index .Values.serviceIdentity.clientIds "tenant-kms" | quote }}
              client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
              default-access-token-audience: {{ index .Values.serviceIdentity.audiences "platform" | quote }}
            did:
              client-id: {{ index .Values.serviceIdentity.clientIds "did" | quote }}
              client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
              default-access-token-audience: {{ index .Values.serviceIdentity.audiences "platform" | quote }}
              allowed-access-token-audiences: {{ index .Values.serviceIdentity.audiences "tenant-kms" | quote }}
            verifier:
              client-id: {{ index .Values.serviceIdentity.clientIds "verifier" | quote }}
              client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
              default-access-token-audience: {{ index .Values.serviceIdentity.audiences "platform" | quote }}
              allowed-access-token-audiences: {{ join "," (list (index .Values.serviceIdentity.audiences "tenant-kms") (index .Values.serviceIdentity.audiences "wallet-interaction")) | quote }}
            tenantas:
              client-id: {{ index .Values.serviceIdentity.clientIds "tenant-as" | quote }}
              client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
              default-access-token-audience: {{ index .Values.serviceIdentity.audiences "platform" | quote }}
              allowed-access-token-audiences: {{ index .Values.serviceIdentity.audiences "tenant-kms" | quote }}
            wallet-unit:
              client-id: {{ index .Values.serviceIdentity.clientIds "wallet-unit" | quote }}
              client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
              default-access-token-audience: {{ index .Values.serviceIdentity.audiences "platform" | quote }}
            wallet-interaction:
              client-id: {{ index .Values.serviceIdentity.clientIds "wallet-interaction" | quote }}
              client-secret: ${env:EDK_INTERNAL_CLIENT_SECRET}
              default-access-token-audience: {{ index .Values.serviceIdentity.audiences "platform" | quote }}
              allowed-access-token-audiences: {{ index .Values.serviceIdentity.audiences "wallet-unit" | quote }}
          {{- end }}
        platform:
          # Application bootstrap provisions the control-plane AS with slug
          # `platform`; keep key materialization enabled for that instance as well.
          signing-key:
            auto-generate: true
      clients:
        admin-console-portal-bff:
          client-id: {{ .Values.portalBff.clientId | quote }}
          client-name: Admin Console Portal BFF
          client-secret: ${env:ADMIN_CONSOLE_WORKLOAD_CLIENT_SECRET}
          client-type: confidential
          grant-types: client_credentials
          allowed-scopes: {{ .Values.portalBff.scope | quote }}
          default-access-token-audience: {{ .Values.portalBff.audience | quote }}
          token-endpoint-auth-method: client_secret_basic
        platform-operator-cli:
          client-id: platform-operator-cli
          client-name: Platform Operator CLI
          client-type: public
          grant-types: "authorization_code,urn:ietf:params:oauth:grant-type:token-exchange"
          redirect-uris:
            - ${env:ONBOARDING_UI_BASE_URL}/admin-console/callback
            - ${env:ONBOARDING_UI_BASE_URL}/onboarding/callback
          post-logout-redirect-uris: "${env:ONBOARDING_UI_BASE_URL}/admin-console"
          allowed-scopes: openid
          token-endpoint-auth-method: none
    # The platform AS itself is the operator sign-in surface; an operator signs
    # in without an application binding and is resolved tenant-wide.
    auth:
      login:
        require-application: false
    {{- if $bootstrap.allowLocalHttpAs }}
    # The platform serves its hosted AS over loopback HTTP for a local cluster.
    # Production keeps the SSRF guard strict; opt in only for local testing.
    vdx:
      hosted-as-readiness:
        allow-local-http: true
    {{- end }}
    # Workload identities the platform trusts on east-west command-transport calls
    # (the gRPC X-Service-Id), each bound to the client id of the service token the
    # caller presents. The satellites read config and the license-state projection
    # through these, so the platform must recognise them.
    security:
      header-trust-policy:
        trusted_service_ids:
          - {{ index .Values.serviceIdentity.serviceIds "tenant-kms" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "did" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "issuer" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "verifier" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "tenant-as" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "wallet-unit" | quote }}
          - {{ index .Values.serviceIdentity.serviceIds "wallet-interaction" | quote }}
        service_client_bindings:
          "[{{ index .Values.serviceIdentity.serviceIds "tenant-kms" }}]": {{ index .Values.serviceIdentity.clientIds "tenant-kms" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "did" }}]": {{ index .Values.serviceIdentity.clientIds "did" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "issuer" }}]": {{ index .Values.serviceIdentity.clientIds "issuer" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "verifier" }}]": {{ index .Values.serviceIdentity.clientIds "verifier" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "tenant-as" }}]": {{ index .Values.serviceIdentity.clientIds "tenant-as" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "wallet-unit" }}]": {{ index .Values.serviceIdentity.clientIds "wallet-unit" | quote }}
          "[{{ index .Values.serviceIdentity.serviceIds "wallet-interaction" }}]": {{ index .Values.serviceIdentity.clientIds "wallet-interaction" | quote }}
    # First-boot operator owner and installation identity for the control-plane.
    app:
      deployment-mode: {{ $bootstrap.deploymentMode | quote }}
    platform:
      setup:
        license-request:
          default-alias: {{ .Values.platform.setup.licenseRequest.defaultAlias | quote }}
          default-algorithm: {{ .Values.platform.setup.licenseRequest.defaultAlgorithm | quote }}
          default-use: {{ .Values.platform.setup.licenseRequest.defaultUse | quote }}
      admin-console:
        sts:
          allowed-audiences: {{ join "," (list (index .Values.serviceIdentity.audiences "platform") (index .Values.serviceIdentity.audiences "tenant-kms") (index .Values.serviceIdentity.audiences "did") (index .Values.serviceIdentity.audiences "issuer") (index .Values.serviceIdentity.audiences "verifier") (index .Values.serviceIdentity.audiences "wallet-unit") (index .Values.serviceIdentity.audiences "wallet-interaction")) | quote }}
      onboarding:
        installation-base-domain: {{ .Values.global.platformBaseDomain | quote }}
        deployment-id: {{ .Values.platform.onboarding.deploymentId | quote }}
        {{- if $licenseTrust.rootCaPath }}
        trust-bundle-path: {{ $licenseTrust.rootCaPath | quote }}
        {{- end }}
        operator:
          email: {{ $bootstrap.owner.email | quote }}
          display-name: {{ $bootstrap.owner.displayName | quote }}
          {{- if and $bootstrap.automatic $bootstrap.ownerInitialCredential }}
          initial-credential: ${env:EDK_OWNER_INITIAL_CREDENTIAL}
          {{- end }}
      config:
        mount-path: /app/config
    # Software KMS providers. The platform holds its own keystore, the
    # license-request instance cert, and the platform signing material. The owner
    # bootstrap derives a blind index for the operator's email through the
    # software provider, so it must be present.
    kms:
      providers:
        software:
          id: software
          type: software
          enabled: true
          autoCreateCertificate: true
          keystore:
            type: pkcs12
            id: software
            password: ${env:EDK_KEYSTORE_PASSWORD}
            keystoreRoot: /keystore
        license:
          id: license
          type: software
          enabled: true
          autoCreateCertificate: true
          keystore:
            type: pkcs12
            id: license
            password: ${env:EDK_KEYSTORE_PASSWORD}
            keystoreRoot: /keystore
        platform:
          id: platform
          type: software
          enabled: true
          autoCreateCertificate: true
          keystore:
            type: pkcs12
            id: platform
            password: ${env:EDK_KEYSTORE_PASSWORD}
            keystoreRoot: /keystore
    # KMS role bindings the hosted-AS provisioning and credential signing resolve
    # signing keys through (JOSE algorithm names).
    crypto:
      kms:
        roles:
          oauth2-as:
            algorithm: ES256
            default:
              algorithm: ES256
          issuer-signing:
            algorithm: ES256
          issuer-request-decryption:
            algorithm: ES256
          verifier-request-object-signing:
            algorithm: ES256
    # Tenant resolution. The platform host resolves through the installation base
    # domain; the platform's own in-container and loopback hosts map directly to
    # the `platform` tenant so operator and east-west surfaces resolve without a
    # registry lookup.
    tenant:
      resolution:
        platform:
          base-domain: {{ .Values.global.platformBaseDomain | quote }}
          subdomain:
            enabled: true
        custom-domain:
          enabled: true
        self:
          tenant-id: "platform"
          hosts: {{ printf "%s,%s:%v,localhost,platform.%s%s" (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) (.Values.services.platform.restPort) .Values.global.platformBaseDomain (.Values.platform.bootstrap.selfHostsExtra | default "") | quote }}
      {{- if and $bootstrap.automatic $bootstrap.ownerInitialCredential }}
      platform:
        owner:
          initial-credential: ${env:EDK_OWNER_INITIAL_CREDENTIAL}
      {{- end }}
      onboarding:
        operator:
          enabled: true
    # East-west reachability for registration-time signing-key provisioning. The
    # platform connects to the tenant services at these internal addresses and
    # carries the public tenant host in the Host header, so a freshly created
    # tenant is provisioned without resolving its public {tenant}.{base} subdomain
    # from inside the cluster network. The tenant AS seeds its own AS signing key;
    # the platform provisions the issuer/verifier signing keys directly in the
    # tenant KMS over its REST API.
    east-west:
      platform:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "platform")) ((index .Values.services "platform").restPort) | quote }}
      {{- if (index .Values.services "tenant-as").enabled }}
      tenant-as:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "tenant-as")) ((index .Values.services "tenant-as").restPort) | quote }}
      {{- end }}
      {{- if (index .Values.services "tenant-kms").enabled }}
      tenant-kms:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "tenant-kms")) ((index .Values.services "tenant-kms").restPort) | quote }}
      {{- end }}
      {{- if (index .Values.services "did").enabled }}
      tenant-did:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "did")) ((index .Values.services "did").restPort) | quote }}
      {{- end }}
      {{- if (index .Values.services "issuer").enabled }}
      tenant-issuer:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "issuer")) ((index .Values.services "issuer").restPort) | quote }}
      {{- end }}
      {{- if (index .Values.services "verifier").enabled }}
      tenant-verifier:
        base-url: {{ printf "http://%s:%v" (include "edk-enterprise.serviceName" (dict "root" . "name" "verifier")) ((index .Values.services "verifier").restPort) | quote }}
      {{- end }}
    # License trust anchor and recipient binding. The platform is the local
    # licensing authority; it trusts the installed license bundle's root CA via
    # this path, and decrypts the license envelope with the recipient key it
    # imports from the bundle into the named KMS provider.
    license:
      deployment-role: platform
      recipient:
        key-id: {{ $licenseTrust.recipientKeyId | quote }}
        kms:
          enabled: true
          alias: {{ $licenseTrust.recipientKmsAlias | quote }}
      trust:
        embedded:
          enabled: {{ $licenseTrust.embeddedEnabled }}
        {{- if $licenseTrust.rootCaPath }}
        root-ca-bundle-path: {{ $licenseTrust.rootCaPath | quote }}
        {{- end }}
{{- end }}
