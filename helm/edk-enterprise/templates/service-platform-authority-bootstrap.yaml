{{- if and (eq (include "edk-enterprise.topologyMode" .) "distributed") (index .Values.services "platform").enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-platform-authority-bootstrap
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-authority-bootstrap
spec:
  type: ClusterIP
  # This narrowly selected authority endpoint must exist while the platform performs mandatory
  # reconciliation and is intentionally still unready for normal REST and gRPC traffic. It carries
  # the command transport plus the REST surfaces satellites need to obtain and validate their
  # workload identity (`/token`, `/.well-known/jwks.json`) before the platform reports ready.
  publishNotReadyAddresses: true
  selector:
    {{- include "edk-enterprise.selectorLabels" (dict "root" . "name" "platform") | nindent 4 }}
    edk.sphereon.com/platform-authority-bootstrap: "true"
  ports:
    - name: rest
      port: {{ (index .Values.services "platform").restPort }}
      targetPort: rest
      protocol: TCP
    {{- if .Values.grpc.enabled }}
    - name: grpc
      port: {{ .Values.grpc.port }}
      targetPort: grpc
      protocol: TCP
    {{- end }}
{{- end }}
