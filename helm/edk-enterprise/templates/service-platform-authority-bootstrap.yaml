{{- if and .Values.grpc.enabled (index .Values.services "platform").enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edk-enterprise.fullname" . }}-platform-authority-bootstrap
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-authority-bootstrap
spec:
  type: ClusterIP
  # This narrowly selected RC3 command endpoint must exist while the platform performs mandatory
  # reconciliation and is intentionally still unready for normal REST and gRPC traffic.
  publishNotReadyAddresses: true
  selector:
    {{- include "edk-enterprise.selectorLabels" (dict "root" . "name" "platform") | nindent 4 }}
    edk.sphereon.com/platform-authority-bootstrap: "true"
  ports:
    - name: grpc
      port: {{ .Values.grpc.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
