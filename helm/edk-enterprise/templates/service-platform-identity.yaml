{{- if and (eq (include "edk-enterprise.topologyMode" .) "distributed") (index .Values.services "platform").enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edk-enterprise.identityServiceName" (dict "root" . "name" "platform") }}
  labels:
    {{- include "edk-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-identity
  annotations:
    edk.sphereon.com/readiness-path: /health/identity
spec:
  type: ClusterIP
  # Identity plane publishes not-ready addresses because kube Ready is /ready
  # on the serving Service. This is not the old catch-all bootstrap Service:
  # only tenant-KMS uses it, and the documented probe is /health/identity.
  publishNotReadyAddresses: true
  selector:
    {{- include "edk-enterprise.selectorLabels" (dict "root" . "name" "platform") | nindent 4 }}
    edk.sphereon.com/platform-identity: "true"
  ports:
    - name: rest
      port: {{ (index .Values.services "platform").restPort }}
      targetPort: rest
      protocol: TCP
    {{- if .Values.grpc.enabled }}
    - name: grpc
      port: {{ .Values.grpc.port }}
      targetPort: grpc
      protocol: TCP
    {{- end }}
{{- end }}
