# Full operator console on platform.<baseDomain>/admin-console plus the isolated
# issuer/verifier testing console for external testers on registered instance
# hosts. The Gateway exposes /testing-console/{kind}/{instanceId}, rewrites that
# page only to Next's internal /admin-console/testing-console path, and keeps the
# protocol-BFF/static support paths direct. Backend endpoint-registry access
# modes remain authoritative; routing alone does not enable an instance.
#
# The console is enabled by default in the base chart; this overlay shows the
# relevant knobs to copy/tune. Pin the operator host to your install domain.
global:
  platformBaseDomain: example.com

# Create this Secret before install. The secret value is never rendered into
# values or browser runtime configuration.
portalBff:
  existingSecret: edk-runtime-secrets
  clientSecretKey: admin-console-portal-bff-secret

services:
  admin-console:
    enabled: true
    image: admin-console
    replicas: 1
    restPort: 3000
    publicIngress:
      enabled: true
      className: public
      # Operator/platform host. Must match the platform service public host and
      # the gateway operatorHost (= platform.<baseDomain>).
      host: platform.example.com
      paths:
        - /admin-console
    env:
      - name: NEXT_PUBLIC_BASE_PATH
        value: /admin-console
      - name: PORT
        value: "3000"
