global:
  imageTag: 0.25.0-SNAPSHOT
  imagePullSecrets:
    - edk-registry-credentials
  platformBaseDomain: example.com

database:
  enabled: true
  dialect: postgresql
  platform:
    host: edk-platform.postgres.database.example.net
    port: 5432
    name: platform
    existingSecret: edk-managed-platform-postgres
    usernameKey: username
    passwordKey: password
    networkPolicy:
      ipBlock:
        cidr: 10.42.16.20/32
  tenant:
    host: edk-tenant.postgres.database.example.net
    port: 5432
    name: tenant
    existingSecret: edk-managed-tenant-postgres
    usernameKey: username
    passwordKey: password
    isolation: schema
    schemaPattern: "tenant_{id}"
    networkPolicy:
      ipBlock:
        cidr: 10.42.16.21/32

networkPolicy:
  enabled: true
  allowDnsEgress: true

# Pre-create this Secret in the release namespace. It must contain the
# per-client keys in `serviceIdentity.clientSecretKeys` and `keystore-password`;
# see the chart README.
serviceIdentity:
  internalClientExistingSecret: edk-runtime-secrets

keystore:
  existingSecret: edk-runtime-secrets
issuerPipeline:
  existingSecret: edk-issuer-pipeline-secrets
portalBff:
  existingSecret: edk-runtime-secrets
