# Single-port multi-tenant front door on Azure. Use a Gateway API implementation
# or Application Gateway setup that terminates TLS once, routes by host/path, and
# preserves the inbound Host header. Replace className with the GatewayClass
# installed in your cluster.
#
# Host preservation is mandatory: if Azure rewrites Host to the backend pool or
# service name, tenant resolution breaks.
gateway:
  enabled: true
  className: REPLACE-WITH-AZURE-GATEWAY-CLASS
  operatorHost: platform
  baseDomain: example.com
  tls:
    mode: secret
    secretName: edk-wildcard-tls
  httpRedirect: true

ingress:
  legacy:
    enabled: false
