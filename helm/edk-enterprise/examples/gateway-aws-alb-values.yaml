# Single-port multi-tenant front door on AWS. Use the Gateway API controller or
# another AWS front door that terminates TLS once, preserves the inbound Host
# header, and routes to the chart's HTTPRoutes. Replace className with the
# GatewayClass installed in your cluster.
gateway:
  enabled: true
  className: REPLACE-WITH-AWS-GATEWAY-CLASS
  operatorHost: platform
  baseDomain: example.com
  tls:
    mode: secret
    secretName: edk-wildcard-tls
  httpRedirect: true

ingress:
  legacy:
    enabled: false
