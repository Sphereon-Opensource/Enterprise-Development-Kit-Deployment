# Compatibility overlay for upgrades from 0.25.0-RC1 to 0.25.0-RC2.
#
# Pass this after the customer's maintained values file. It exists because an
# RC1 values export may contain the old empty anonymous-path values, which would
# otherwise override the corrected RC2 chart defaults. Do not carry this file
# into unrelated future upgrades; use only migration files named by that target
# release's notes.
serviceIdentity:
  anonymousPathPrefixes:
    platform: "/,/index.html,/index.txt,/setup-license,/admin-console,/_next/**,/platform-config.js,/onboarding/callback,/favicon.ico,/icon.svg,/apple-icon.png,/manifest.json,/api/platform/setup/v1,/api/platform/bootstrap/v1,/authorize,/login,/logout,/token,/.well-known,/internal/preauth,/introspect,/public/**"
    tenant-as: "/authorize,/login,/logout,/token,/par,/.well-known,/internal/preauth,/introspect"
    tenant-kms: ""
    did: "/.well-known"
    issuer: "/oid4vci,/credential,/deferredCredential,/nonce,/notification,/.well-known,/public/statuslists,/public/schema,/public/assets,/credentials/offers"
    verifier: "/oid4vp/request-uri,/oid4vp/auth/response,/.well-known"
    wallet-unit: ""
    wallet-interaction: ""
